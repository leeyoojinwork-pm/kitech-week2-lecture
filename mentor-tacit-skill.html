{font-size:20px;color:#7b7f86;line-height:1.65;margin-top:18px}.small{font-size:14px;color:#7b7f86;line-height:1.75}.muted{color:#8a8f98}.hl{color:var(--orange)}.blue{color:var(--blue)}.green{color:var(--green)}.purple{color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border-radius:22px;padding:24px;border:1px solid var(--line);background:#fff}.bluebg{background:var(--blue2);border-color:var(--blue3)}.orangebg{background:var(--orange2);border-color:var(--orange3)}.redbg{background:var(--red2);border-color:var(--red3)}.greenbg{background:var(--green2);border-color:var(--green3)}.purplebg{background:var(--purple2);border-color:var(--purple3)}.graybg{background:#f8fafc;border-color:#e2e8f0}.label{font-size:12px;font-weight:950;letter-spacing:.02em;color:#9ca3af;text-transform:uppercase;margin-bottom:10px}.label.orange{color:var(--orange)}.label.blue{color:var(--blue)}.label.red{color:var(--red)}.label.green{color:var(--green)}.label.purple{color:var(--purple)}.ctitle{font-size:20px;font-weight:950;letter-spacing:-.035em;line-height:1.32;margin-bottom:10px}.cbody{font-size:15px;color:#6b7280;line-height:1.72}.cbody b{color:#111827}.callout{border-radius:20px;padding:19px 23px;margin-top:18px;font-size:17px;line-height:1.65;font-weight:760}.callout.orange{background:var(--orange2);border:1px solid var(--orange3);color:#9a3412}.callout.blue{background:var(--blue2);border:1px solid var(--blue3);color:#1d4ed8}.callout.green{background:var(--green2);border:1px solid var(--green3);color:#047857}.callout.purple{background:var(--purple2);border:1px solid var(--purple3);color:#5b21b6}.callout.dark{background:#111827;color:#fff}.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;padding:8px 15px;font-size:14px;font-weight:850;color:#6b7280}.pill.orange{background:var(--orange2);border-color:var(--orange3);color:var(--orange)}.pill.blue{background:var(--blue2);border-color:var(--blue3);color:var(--blue)}.pill.green{background:var(--green2);border-color:var(--green3);color:var(--green)}.pill.purple{background:var(--purple2);border-color:var(--purple3);color:var(--purple)}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px;border-radius:18px;border:1px solid var(--line);background:#fff;margin-bottom:12px}.num{width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.num.red{background:var(--red)}.num.orange{background:var(--orange)}.num.green{background:var(--green)}.num.purple{background:var(--purple)}.step strong{display:block;font-size:18px;letter-spacing:-.035em;margin-bottom:5px}.step span{font-size:15px;color:#6b7280;line-height:1.65}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.table th{background:#f8fafc;font-size:13px;color:#6b7280;text-align:left;padding:14px 16px}.table td{padding:15px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.65;vertical-align:top}.table td:first-child{font-weight:900;color:#111827}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7;color:#374151}.bigquote{font-size:30px;line-height:1.45;letter-spacing:-.055em;font-weight:950;text-align:center;color:#111827}.arrow{font-size:24px;color:#cbd5e1;font-weight:950;display:flex;align-items:center;justify-content:center}.caseTag{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:18px}.caseTag.red{background:var(--red2);color:var(--red);border:1px solid var(--red3)}.caseTag.orange{background:var(--orange2);color:var(--orange);border:1px solid var(--orange3)}.caseTag.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}.caseTag.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}.twoflow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.notes{position:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}

/* Design-system alignment: KITECH 운영용 강의자료 톤 */
:root{
  --bg:#fafaf9;--paper:#fff;--ink:#2c2c2c;--text:#2c2c2c;--muted:#6b6b6b;--sub:#8a8a8a;
  --blue:#2563eb;--blue2:rgba(37,99,235,.08);--blue3:rgba(37,99,235,.25);
  --orange:#b45309;--orange2:rgba(180,83,9,.08);--orange3:rgba(180,83,9,.22);
  --red:#b91c1c;--red2:rgba(185,28,28,.07);--red3:rgba(185,28,28,.22);
  --green:#0f766e;--green2:rgba(15,118,110,.08);--green3:rgba(15,118,110,.24);
  --purple:#7c3aed;--purple2:rgba(124,58,237,.08);--purple3:rgba(124,58,237,.24);
  --line:#e5e5e3;--dark:#111827;
}
.topbar{height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:0 28px}
.badge{color:var(--blue);letter-spacing:.03em;text-transform:uppercase}.badge-dot{border-color:var(--blue)}
.tb-title{color:var(--text);font-weight:800}.tb-meta{color:var(--muted)}
.progress{background:#f1f1ef}.progress div{background:linear-gradient(90deg,var(--blue),var(--green))}
.stage{overflow:hidden}.slide{padding:36px 72px 62px;overflow-y:auto;align-items:flex-start}.inner{max-width:1020px;margin:auto}
.paper{border-radius:14px;border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04);padding:42px 48px;max-height:calc(100vh - 128px);overflow-y:auto}
.kicker{color:var(--blue);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.h1{font-size:42px;letter-spacing:-.5px;font-weight:850}.h2{font-size:30px;letter-spacing:-.35px;font-weight:850}.sub{font-size:17px;color:var(--muted)}
.card{border-radius:12px;border:1.5px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.02);padding:22px}
.ctitle{font-size:19px;font-weight:800;letter-spacing:-.2px}.cbody{font-size:14.5px;color:var(--muted)}
.callout{border-radius:12px;font-size:15px;font-weight:650}.pill{border-radius:999px;font-size:12px;padding:6px 12px}
.step{border-radius:12px;border:1.5px solid var(--line);padding:15px}.num{border-radius:999px;background:var(--blue)}
.table{border-radius:12px;border:1.5px solid var(--line)}.table th{background:#f8fafc}.mono{border-radius:10px}
.nav{width:42px;height:42px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.dot.on{background:var(--blue)}.notes{border-radius:14px;background:#111827}
@media(max-height:760px){.paper{padding:30px 36px}.h1{font-size:36px}.h2{font-size:26px}.sub{font-size:15.5px}.card{padding:18px}.callout{padding:15px 18px}}

<body>
<header class="topbar">
  <span class="badge">멘토 사례 <span class="badge-dot">2</span></span>
  <span class="tb-title">암묵지 형식화 사례 워크숍</span>
  <span class="tb-meta">13:50–14:10 · 발표 이유진 멘토</span>
  <span class="spacer"></span>
  <span class="counter"><span id="cur">1</span> / <span id="tot">16</span></span>

</header>
<div class="progress"><div id="bar"></div></div>

<div class="notes" id="notes"><b>발표 노트</b><br><span id="noteText"></span></div>
<script>
const SLIDES=[
{note:'표지. 오전 문제정의 다음 단계로 암묵지 형식화와 스킬 개발을 다룸을 안내.',html:`<div class="paper"><div class="kicker">Tacit Knowledge · Skill Development</div><div class="h1">Type A · B · C<br>멘토 3명 사례로 보는<br><span class="hl">암묵지 형식화 + 스킬 개발</span></div><div class="sub">머릿속에만 있던 판단 기준을 어떻게 문서화하고,<br>그 기준을 반복 실행 가능한 스킬 구조로 전환했는지,<br>그리고 형식화 4요소를 본인 업무에 적용하는 법을 다룹니다.</div><div class="pillrow"><span class="pill orange">사례 A · 뉴스 선별</span><span class="pill blue">사례 B · 원규 검토</span><span class="pill green">사례 C · 회의록</span><span class="pill purple">형식화 4요소</span><span class="pill dark">실습</span></div></div>`},
{note:'20분 검토 순서.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">검토 순서</div><div style="margin-top:24px"><div class="step"><div class="num orange">1</div><div><strong>0~5분 · 암묵지 형식화 정의와 유형</strong><span>형식지·암묵지 구분, 형식화 정도에 따른 3유형(A/B/C) 분류.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>5~10분 · 사례 A — 뉴스 선별</strong><span>선별 기준과 문장 규칙을 처리 기준으로 정리, 업무를 3개 스킬로 분리.</span></div></div><div class="step"><div class="num blue">3</div><div><strong>10~15분 · 사례 B — 원규 검토</strong><span>5가지 검토 관점의 리스트화가 곧 스킬의 뼈대.</span></div></div><div class="step"><div class="num green">4</div><div><strong>15~20분 · 사례 C — 회의록과 HWPX 제약</strong><span>기준 정리와 별개로 포맷 처리 가능성을 1주차에 점검.</span></div></div></div><div class="callout dark">사례 자체보다 <b>판단 기준을 글로 옮기는 방식</b>이 핵심.</div></div>`},
{note:'암묵지 정의. 형식지와 암묵지 구분.',html:`<div class="paper"><div class="kicker">개념 정의</div><div class="h2">형식지와 암묵지</div><div class="grid2" style="margin-top:24px"><div class="card bluebg"><div class="label blue">형식지</div><div class="ctitle">문서화된 기준</div><div class="cbody">매뉴얼·규정·절차서·작성 양식처럼 글로 정리된 지식. 그대로 처리 기준으로 활용 가능.</div></div><div class="card orangebg"><div class="label orange">암묵지</div><div class="ctitle">경험으로 쌓인 판단</div><div class="cbody">담당자에게만 축적된 판단 기준. <b>"보면 안다"</b>는 직관 안에 복잡한 규칙이 결합되어 있음.</div></div></div><div class="callout purple" style="margin-top:18px">AI는 형식지로만 동작. <b>암묵지를 문서로 꺼낼 때</b> 반복 실행이 가능해진다.</div></div>`},
{note:'암묵지 3유형 분류.',html:`<div class="paper"><div class="kicker">암묵지 형식화 유형</div><div class="h2">형식화 정도에 따른 3유형</div><div class="grid3" style="margin-top:24px"><div class="card redbg"><div class="label red">Type A</div><div class="ctitle">미형식화</div><div class="cbody">기준이 머릿속에만 존재. 포함·제외도 예시도 문서로 남아 있지 않음. <b>"보면 안다"로 끝나는 단계.</b></div></div><div class="card orangebg"><div class="label orange">Type B</div><div class="ctitle">부분 형식화</div><div class="cbody">포함·제외 기준은 문서화됐으나 예시가 부족. 일반 케이스는 처리되지만 <b>경계 사례에서 결과가 흔들림.</b></div></div><div class="card greenbg"><div class="label green">⭐ Type C</div><div class="ctitle">완전 형식화</div><div class="cbody">포함·제외·우수예시·보완예시 4요소가 갖춰진 상태. AI가 동일 기준을 <b>일관되게 반복 실행.</b></div></div></div><div class="callout dark" style="margin-top:18px">이번 사례 3건은 모두 <b>Type A·B → C로 진화한 과정</b>.</div></div>`},
{note:'3유형 비교 표.',html:`<div class="paper"><div class="kicker">유형 비교</div><div class="h2">A · B · C 비교</div><table class="table" style="margin-top:22px"><tr><th>구분</th><th><span style="color:var(--red)">Type A</span><br>미형식화</th><th><span style="color:var(--orange)">Type B</span><br>부분 형식화</th><th><span style="color:var(--green)">⭐ Type C</span><br>완전 형식화</th></tr><tr><td>포함 기준</td><td>머릿속에만</td><td>문서화됨</td><td>문서화됨</td></tr><tr><td>제외 기준</td><td>불명확</td><td>문서화됨</td><td>문서화됨</td></tr><tr><td>우수 예시</td><td>없음</td><td>일부</td><td>3개 이상</td></tr><tr><td>보완 예시</td><td>없음</td><td>없음</td><td>3개 + 개선안</td></tr><tr><td>AI 실행</td><td>매번 질의</td><td>경계에서 흔들림</td><td>일관 실행</td></tr><tr><td>다음 단계</td><td>기준 추출</td><td>오류 분석·예시 추가</td><td>1차 실행·검증 기준</td></tr></table><div class="callout blue" style="margin-top:18px">Type B는 결함이 아님. <b>오류 분석으로 예시를 보강하면 Type C</b>로 이동.</div></div>`},
{note:'Type A 멘토 코칭. 머릿속에만 있는 기준을 어떻게 끌어내는가.',html:`<div class="paper" style="padding:34px 44px"><div class="caseTag red">Type A · 멘토 코칭</div><div class="h2" style="font-size:28px"><span style="color:var(--red)">"보면 안다"</span>를 글로 끌어내는 질문 흐름</div><div style="margin-top:14px;font-size:13.5px;color:#6b7280">Type A 담당자는 기준을 글로 쓸 수 없다고 답하는 경우가 많습니다. 멘토는 직접 기준을 묻지 않고 <b>판단 사례를 비교하게 합니다.</b></div><div class="grid2" style="margin-top:18px;gap:14px"><div class="card redbg" style="padding:18px 20px"><div class="label red">Before · 담당자 답변</div><div class="ctitle" style="font-size:17px;margin-bottom:8px">"음… 보면 알아요"</div><div class="cbody" style="font-size:13.5px;line-height:1.7">기준을 묻는 질문에 일반적으로 답이 막힙니다. 머릿속에서는 작동하지만 글로 옮기는 시도를 해본 적이 없습니다.</div></div><div class="card greenbg" style="padding:18px 20px"><div class="label green">After · 멘토 질문 흐름</div><div class="cbody" style="font-size:13px;line-height:1.75"><b>Q1.</b> 최근에 처리한 우수 결과 3개와 보완이 필요했던 결과 3개를 보여주세요<br><b>Q2.</b> 둘을 가른 결정적 차이는 무엇이었나요?<br><b>Q3.</b> 그 차이를 한 문장으로 쓰면?<br><span style="color:var(--green);font-weight:700">→ 그 한 문장이 곧 포함·제외 기준입니다.</span></div></div></div><div class="callout blue" style="margin-top:14px;padding:14px 18px;font-size:14px">Type A는 <b>기준을 묻는 게 아니라 사례를 비교하게</b> 합니다. 비교 과정에서 자연스럽게 기준이 드러납니다.</div></div>`},
{note:'Type B 멘토 코칭. 부분 형식화에서 경계 사례를 어떻게 보강하는가.',html:`<div class="paper" style="padding:34px 44px"><div class="caseTag orange">Type B · 멘토 코칭</div><div class="h2" style="font-size:28px">기준은 있는데 <span style="color:var(--orange)">경계에서 흔들릴 때</span></div><div style="margin-top:14px;font-size:13.5px;color:#6b7280">Type B는 포함·제외 기준은 있지만 우수·보완 예시가 부족합니다. 멘토는 <b>오류 사례 자체를 형식화 자료로 사용</b>합니다.</div><div class="grid2" style="margin-top:18px;gap:14px"><div class="card orangebg" style="padding:18px 20px"><div class="label orange">Before · 1차 실행 결과</div><div class="ctitle" style="font-size:17px;margin-bottom:8px">100건 처리 → 8건 오류</div><div class="cbody" style="font-size:13.5px;line-height:1.7">기준이 일반 케이스에는 작동하지만 경계 사례에서 흔들립니다. 담당자도 왜 틀렸는지 명확히 설명하지 못합니다.</div></div><div class="card greenbg" style="padding:18px 20px"><div class="label green">After · 멘토 질문 흐름</div><div class="cbody" style="font-size:13px;line-height:1.75"><b>Q1.</b> 8건 오류가 같은 패턴인가요? — <span style="color:#9ca3af">5건은 A 패턴, 3건은 B 패턴</span><br><b>Q2.</b> 각 패턴은 기존 기준의 어느 항목과 충돌하나요?<br><b>Q3.</b> 그럼 기준을 어떻게 다시 쓸까요?<br><span style="color:var(--green);font-weight:700">→ 오류 사례가 곧 보완예시 3개가 됩니다.</span></div></div></div><div class="callout blue" style="margin-top:14px;padding:14px 18px;font-size:14px">Type B는 <b>오류를 결함이 아닌 자료로</b> 다룹니다. 8건 오류 = 8건 보완예시 후보 = Type C로 가는 입력값.</div></div>`},
{note:'Type C 멘토 코칭. 좋은 케이스에서 어떻게 디벨롭하는가.',html:`<div class="paper" style="padding:34px 44px"><div class="caseTag green">⭐ Type C · 멘토 코칭</div><div class="h2" style="font-size:28px">이미 Good Case일 때 — <span style="color:var(--green)">다음 단계는 디벨롭</span></div><div style="margin-top:14px;font-size:13.5px;color:#6b7280">Type C는 4요소가 갖춰진 상태입니다. 멘토는 기준을 더 추가하지 않고 <b>검증 지표·확장 경로·재사용성</b>을 점검합니다.</div><div class="grid3" style="margin-top:18px;gap:12px"><div class="card greenbg" style="padding:18px 20px"><div class="label green">① 검증 지표 설정</div><div class="ctitle" style="font-size:17px;margin-bottom:6px">정확도·시간·수정 횟수</div><div class="cbody" style="font-size:13px;line-height:1.7">기준이 있어도 성공 기준이 없으면 개선 방향이 안 보입니다. 정확도·시간 단축·수정 횟수 중 <b>하나를 대표 지표로</b> 고정합니다.</div></div><div class="card bluebg" style="padding:18px 20px"><div class="label blue">② 확장 경로 설계</div><div class="ctitle" style="font-size:17px;margin-bottom:6px">스킬 분해·연결</div><div class="cbody" style="font-size:13px;line-height:1.7">하나의 스킬을 <b>2~3개 스킬로 분리</b>하거나, 다른 업무의 스킬과 연결합니다. 사례 A처럼 선별·문장·메일을 분리하는 식입니다.</div></div><div class="card purplebg" style="padding:18px 20px"><div class="label purple">③ 재사용성 점검</div><div class="ctitle" style="font-size:17px;margin-bottom:6px">팀 자산화</div><div class="cbody" style="font-size:13px;line-height:1.7">한 사람의 스킬을 <b>팀 누구나 호출 가능한 자산</b>으로. 입력 자료 위치·실행 절차·예외 처리 매뉴얼을 함께 정리합니다.</div></div></div><div class="callout dark" style="margin-top:14px;padding:14px 18px;font-size:14px">Type C에 필요한 것은 더 많은 기준이 아니라 <b>지표·확장·자산화</b>입니다.</div></div>`},
{note:'사례 A — 뉴스 선별. Type B → C 진화.',html:`<div class="paper"><div class="caseTag orange">사례 A · 언론홍보 담당자 · Type B → C</div><div class="h2">선별 기준과 문장 규칙의 처리 기준화</div><div class="sub" style="margin-top:12px">매일 오전 뉴스 50건 검토 → 주요 10건 선별 → 한 문장 요약문 배포</div><div class="grid2" style="margin-top:22px"><div class="card redbg"><div class="label red">Before</div><div class="ctitle">한 사람에게만 축적된 기준</div><div class="cbody">선별 기준과 문장 스타일이 담당자 1인에게 집중. 누락 시 설명 책임 발생, 인수인계 곤란.</div></div><div class="card greenbg"><div class="label green">After</div><div class="ctitle">처리 기준 문서화</div><div class="cbody"><b>포함</b> 우리 원 언급 / R&D 예산·출연연 제도<br><b>제외</b> 동일 사안 3차 이상 후속 / 정당 결부 기사<br><b>문장</b> 1기사 1문장, 매체명 위치 3변형, 종결어미 다양화</div></div></div><div class="callout blue">반복 판단 기준의 문서화가 곧 <b>스킬 설계의 입력</b>.</div></div>`},
{note:'사례 A 스킬 분리 도식. 행동 동사 워크플로우 → 스킬 매핑.',html:`<div class="paper" style="padding:34px 44px"><div class="caseTag orange">사례 A · 스킬 구조</div><div class="h2" style="font-size:28px">행동 단위로 워크플로우를 쓰고 → 스킬화</div><div style="margin-top:14px;font-size:13.5px;color:#6b7280">먼저 사람이 하는 행동을 동사로 풀어쓴 뒤, 어떤 행동을 스킬로 묶을지 결정합니다.</div><div style="margin-top:16px;display:grid;grid-template-columns:1fr;gap:8px"><div style="font-size:11.5px;font-weight:850;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px">① 행동 워크플로우 — 동사로 쓴다</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:12.5px"><div style="padding:10px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>모은다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">뉴스 50건 수집</div></div><div style="padding:10px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>선별한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">기준 적용</div></div><div style="padding:10px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>한 문장으로<br>요약한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">문장 규칙 적용</div></div><div style="padding:10px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>참조한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">과거 베스트와 비교</div></div><div style="padding:10px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>포맷에 넣는다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">메일 템플릿</div></div><div style="padding:10px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>배포한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">메일 발송</div></div></div></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700;margin:8px 0">↓ 같은 기준이 들어가는 행동끼리 묶기</div><div style="display:grid;grid-template-columns:1fr;gap:8px"><div style="font-size:11.5px;font-weight:850;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px">② 스킬 매핑 — 묶음별로 이름 붙이기</div><div style="display:grid;grid-template-columns:80px 1fr 30px 1fr 30px 1fr 80px;gap:6px;align-items:center;font-size:12.5px"><div style="padding:10px 6px;background:#f3f4f6;border-radius:8px;text-align:center;color:#6b7280;font-size:11px;font-weight:700">사람</div><div style="padding:12px 8px;background:var(--orange2);border:2px solid var(--orange3);border-radius:10px;text-align:center"><div style="color:var(--orange);font-size:10.5px;font-weight:900;margin-bottom:3px">SKILL 1</div><b><span class="mono" style="font-size:11px;padding:2px 6px">/한문장-작성</span></b><div style="font-size:10.5px;color:#6b7280;margin-top:3px">선별 + 요약</div></div><div style="text-align:center;font-size:16px;color:#cbd5e1">→</div><div style="padding:12px 8px;background:var(--blue2);border:2px solid var(--blue3);border-radius:10px;text-align:center"><div style="color:var(--blue);font-size:10.5px;font-weight:900;margin-bottom:3px">SKILL 2</div><b><span class="mono" style="font-size:11px;padding:2px 6px">/best-sentences</span></b><div style="font-size:10.5px;color:#6b7280;margin-top:3px">참조</div></div><div style="text-align:center;font-size:16px;color:#cbd5e1">→</div><div style="padding:12px 8px;background:var(--green2);border:2px solid var(--green3);border-radius:10px;text-align:center"><div style="color:var(--green);font-size:10.5px;font-weight:900;margin-bottom:3px">SKILL 3</div><b><span class="mono" style="font-size:11px;padding:2px 6px">/template-mail</span></b><div style="font-size:10.5px;color:#6b7280;margin-top:3px">포맷 입력</div></div><div style="padding:10px 6px;background:#f3f4f6;border-radius:8px;text-align:center;color:#6b7280;font-size:11px;font-weight:700">사람</div></div></div><div class="callout dark" style="margin-top:14px;padding:14px 18px;font-size:14px">동사로 풀고 → 같은 기준이 적용되는 행동을 묶고 → 묶음에 이름을 붙이면 <b>스킬 구조가 결정</b>됩니다.</div></div>`},
{note:'사례 B — 원규 검토. Type A → C 진화.',html:`<div class="paper"><div class="caseTag blue">사례 B · 규정관리 담당자 · Type A → C</div><div class="h2">관점의 리스트화가 곧 스킬 구조</div><div class="sub" style="margin-top:12px">원규 개정안 검토 → 5관점별 의견서 초안 생성 — <span class="mono">/원규-검토</span></div><div style="margin-top:14px;padding:12px 16px;background:#f8fafc;border-left:3px solid var(--blue);border-radius:6px;font-size:13.5px;color:#4b5563;line-height:1.6"><b style="color:#111827">원규(院規)란?</b> 공공기관·연구원의 내부 규정. 법령·정관 하위 단계로, 조직 운영·인사·재무·연구관리 등 기관 업무 전반을 규율하는 자체 규정 문서.</div><div style="margin-top:20px;padding:18px 22px;background:var(--blue2);border:1.5px solid var(--blue3);border-radius:14px"><div style="font-weight:850;font-size:14px;color:var(--blue);margin-bottom:12px;letter-spacing:.02em">5가지 검토 관점</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px"><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">1. 법적 정합성</b> — 상위 법령·지침과의 충돌 여부</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">2. 재무적 타당성</b> — 예산·비용 구조 정합성</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">3. 운영 실행가능성</b> — 현장 적용 가능성</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">4. 위험 관리</b> — 허점·예외 상황 점검</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3);grid-column:1/-1"><b style="color:var(--blue)">5. 전략 정합성</b> — 기관 중장기 전략 부합도</div></div></div><div class="callout blue" style="margin-top:18px">형식화의 출발점은 <b>리스트화</b>. 머릿속 관점이 항목으로 나오는 순간 스킬 구조가 결정된다.</div></div>`},
{note:'사례 B 스킬 명세.',html:`<div class="paper"><div class="caseTag blue">사례 B · 스킬 명세</div><div class="h2">설계 5요소</div><div style="margin-top:14px;padding:10px 14px;background:#f8fafc;border-left:3px solid var(--blue);border-radius:6px;font-size:12.5px;color:#4b5563;line-height:1.55"><b style="color:#111827">원규(院規)</b> · 공공기관·연구원의 내부 규정. 법령·정관 하위 단계로 조직 운영·인사·재무·연구관리를 규율하는 자체 규정 문서.</div><table class="table" style="margin-top:14px"><tr><th>항목</th><th>내용</th><th>설계 관점</th></tr><tr><td>스킬 이름</td><td><span class="mono">/원규-검토</span></td><td>이름이 곧 기능 정의</td></tr><tr><td>입력</td><td>개정안·기존 규정·검토 배경</td><td>파일만으로는 불충분 — 검토 목적과 기준 동반 필요</td></tr><tr><td>처리 기준</td><td>5가지 검토 관점 + 누락 체크</td><td>기준 부재 시 결과는 일반론에 머묾</td></tr><tr><td>출력</td><td>관점별 의견 초안·보완 항목·질문</td><td>최종본이 아닌 <b>검토용 초안</b>으로 한정</td></tr><tr><td>사람 검토</td><td>제출 전 담당자 확인 + 서명</td><td>책임 결합 문서는 사람 판단 지점 필수</td></tr></table></div>`},
{note:'사례 C — 회의록. Type C 도달 + 포맷 제약.',html:`<div class="paper"><div class="caseTag green">사례 C · 디지털인재교육팀 · Type C + 포맷 제약</div><div class="h2">기준 정리와 구현 가능성은 별개</div><div class="sub" style="margin-top:12px">주간 회의 → 결정사항·액션아이템·논의내용으로 구조화한 회의록 초안 생성</div><div class="grid2" style="margin-top:22px"><div class="card greenbg"><div class="label green">정리된 암묵지</div><div class="ctitle">회의록 작성 기준 — 문서화 완료</div><div class="cbody">참석자·안건·논의·결정·액션 5단 구조 / 결정-논의 구분 기준 / "~하기로 했다", "~까지 검토" 패턴 인식 규칙.</div></div><div class="card redbg"><div class="label red">남은 제약</div><div class="ctitle">HWPX 포맷 처리</div><div class="cbody">공공기관 표준 포맷이 HWPX. MD·DOCS 변환 시 서식 보존·재반영 단계에서 손실. <b>언어 처리가 아닌 포맷 처리 문제.</b></div></div></div><div class="callout dark" style="margin-top:18px">기준 문서화 ≠ 구현 가능성. <b>1주차에 포맷 처리 가능성을 별도 검증.</b></div></div>`},
{note:'사례 C 관점 전환 — 설계하면서 만들어가는 형식화.',html:`<div class="paper"><div class="kicker">관점 전환</div><div class="h2">실행하면서 기준을 채우는 방식</div><div class="sub" style="margin-top:12px">완성된 기준 문서를 먼저 쓰는 대신, 결과물 비교를 통해 기준을 누적하는 접근.</div><div style="margin-top:22px"><div class="step"><div class="num green">1</div><div><strong>1차 실행</strong><span>최소 입력으로 결과물 생성. 부족한 지점을 시각적으로 식별.</span></div></div><div class="step"><div class="num green">2</div><div><strong>비교 기반 기준 추출</strong><span>적합·부적합 결과를 병치 후 <b>포함·제외·표현·예외</b> 규칙을 한 줄씩 도출.</span></div></div><div class="step"><div class="num green">3</div><div><strong>반영 후 재실행</strong><span>도출된 기준을 다음 실행에 반영. 동일 지점에서 재차 막힐 경우 해당 위치에 기준 1줄 추가.</span></div></div></div><div class="callout green" style="margin-top:6px">기준이 누적되는 과정 자체가 형식화의 본질.</div></div>`},
{note:'세 사례 종합 비교.',html:`<div class="paper" style="padding:34px 44px"><div class="kicker">사례 종합</div><div class="h2" style="font-size:28px">사례별 형식화 지점</div><table class="table" style="margin-top:16px;font-size:13.5px"><tr><th style="padding:10px 12px">사례</th><th style="padding:10px 12px">유형 전환</th><th style="padding:10px 12px">암묵지</th><th style="padding:10px 12px">스킬화 방식</th><th style="padding:10px 12px">다음 제출물</th></tr><tr><td style="padding:11px 12px"><b>A</b> <span style="color:var(--orange);font-weight:700">뉴스 선별</span></td><td style="padding:11px 12px">B → C</td><td style="padding:11px 12px">선별 기준 + 문장 스타일</td><td style="padding:11px 12px">3개 스킬 분리</td><td style="padding:11px 12px">도메인 규칙표 + 샘플</td></tr><tr><td style="padding:11px 12px"><b>B</b> <span style="color:var(--blue);font-weight:700">원규 검토</span></td><td style="padding:11px 12px">A → C</td><td style="padding:11px 12px">5가지 검토 관점</td><td style="padding:11px 12px">관점별 초안 생성</td><td style="padding:11px 12px">5관점 체크리스트</td></tr><tr><td style="padding:11px 12px"><b>C</b> <span style="color:var(--green);font-weight:700">회의록</span></td><td style="padding:11px 12px">C + 제약</td><td style="padding:11px 12px">결정·액션 분류 기준</td><td style="padding:11px 12px">초안 + 누락 체크</td><td style="padding:11px 12px">HWPX 추출 테스트</td></tr></table><div class="callout blue" style="margin-top:14px;padding:14px 18px;font-size:14.5px">스킬 설계의 출발점은 기술이 아닌 <b>판단 기준의 명료화 정도</b>.</div></div>`},
{note:'4가지 형식화 요소.',html:`<div class="paper"><div class="kicker">형식화 4요소</div><div class="h2">Type C를 구성하는 4요소</div><div class="grid2" style="margin-top:24px;gap:14px"><div class="card bluebg" style="display:flex;gap:18px;align-items:flex-start;padding:22px 24px"><div style="flex-shrink:0;width:56px;height:56px;border-radius:14px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:950">①</div><div style="flex:1"><div class="ctitle" style="font-size:22px;color:var(--blue);margin-bottom:6px">포함기준 · YES 조건</div><div class="cbody" style="font-size:16px;color:#374151">처리 대상이 되는 조건. 명확한 신호·패턴으로 표현합니다.</div></div></div><div class="card orangebg" style="display:flex;gap:18px;align-items:flex-start;padding:22px 24px"><div style="flex-shrink:0;width:56px;height:56px;border-radius:14px;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:950">②</div><div style="flex:1"><div class="ctitle" style="font-size:22px;color:var(--orange);margin-bottom:6px">제외기준 · NO 조건</div><div class="cbody" style="font-size:16px;color:#374151">처리 제외 조건. 포함과 명백히 구분되는 특징으로 정의합니다.</div></div></div><div class="card greenbg" style="display:flex;gap:18px;align-items:flex-start;padding:22px 24px"><div style="flex-shrink:0;width:56px;height:56px;border-radius:14px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:950">③</div><div style="flex:1"><div class="ctitle" style="font-size:22px;color:var(--green);margin-bottom:6px">우수예시 · ⭕ 3개</div><div class="cbody" style="font-size:16px;color:#374151">기준을 정확히 따른 결과물. 모범 사례로 활용합니다.</div></div></div><div class="card purplebg" style="display:flex;gap:18px;align-items:flex-start;padding:22px 24px"><div style="flex-shrink:0;width:56px;height:56px;border-radius:14px;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:950">④</div><div style="flex:1"><div class="ctitle" style="font-size:22px;color:var(--purple);margin-bottom:6px">보완예시 · ❌ 3개 + 개선안</div><div class="cbody" style="font-size:16px;color:#374151">실패 사례와 수정 방향을 함께 제시합니다.</div></div></div></div><div class="callout dark" style="margin-top:18px">4요소 충족 = AI 반복 실행 조건 충족 = <b>형식화 완료</b>.</div></div>`},
{note:'실습 워크시트.',html:`<div class="paper"><div class="kicker">실습</div><div class="h2">내 업무 암묵지 4단계 정리</div><div class="sub" style="margin-top:12px">오전 문제정의를 바탕으로 처리 기준을 글로 옮기는 작업.</div><div class="grid2" style="margin-top:22px"><div class="card bluebg"><div class="label blue">Step 1 — 포함 기준</div><div class="cbody">처리 대상의 YES 조건. 신호 1~2개로 정의.</div></div><div class="card orangebg"><div class="label orange">Step 2 — 제외 기준</div><div class="cbody">처리 제외 조건. 포함과 구분되는 특징 명시.</div></div><div class="card greenbg"><div class="label green">Step 3 — 우수 예시 3개</div><div class="cbody">기준 충족 결과물 3개 수집. 실제 산출물 우선.</div></div><div class="card purplebg"><div class="label purple">Step 4 — 보완 예시 3개</div><div class="cbody">과거 오류·경계 사례. 실패 원인과 수정 방향 동반.</div></div></div><div class="callout blue">4항목 정리 완료 = <b>스킬 변환 준비 완료</b>.</div></div>`},
{note:'프롬프트 템플릿.',html:`<div class="paper" style="padding:32px 44px"><div class="kicker">프롬프트 템플릿</div><div class="h2" style="font-size:28px">스킬 구축 요청 프롬프트</div><div class="mono" style="margin-top:14px;white-space:pre-wrap;font-size:11.5px;line-height:1.55;padding:14px 16px">아래 업무에 대해 Skill을 구축해 주세요.\n\n【문제정의】 [1문장]\n【포함기준】 [YES 조건]\n【제외기준】 [NO 조건]\n\n【우수예시】\n예시1: [입력] → [출력]\n예시2: [입력] → [출력]\n예시3: [입력] → [출력]\n\n【보완예시】\n예시1: [입력] → [현재 결과] ✗  보완: [수정 방향]\n예시2: [입력] → [현재 결과] ✗  보완: [수정 방향]\n예시3: [입력] → [현재 결과] ✗  보완: [수정 방향]\n\n요청: 위 기준으로 [입력 형태]를 [처리 방식]으로 처리하는 Skill을 작성해 주세요.</div><div class="callout blue" style="margin-top:12px;padding:14px 18px;font-size:14.5px">동일 구조로 제출하면 <b>일관된 기준 기반 반복 실행</b>이 가능합니다.</div></div>`},
{note:'보안 체크.',html:`<div class="paper"><div class="kicker">보안 체크</div><div class="h2">민감 데이터 처리 원칙</div><div style="margin-top:22px"><div class="step"><div class="num orange">1</div><div><strong>민감 정보 마스킹</strong><span>고객명·금액·회사명·이메일은 <span class="mono">[고객명]</span>, <span class="mono">[금액]</span> 형태로 치환.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>샘플 범위 제한</strong><span>전수 데이터 대신 대표성 5~10건으로 검증.</span></div></div><div class="step"><div class="num orange">3</div><div><strong>로컬 사전 정리</strong><span>제출 전 로컬 환경에서 포함·제외·예시 검토.</span></div></div><div class="step"><div class="num orange">4</div><div><strong>제출 후 결과 검증</strong><span>샘플 검증 후 본 데이터 적용. 오류 패턴은 기준 개선에 반영.</span></div></div></div><div class="callout purple">효율성과 정보 보안은 <b>동시 고려 대상</b>.</div></div>`},
{note:'마무리. 큰 메시지로 임팩트.',html:`<div class="paper" style="padding:60px 54px;text-align:center"><div class="kicker" style="text-align:center">핵심 정리</div><div class="bigquote" style="margin-top:18px">머릿속의 판단 기준을<br>한 줄씩 글로 옮기는 순간<br><span class="hl">그것이 곧 스킬이 됩니다.</span></div><div style="display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr;align-items:center;gap:8px;margin-top:42px;max-width:780px;margin-left:auto;margin-right:auto"><div style="padding:18px 14px;background:var(--blue2);border:2px solid var(--blue3);border-radius:14px"><div style="color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">오전</div><div style="font-weight:900;font-size:18px;color:#111827">문제정의</div><div style="font-size:12.5px;color:#6b7280;margin-top:4px">입력·출력·조건·규모</div></div><div style="text-align:center;font-size:24px;color:#cbd5e1;font-weight:900">→</div><div style="padding:18px 14px;background:var(--green2);border:2px solid var(--green3);border-radius:14px"><div style="color:var(--green);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">오후</div><div style="font-weight:900;font-size:18px;color:#111827">암묵지 형식화</div><div style="font-size:12.5px;color:#6b7280;margin-top:4px">포함·제외·우수·보완</div></div><div style="text-align:center;font-size:24px;color:#cbd5e1;font-weight:900">→</div><div style="padding:18px 14px;background:#111827;border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">결과</div><div style="font-weight:900;font-size:18px;color:#fff">스킬</div><div style="font-size:12.5px;color:#9ca3af;margin-top:4px">반복 실행 가능</div></div></div><div style="margin-top:38px;font-size:18px;color:#6b7280;font-weight:700;line-height:1.6">완벽한 1차 작성은 없습니다.<br><b style="color:#111827;font-size:20px">실행 · 비교 · 기준 추가의 반복</b>이 형식화를 완성합니다.</div></div>`}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
