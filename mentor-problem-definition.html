sition:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}

<script>
const SLIDES=[
{note:'오프닝. 멘티 사례를 통해 잘된 사례·아쉬운 사례를 비교하고, 멘토가 어떻게 피드백했는지·문제정의를 초반에 잘 잡으려면 어떻게 해야 하는지를 다루는 시간임을 안내한다.',html:`<div class="paper"><div class="kicker">Problem Definition · Mentor Feedback</div><div class="h1">잘된 사례 vs 아쉬운 사례<br>멘티 4명으로 보는<br><span class="hl">문제정의 코칭</span></div><div class="sub">아쉬운 사례에는 멘토가 어떻게 피드백했는지,<br>자주 발생하는 문제정의 오류 4가지,<br>그리고 초반에 잘 잡으려면 어디부터 점검해야 하는지를 다룹니다.</div><div class="pillrow"><span class="pill orange">아쉬운 사례 · 멘티 A</span><span class="pill orange">아쉬운 사례 · 멘티 B</span><span class="pill green">잘된 사례 · 멘티 C</span><span class="pill purple">제약 사례 · 멘티 D</span><span class="pill blue">멘토 피드백</span><span class="pill dark">익명화</span></div></div>`},
{note:'강의 흐름 설명. 사례 외우기가 아니라 멘토 피드백 방식과 초반 문제정의 잘 잡는 법을 가져가는 것이 목적임을 강조한다.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">사례 검토 순서</div><div style="margin-top:26px"><div class="step"><div class="num red">1</div><div><strong>아쉬운 사례 1 — 결과물 이름이 문제정의를 끌고 간 경우</strong><span>'챗봇'이라는 결과물 이름이 설계 방향까지 흐트러뜨린 사례. 멘토가 어떻게 LLM 분석으로 방향을 돌렸는지 본다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>아쉬운 사례 2 — 범위가 너무 넓어 첫 실행이 안 보인 경우</strong><span>5단계를 한 번에 자동화하려다 막힌 사례. 멘토가 어떻게 첫 스킬 한 개로 줄였는지 본다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>잘된 사례 — 입력·출력·조건·규모가 명확해 파일럿 설계가 가능한 경우</strong><span>왜 잘된 사례인지, 그리고 잘된 사례에는 어떤 피드백을 더해야 하는지 본다.</span></div></div><div class="step"><div class="num purple">4</div><div><strong>제약 사례 — 문제정의는 맞아도 포맷·배포에서 막히는 경우</strong><span>HWPX 처리처럼 문제정의 이후 구현 가능성 점검이 따로 필요한 사례를 본다.</span></div></div></div><div class="callout dark">목표는 사례를 외우는 게 아니라, <b>잘된 사례·아쉬운 사례 구분 기준과 멘토의 피드백 방식</b>을 본인 과제에 옮기는 것입니다.</div></div>`},
{note:'3+1 추천 결과를 표로 정리. 각 사례의 역할이 다르다는 점을 말한다.',html:`<div class="paper"><div class="kicker">사례 선정</div><div class="h2">사례 구성 3+1 <span style="font-size:18px;color:#94a3b8;font-weight:700">· 익명화 버전</span></div><table class="table" style="margin-top:24px"><tr><th>순서</th><th>이름</th><th>유형</th><th>핵심 포인트</th></tr><tr><td>1</td><td>멘티 A</td><td>문제정의 잘못됨</td><td>챗봇과 LLM 분석을 혼동해 결과물 이름에 설계 방식까지 영향을 받음</td></tr><tr><td>2</td><td>멘티 B</td><td>문제 범위 과잉</td><td>5단계를 모두 하려다 첫 스킬 이름을 못 정함</td></tr><tr><td>3</td><td>멘티 C</td><td>실행 가능 사례</td><td>입력, 출력, 조건, 규모가 명확해 검증 설계가 가능한 사례</td></tr><tr><td>+1</td><td>멘티 D</td><td>구현·배포 제약</td><td>문제정의 이후 HWPX 처리 방식 검토가 필요한 사례</td></tr></table></div>`},
{note:'멘티 A 사례. 챗봇이 부적절하다는 뜻이 아니라, 먼저 해야 할 일이 답변 생성이 아니라 패턴 분석이라는 점을 강조한다.',html:`<div class="paper"><div class="caseTag red">사례 1 · 멘티 A · 문제정의가 잘못된 경우</div><div class="h2">자동 응답보다<br>문의 유형 분석이 먼저 필요한 사례</div><div class="twoflow" style="margin-top:26px"><div class="card redbg"><div class="label red">처음 접근</div><div class="ctitle">헬프데스크 문의를 자동 답변하는 챗봇</div><div class="cbody">자동 응답 화면을 먼저 떠올리면 FAQ 매칭, 실시간 응대, 답변 정책부터 설계하게 됩니다. 그러나 이 사례의 선행 과제는 누적 문의 데이터의 반복 패턴을 확인하는 일이었습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">멘토가 바꾼 관점</div><div class="ctitle">누적 문의 데이터에서 반복 패턴을 뽑는 LLM 분석</div><div class="cbody">반복 문의의 유형과 빈도를 먼저 확인해야 답변 기준도 설계할 수 있습니다. 따라서 1차 산출물은 자동 답변이 아니라 문의 유형 분석표입니다.</div></div></div><div class="callout orange">이 사례는 결과물 명칭이 문제정의와 실행 범위를 왜곡할 수 있음을 보여줍니다.</div></div>`},
{note:'멘티 A 사례의 이해 포인트. 멘티들이 챗봇과 LLM을 자주 혼동하므로 구분표를 보여준다.',html:`<div class="paper"><div class="caseTag red">사례 1 · 설계 구분</div><div class="h2">챗봇과 LLM 분석은 출발점이 다릅니다</div><table class="table" style="margin-top:24px"><tr><th>구분</th><th>챗봇으로 보면</th><th>LLM 분석으로 보면</th></tr><tr><td>질문</td><td>사용자 질문에 답변 기준은 무엇인가</td><td>반복 문의가 어떤 패턴으로 쌓였는가</td></tr><tr><td>필요 기준</td><td>FAQ, 답변 정책, 예외 응대 기준</td><td>분류 기준, 빈도 기준, 처리시간 기준</td></tr><tr><td>첫 산출물</td><td>답변 시나리오</td><td>반복 문의 Top N 분석표</td></tr><tr><td>첫 스킬</td><td>자동 답변 생성</td><td><span class="mono">문의유형 분류</span></td></tr></table><div class="callout blue">정리하면, 챗봇은 응답 인터페이스이고 LLM 분석은 누적 데이터를 해석하는 처리 방식입니다.</div></div>`},
{note:'추가 설명 페이지. 챗봇과 LLM은 같은 것이 아니라 층위가 다르다는 점을 분명히 짚는다.',html:`<div class="paper"><div class="caseTag red">설계 참고 · 챗봇 vs LLM</div><div class="h2">챗봇과 LLM 분석은<br>설계 층위가 다릅니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">Chatbot</div><div class="ctitle">사용자와 대화하는 인터페이스 또는 제품</div><div class="cbody">웹, 앱, 메신저 안에서 사용자가 질문을 던지고 답을 받는 <b>대화형 접점</b>입니다. 규칙 기반일 수도 있고, 검색 기반일 수도 있고, LLM을 결합한 챗봇일 수도 있습니다.</div><div class="pillrow"><span class="pill orange">보이는 것</span><span class="pill orange">대화 흐름</span><span class="pill orange">채널·UI</span></div></div><div class="card bluebg"><div class="label blue">LLM</div><div class="ctitle">텍스트를 이해·생성하는 언어 모델</div><div class="cbody">대량의 텍스트를 바탕으로 학습된 <b>언어 처리 엔진</b>입니다. 대화형 답변뿐 아니라 분류, 요약, 초안 작성, 패턴 분석처럼 챗봇이 아닌 업무에도 쓸 수 있습니다.</div><div class="pillrow"><span class="pill blue">보이지 않는 엔진</span><span class="pill blue">분류·요약·생성</span><span class="pill blue">분석 작업</span></div></div></div><table class="table" style="margin-top:22px"><tr><th>구분</th><th>챗봇</th><th>LLM</th></tr><tr><td>무엇인가</td><td>사용자와 대화하는 애플리케이션·인터페이스</td><td>자연어를 이해하고 생성하는 모델</td></tr><tr><td>꼭 서로 필요한가</td><td>아니요. 룰 기반·검색형 챗봇도 가능</td><td>아니요. 챗봇 없이도 분류, 요약, 보고서 작성에 사용 가능</td></tr><tr><td>잘 맞는 첫 질문</td><td>사용자에게 어떤 답을 돌려줄까?</td><td>이 데이터를 어떤 기준으로 읽고 분류할 것인가</td></tr><tr><td>예시</td><td>FAQ 응대, 예약, 신청 상태 조회</td><td>문의유형 분류, 반복 이슈 요약, 보고서 초안</td></tr></table><div class="callout dark">정리하면, <b>챗봇은 사용자 접점이고 LLM은 자연어 처리 모델</b>입니다. 따라서 챗봇을 만들지 않아도 LLM을 활용한 분류, 요약, 보고서 작성은 가능합니다.</div></div>`},
{note:'멘티 B 사례. 방향은 맞는데 너무 크다. 최종 제안서와 첫 스킬을 분리하는 코칭이 필요하다.',html:`<div class="paper"><div class="caseTag orange">사례 2 · 멘티 B · 문제가 너무 넓은 경우</div><div class="h2">최종 산출물부터 잡으면<br>첫 실행 단위가 불명확해집니다</div><div class="twoflow" style="margin-top:26px"><div class="card orangebg"><div class="label orange">처음 접근</div><div class="ctitle">교육 데이터와 외부 트렌드로 신규 교육 제안서 만들기</div><div class="cbody">수집, 분류, 트렌드 조사, 매칭, 제안서 작성이 모두 포함되면서 처리 시작점과 검증 기준이 불명확해졌습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">멘토가 줄인 범위</div><div class="ctitle">외부 교육 신청 데이터를 주제별로 분류하기</div><div class="cbody">최종 산출물은 제안서여도 첫 실행은 제안서가 아닙니다. 먼저 주제 분류가 되어야 이후 매칭과 제안이 가능합니다.</div></div></div><div class="callout orange">이 사례는 방향의 문제가 아니라 범위의 문제입니다. 전체 흐름을 유지하되 첫 실행 단위를 분리해야 합니다.</div></div>`},
{note:'멘티 B 사례를 5단계에서 첫 스킬로 줄이는 장표. 이 구조는 다른 멘티에게도 적용할 수 있다.',html:`<div class="paper"><div class="caseTag orange">사례 2 · 범위 조정 방식</div><div class="h2">전체 흐름보다<br>첫 실행 단위를 먼저 정합니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">너무 넓은 흐름</div><div class="ctitle">데이터 수집 → 분류 → 트렌드 조사 → 매칭 → 제안서</div><div class="cbody">각 단계의 성격이 달라 한 번에 자동화하면 기준이 계속 바뀝니다.</div></div><div class="card bluebg"><div class="label blue">이번 주 실행 단위</div><div class="ctitle"><span class="mono">주제별 분류</span></div><div class="cbody"><b>입력</b> 교육 신청 엑셀, 직군 매핑표<br><b>출력</b> 직군별 주제 랭킹<br><b>조건</b> 분류 기준 5개 이내</div></div></div><div class="callout blue">핵심 질문은 하나입니다. 이번 주에 검증할 첫 실행 단위는 무엇인지 정리합니다.</div></div>`},
{note:'멘티 C 사례. 실행 가능 사례의 기준을 해석해야 한다. 단순히 잘했다고 하지 않고, 왜 실행 가능한지 짚는다.',html:`<div class="paper"><div class="caseTag green">사례 3 · 멘티 C · 실행 가능 사례</div><div class="h2">실행 가능 사례는<br>입력, 출력, 조건, 규모가 명확합니다</div><div class="grid4" style="margin-top:28px"><div class="card greenbg"><div class="label green">INPUT</div><div class="ctitle">무엇을 넣는지</div><div class="cbody">처리에 사용할 자료가 명확합니다. 파일, 표, 텍스트처럼 시작점이 보입니다.</div></div><div class="card greenbg"><div class="label green">OUTPUT</div><div class="ctitle">무엇을 뽑는지</div><div class="cbody">보고서, 표, 초안, 체크리스트처럼 결과 형태가 보입니다.</div></div><div class="card greenbg"><div class="label green">CONDITION</div><div class="ctitle">어떤 기준인지</div><div class="cbody">분류 기준이나 판단 조건을 사람이 설명할 수 있습니다.</div></div><div class="card greenbg"><div class="label green">SCALE</div><div class="ctitle">얼마나 돌릴지</div><div class="cbody">샘플 개수나 파일럿 범위를 정할 수 있습니다.</div></div></div><div class="callout green">이 네 항목이 정리되면 문제정의 논의를 줄이고 파일럿 설계로 이동할 수 있습니다.</div></div>`},
{note:'멘티 C 사례를 교과서 사례로 설명. 실행 가능 사례는 칭찬보다 검증 계획이 중요하다.',html:`<div class="paper"><div class="caseTag green">사례 3 · 멘토 피드백 방향</div><div class="h2">실행 가능 사례에는 더 큰 기획보다<br>검증 기준을 붙여줘야 합니다</div><table class="table" style="margin-top:24px"><tr><th>볼 것</th><th>멘토 판단</th><th>다음 제출 가이드</th></tr><tr><td>문제정의</td><td>이미 업무 장면과 반복성이 보임</td><td>문제정의 문장은 짧게 고정</td></tr><tr><td>업무 구조</td><td>입력과 출력이 연결됨</td><td>중간 처리 기준만 표로 정리</td></tr><tr><td>처리 활용</td><td>초안 생성이나 분류에 적용 가능</td><td>샘플 10건으로 1차 실행</td></tr><tr><td>검증</td><td>이제 성공 기준이 필요함</td><td>정확도, 수정 횟수, 시간 단축 중 1개를 대표 지표로 선택</td></tr></table><div class="callout dark">실행 가능 사례에 필요한 피드백은 확장 제안이 아니라 성공 기준의 명확화입니다.</div></div>`},
{note:'멘티 D 사례. 구현 제약. 문제정의가 맞아도 포맷에서 막힐 수 있다는 점을 강하게 전달한다.',html:`<div class="paper"><div class="caseTag purple">사례 +1 · 멘티 D · 구현과 배포에서 막히는 경우</div><div class="h2">문제정의가 적절해도<br>파일 포맷이 실행을 제한할 수 있습니다</div><div class="grid2" style="margin-top:24px"><div class="card purplebg"><div class="label purple">겉으로 보이는 문제</div><div class="ctitle">HWPX 문서를 자동 처리하고 싶다</div><div class="cbody">업무 문제와 반복성은 명확합니다. 다만 문서 처리 방식이 별도 검토 대상입니다.</div></div><div class="card redbg"><div class="label red">실제 제약</div><div class="ctitle">원문 입력보다 추출·변환 절차가 필요한 포맷</div><div class="cbody">HWPX는 ZIP 기반 XML 구조라 텍스트 추출 자체는 HWP보다 유리한 편입니다. 다만 LLM에 파일을 그대로 던져서 서식까지 보존한 결과물을 만들기는 어렵기 때문에, 추출·검토·재반영 단계를 나눠야 합니다.</div></div></div><div class="callout purple">이 사례는 문제정의 이후 구현 가능성 검토가 필요한 유형입니다. 포맷 처리 방식이 불명확하면 파일럿 범위를 조정해야 합니다.</div></div>`},
{note:'멘티 D 사례 해결 방향. HWPX 원본 자동화가 아니라 추출 가능한 단위로 분리하는 게 먼저라고 말한다.',html:`<div class="paper"><div class="caseTag purple">사례 +1 · 현실적인 우회 방식</div><div class="h2">HWPX는 전체 자동화보다<br>처리 단위 분리가 먼저입니다</div><div style="margin-top:24px"><div class="step"><div class="num purple">1</div><div><strong>원본 문서에서 텍스트와 표 구조를 먼저 추출</strong><span>문서 전체를 원문 그대로 입력하기보다 압축 해제 또는 변환을 통해 제목, 본문, 표, 서식 요소를 나눠 확인합니다.</span></div></div><div class="step"><div class="num purple">2</div><div><strong>처리 범위를 초안 작성이나 검토로 제한</strong><span>최종 HWPX 재생성이 아니라 문장 초안, 누락 체크, 요약처럼 안전한 범위부터 시작합니다.</span></div></div><div class="step"><div class="num purple">3</div><div><strong>최종 문서 반영은 사람이 하거나 별도 변환 도구를 둠</strong><span>서식 보존과 기관 제출용 문서는 변환 도구 또는 한글 편집기를 거친 뒤 사람이 마지막 검토 지점을 잡아야 합니다.</span></div></div></div><div class="callout blue">이 사례의 첫 제출물은 완성 결과물이 아니라 포맷 처리 가능성 체크리스트가 더 맞습니다.</div></div>`},
{note:'네 사례를 한 장으로 종합. 듣는 사람들이 내 사례가 어느 칸인지 판단하게 한다.',html:`<div class="paper"><div class="kicker">사례 종합</div><div class="h2">네 사례는 서로 다른 실패 지점을 보여줍니다</div><table class="table" style="margin-top:24px"><tr><th>이름</th><th>막힌 지점</th><th>멘토 처방</th><th>다음 제출물</th></tr><tr><td>멘티 A</td><td>결과물 이름이 문제정의를 끌고 감</td><td>챗봇에서 LLM 분석으로 전환</td><td>분류 기준표와 반복 패턴 리포트</td></tr><tr><td>멘티 B</td><td>범위가 커서 첫 실행이 안 보임</td><td>5단계 중 첫 스킬만 선택</td><td>주제별 분류표와 샘플 실행 로그</td></tr><tr><td>멘티 C</td><td>구조는 잡혔고 검증 기준이 필요함</td><td>파일럿 성공 기준 설정</td><td>샘플 실행 결과와 성공 지표</td></tr><tr><td>멘티 D</td><td>파일 포맷 처리 방식 때문에 구현이 막힘</td><td>추출·서식 보존 가능성 먼저 점검</td><td>추출 테스트와 서식 보존 체크리스트</td></tr></table></div>`},
{note:'문제정의를 초반에 잘 잡으려면 어떤 순서로 점검해야 하는지 알려주는 의사결정 트리. 멘토가 멘티 사례에 적용한 점검 순서 그대로다.',html:`<div class="paper"><div class="kicker">초반에 문제정의를 잘 잡는 법</div><div class="h2">이 4가지를 순서대로 점검하면<br>문제정의 오류는 거의 잡힙니다</div><div style="margin-top:24px"><div class="step"><div class="num">1</div><div><strong>결과물 이름부터 적었는가? — 그렇다면 의심</strong><span>'챗봇', '대시보드', '제안서'처럼 결과물 이름이 먼저 나온다면, 데이터·반복 패턴부터 다시 검토합니다. (멘티 A 패턴)</span></div></div><div class="step"><div class="num">2</div><div><strong>처리 단계가 4개 이상인가? — 그렇다면 첫 스킬 1개만 남김</strong><span>최종 산출물부터 정의하면 첫 실행이 안 보입니다. 5단계를 그리되 이번 주에 검증할 단계 1개만 분리합니다. (멘티 B 패턴)</span></div></div><div class="step"><div class="num">3</div><div><strong>입력·출력·조건·규모가 한 문장씩 나오는가? — 그렇다면 잘된 사례</strong><span>네 항목이 모두 명확하면 문제정의 단계는 끝. 검증 기준(정확도·시간 단축·수정 횟수 중 1개)으로 넘어갑니다. (멘티 C 패턴)</span></div></div><div class="step"><div class="num">4</div><div><strong>파일 포맷·배포 조건이 표준이 아닌가? — 그렇다면 추출 가능성부터 테스트</strong><span>HWPX·이미지 PDF·내부 시스템 export처럼 표준이 아닌 포맷이 끼어 있으면, 자동화 범위 자체를 좁혀야 합니다. (멘티 D 패턴)</span></div></div></div><div class="callout orange"><b>문제정의 → 범위 → 검증 → 구현</b> 순서로 점검합니다. 앞 단계가 흔들리면 뒤 단계는 자동으로 무너집니다.</div></div>`},
{note:'워크숍 안내. 수강생들이 자기 사례를 점검하게 만든다.',html:`<div class="paper"><div class="kicker">실습 정리</div><div class="h2">내 과제를 3문장으로 재정의합니다</div><div class="grid3" style="margin-top:26px"><div class="card orangebg"><div class="label orange">문장 1</div><div class="ctitle">문제정의</div><div class="cbody">누가, 언제, 어떤 반복 상황에서 어려움을 겪는지 정리합니다.</div></div><div class="card bluebg"><div class="label blue">문장 2</div><div class="ctitle">첫 스킬</div><div class="cbody">가장 먼저 처리할 입력과 출력은 무엇인지 정리합니다.</div></div><div class="card greenbg"><div class="label green">문장 3</div><div class="ctitle">다음 제출물</div><div class="cbody">이번 주 안에 문서, 표, 실행 로그 중 무엇을 가져올지 정리합니다.</div></div></div><div class="callout dark">세 문장이 정리되지 않으면 구현보다 문제 범위 조정이 우선입니다.</div></div>`},
{note:'실습용 프롬프트. 슬라이드에서 수업 중 활용할 수 있게 한다.',html:`<div class="paper"><div class="kicker">점검 프롬프트</div><div class="h2">과제 점검용 프롬프트</div><div class="mono" style="margin-top:24px;white-space:pre-wrap">아래 과제를 보고 현재 병목 유형을 분류해 주세요.\n\n유형은 4개로 나눠 주세요.\n1. 결과물 이름에 끌려 문제정의가 틀어진 경우\n2. 문제 범위가 너무 넓어 첫 스킬이 안 보이는 경우\n3. 입력, 출력, 조건, 규모가 보여 파일럿 가능한 경우\n4. 파일 포맷 처리나 배포 조건 때문에 구현 가능성 점검이 필요한 경우\n\n그 다음 아래 3가지를 제안해 주세요.\n- 다시 써야 할 문제정의 문장 1개\n- 이번 주에 만들 첫 스킬 이름 1개\n- 다음 제출물 3개 이내\n\n[내 과제]\n여기에 본인 과제 입력</div><div class="callout blue">이 프롬프트의 목적은 과제를 실행 가능한 첫 단위로 축소하는 것입니다.</div></div>`},
{note:'마무리. 핵심 한 줄로 끝낸다.',html:`<div class="paper"><div class="kicker">핵심 정리</div><div class="bigquote">업무 자동화 과제는<br>큰 문제를 한 번에 해결하기보다<br><span class="hl">첫 실행 단위</span>를 정확히 정하는 데서 시작합니다.</div><div class="pillrow" style="justify-content:center;margin-top:34px"><span class="pill orange">문제정의</span><span class="pill blue">첫 스킬</span><span class="pill green">파일럿</span><span class="pill purple">구현 가능성</span></div></div>`}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
