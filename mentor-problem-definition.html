.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border-radius:22px;padding:24px;border:1px solid var(--line);background:#fff}.bluebg{background:var(--blue2);border-color:var(--blue3)}.orangebg{background:var(--orange2);border-color:var(--orange3)}.redbg{background:var(--red2);border-color:var(--red3)}.greenbg{background:var(--green2);border-color:var(--green3)}.purplebg{background:var(--purple2);border-color:var(--purple3)}.graybg{background:#f8fafc;border-color:#e2e8f0}.label{font-size:12px;font-weight:950;letter-spacing:.02em;color:#9ca3af;text-transform:uppercase;margin-bottom:10px}.label.orange{color:var(--orange)}.label.blue{color:var(--blue)}.label.red{color:var(--red)}.label.green{color:var(--green)}.label.purple{color:var(--purple)}.ctitle{font-size:20px;font-weight:950;letter-spacing:-.035em;line-height:1.32;margin-bottom:10px}.cbody{font-size:15px;color:#6b7280;line-height:1.72}.cbody b{color:#111827}.callout{border-radius:20px;padding:19px 23px;margin-top:18px;font-size:17px;line-height:1.65;font-weight:760}.callout.orange{background:var(--orange2);border:1px solid var(--orange3);color:#9a3412}.callout.blue{background:var(--blue2);border:1px solid var(--blue3);color:#1d4ed8}.callout.green{background:var(--green2);border:1px solid var(--green3);color:#047857}.callout.purple{background:var(--purple2);border:1px solid var(--purple3);color:#5b21b6}.callout.dark{background:#111827;color:#fff}.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;padding:8px 15px;font-size:14px;font-weight:850;color:#6b7280}.pill.orange{background:var(--orange2);border-color:var(--orange3);color:var(--orange)}.pill.blue{background:var(--blue2);border-color:var(--blue3);color:var(--blue)}.pill.green{background:var(--green2);border-color:var(--green3);color:var(--green)}.pill.purple{background:var(--purple2);border-color:var(--purple3);color:var(--purple)}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px;border-radius:18px;border:1px solid var(--line);background:#fff;margin-bottom:12px}.num{width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.num.red{background:var(--red)}.num.orange{background:var(--orange)}.num.green{background:var(--green)}.num.purple{background:var(--purple)}.step strong{display:block;font-size:18px;letter-spacing:-.035em;margin-bottom:5px}.step span{font-size:15px;color:#6b7280;line-height:1.65}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.table th{background:#f8fafc;font-size:13px;color:#6b7280;text-align:left;padding:14px 16px}.table td{padding:15px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.65;vertical-align:top}.table td:first-child{font-weight:900;color:#111827}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7;color:#374151}.bigquote{font-size:30px;line-height:1.45;letter-spacing:-.055em;font-weight:950;text-align:center;color:#111827}.arrow{font-size:24px;color:#cbd5e1;font-weight:950;display:flex;align-items:center;justify-content:center}.caseTag{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:18px}.caseTag.red{background:var(--red2);color:var(--red);border:1px solid var(--red3)}.caseTag.orange{background:var(--orange2);color:var(--orange);border:1px solid var(--orange3)}.caseTag.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}.caseTag.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}.twoflow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.notes{position:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}

<script>
const SLIDES=[
{note:'오프닝. 오늘은 좋은 사례만 보여주는 시간이 아니라, 왜 좁히기가 필요한지 감을 잡는 시간이라고 말한다.',html:`<div class="paper"><div class="kicker">Mentor Case Workshop</div><div class="h1">나쁜 사례 2개<br>좋은 사례 1개<br>숨겨진 함정 1개</div><div class="sub">문제정의가 틀어진 케이스부터 구현에서 막히는 케이스까지 보고<br>내 과제를 어디서부터 좁혀야 하는지 점검합니다.</div><div class="pillrow"><span class="pill orange">멘티 A</span><span class="pill orange">멘티 B</span><span class="pill green">멘티 C</span><span class="pill purple">멘티 D</span><span class="pill blue">내 케이스 점검</span><span class="pill dark">익명화</span></div></div>`},
{note:'강의 흐름 설명. 사례 소개가 목적이 아니라 판단 기준을 가져가는 것이 목적임을 강조한다.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">오늘 흐름은 이렇게 갑니다</div><div style="margin-top:26px"><div class="step"><div class="num red">1</div><div><strong>문제정의가 잘못된 사례</strong><span>결과물 이름에 끌려 실제 설계 방식까지 틀어진 케이스를 봅니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>문제가 너무 넓은 사례</strong><span>최종 산출물을 한 번에 만들려다 첫 스킬 이름을 못 정한 케이스를 봅니다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>잘 된 사례</strong><span>입력, 출력, 조건, 규모가 보여서 바로 파일럿 가능한 케이스를 봅니다.</span></div></div><div class="step"><div class="num purple">4</div><div><strong>숨겨진 함정 사례</strong><span>문제정의는 맞아도 포맷 처리와 배포 조건 때문에 파일럿 설계를 먼저 점검해야 하는 케이스를 봅니다.</span></div></div></div><div class="callout dark">목표는 사례 암기가 아니라, 내 과제를 어느 유형으로 봐야 하는지 판단하는 것입니다.</div></div>`},
{note:'3+1 추천 결과를 표로 정리. 각 케이스의 역할이 다르다는 점을 말한다.',html:`<div class="paper"><div class="kicker">Case Selection</div><div class="h2">추천 사례 3+1 <span style="font-size:18px;color:#94a3b8;font-weight:700">· 익명화 버전</span></div><table class="table" style="margin-top:24px"><tr><th>순서</th><th>이름</th><th>유형</th><th>핵심 포인트</th></tr><tr><td>1</td><td>멘티 A</td><td>문제정의 잘못됨</td><td>챗봇과 LLM 분석을 혼동해 결과물 이름에 설계 방식까지 끌려감</td></tr><tr><td>2</td><td>멘티 B</td><td>문제 범위 과잉</td><td>5단계를 모두 하려다 첫 스킬 이름을 못 정함</td></tr><tr><td>3</td><td>멘티 C</td><td>잘 된 사례</td><td>입력, 출력, 조건, 규모가 보여 바로 검증 가능한 교과서 케이스</td></tr><tr><td>+1</td><td>멘티 D</td><td>구현과 배포 막힘</td><td>문제정의가 맞아도 HWPX 포맷 처리 방식을 모르면 구현에서 막힘</td></tr></table></div>`},
{note:'멘티 A 사례. 챗봇이 틀렸다는 말이 아니라, 먼저 해야 할 일이 답변 생성이 아니라 패턴 분석이라는 점을 강조한다.',html:`<div class="paper"><div class="caseTag red">Case 1 · 멘티 A · 문제정의가 잘못된 경우</div><div class="h2">챗봇을 만들고 싶었지만<br>사실 먼저 필요한 건 분석 리포트였습니다</div><div class="twoflow" style="margin-top:26px"><div class="card redbg"><div class="label red">처음 접근</div><div class="ctitle">헬프데스크 문의를 자동 답변하는 챗봇</div><div class="cbody">챗봇이라는 결과물 이름이 먼저 나오면서 실시간 응답, FAQ 매칭, 답변 정확도 문제가 먼저 떠올랐습니다. 단순 FAQ 응대라면 LLM보다 검색형 챗봇이나 룰 기반 흐름이 더 맞을 수도 있습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">멘토가 바꾼 관점</div><div class="ctitle">누적 문의 데이터에서 반복 패턴을 뽑는 LLM 분석</div><div class="cbody">먼저 반복 문의가 무엇인지 알아야 답변 기준도 만들 수 있습니다. 그래서 1차 목표는 자동 답변이 아니라 문의 유형 분석입니다.</div></div></div><div class="callout orange">이 사례는 결과물 이름에 끌려가면 문제정의가 어떻게 틀어지는지 보여주기 좋습니다.</div></div>`},
{note:'멘티 A 사례의 이해 포인트. 멘티들이 챗봇과 LLM을 자주 혼동하므로 구분표를 보여준다.',html:`<div class="paper"><div class="caseTag red">Case 1 · 이해 포인트</div><div class="h2">챗봇과 LLM 분석은 출발점이 다릅니다</div><table class="table" style="margin-top:24px"><tr><th>구분</th><th>챗봇으로 보면</th><th>LLM 분석으로 보면</th></tr><tr><td>질문</td><td>사용자 질문에 어떻게 답할까?</td><td>반복 문의가 어떤 패턴으로 쌓였을까?</td></tr><tr><td>필요 기준</td><td>FAQ, 답변 정책, 예외 응대 기준</td><td>분류 기준, 빈도 기준, 처리시간 기준</td></tr><tr><td>첫 산출물</td><td>답변 시나리오</td><td>반복 문의 Top N 분석표</td></tr><tr><td>첫 스킬</td><td>자동 답변 생성</td><td><span class="mono">문의유형 분류</span></td></tr></table><div class="callout blue">쉽게 말하면, 챗봇은 답을 주는 구조이고 LLM 분석은 먼저 문제를 읽는 구조입니다.</div></div>`},
{note:'추가 설명 페이지. 챗봇과 LLM은 같은 것이 아니라 층위가 다르다는 점을 분명히 짚는다.',html:`<div class="paper"><div class="caseTag red">Extra Page · 챗봇 vs LLM</div><div class="h2">챗봇과 LLM은 같은 것이 아니라<br>역할이 다른 두 층위입니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">Chatbot</div><div class="ctitle">사용자와 대화하는 인터페이스 또는 제품</div><div class="cbody">웹, 앱, 메신저 안에서 사용자가 질문을 던지고 답을 받는 <b>대화형 접점</b>입니다. 규칙 기반일 수도 있고, 검색 기반일 수도 있고, LLM을 붙인 AI 챗봇일 수도 있습니다.</div><div class="pillrow"><span class="pill orange">보이는 것</span><span class="pill orange">대화 흐름</span><span class="pill orange">채널·UI</span></div></div><div class="card bluebg"><div class="label blue">LLM</div><div class="ctitle">텍스트를 이해·생성하는 언어 모델</div><div class="cbody">대량의 텍스트를 바탕으로 학습된 <b>언어 처리 엔진</b>입니다. 대화형 답변뿐 아니라 분류, 요약, 초안 작성, 패턴 분석처럼 챗봇이 아닌 업무에도 쓸 수 있습니다.</div><div class="pillrow"><span class="pill blue">보이지 않는 엔진</span><span class="pill blue">분류·요약·생성</span><span class="pill blue">분석 작업</span></div></div></div><table class="table" style="margin-top:22px"><tr><th>구분</th><th>챗봇</th><th>LLM</th></tr><tr><td>무엇인가</td><td>사용자와 대화하는 애플리케이션·인터페이스</td><td>자연어를 이해하고 생성하는 모델</td></tr><tr><td>꼭 서로 필요한가</td><td>아니요. 룰 기반·검색형 챗봇도 가능</td><td>아니요. 챗봇 없이도 분류, 요약, 보고서 작성에 사용 가능</td></tr><tr><td>잘 맞는 첫 질문</td><td>사용자에게 어떤 답을 돌려줄까?</td><td>이 데이터를 어떻게 읽고 분류할까?</td></tr><tr><td>예시</td><td>FAQ 응대, 예약, 신청 상태 조회</td><td>문의유형 분류, 반복 이슈 요약, 보고서 초안</td></tr></table><div class="callout dark">헷갈리지 않게 한 줄로 말하면, <b>챗봇은 대화 창이고 LLM은 그 안에서 일할 수도 있는 두뇌</b>입니다. 그래서 모든 챗봇이 LLM은 아니고, 모든 LLM이 챗봇도 아닙니다.</div></div>`},
{note:'멘티 B 사례. 방향은 맞는데 너무 크다. 최종 제안서와 첫 스킬을 분리하는 코칭이 필요하다.',html:`<div class="paper"><div class="caseTag orange">Case 2 · 멘티 B · 문제가 너무 넓은 경우</div><div class="h2">최종 산출물을 한 번에 잡으면<br>첫 실행이 안 보입니다</div><div class="twoflow" style="margin-top:26px"><div class="card orangebg"><div class="label orange">처음 접근</div><div class="ctitle">교육 데이터와 외부 트렌드로 신규 교육 제안서 만들기</div><div class="cbody">수집, 분류, 트렌드 조사, 매칭, 제안서 작성이 모두 포함되면서 AI가 어디서 시작해야 하는지 흐려졌습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">멘토가 줄인 범위</div><div class="ctitle">외부 교육 신청 데이터를 주제별로 분류하기</div><div class="cbody">최종 산출물은 제안서여도 첫 실행은 제안서가 아닙니다. 먼저 주제 분류가 되어야 이후 매칭과 제안이 가능합니다.</div></div></div><div class="callout orange">이 케이스는 나쁜 기획이 아니라 너무 큰 기획입니다. 그래서 버리는 게 아니라 순서를 다시 잡아야 합니다.</div></div>`},
{note:'멘티 B 사례를 5단계에서 첫 스킬로 줄이는 장표. 이 구조는 다른 멘티에게도 바로 적용할 수 있다.',html:`<div class="paper"><div class="caseTag orange">Case 2 · 범위 축소 방식</div><div class="h2">5단계 전체가 아니라<br>첫 번째 스킬 이름부터 정합니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">너무 넓은 흐름</div><div class="ctitle">데이터 수집 → 분류 → 트렌드 조사 → 매칭 → 제안서</div><div class="cbody">각 단계의 성격이 달라 한 번에 자동화하면 기준이 계속 바뀝니다.</div></div><div class="card bluebg"><div class="label blue">이번 주 실행 단위</div><div class="ctitle"><span class="mono">주제별 분류</span></div><div class="cbody"><b>입력</b> 교육 신청 엑셀, 직군 매핑표<br><b>출력</b> 직군별 주제 랭킹<br><b>조건</b> 분류 기준 5개 이내</div></div></div><div class="callout blue">멘토가 물어볼 질문은 간단합니다. 이번 주 안에 만들 첫 스킬 이름이 뭔가요?</div></div>`},
{note:'멘티 C 사례. 좋은 사례는 왜 좋은지 해석해야 한다. 단순히 잘했다고 하지 않고, AI 설계 관점에서 왜 실행 가능한지 짚는다.',html:`<div class="paper"><div class="caseTag green">Case 3 · 멘티 C · 잘 된 사례</div><div class="h2">좋은 사례는 이미<br>입력, 출력, 조건, 규모가 보입니다</div><div class="grid4" style="margin-top:28px"><div class="card greenbg"><div class="label green">INPUT</div><div class="ctitle">무엇을 넣는지</div><div class="cbody">AI가 읽을 자료가 명확합니다. 파일, 표, 텍스트처럼 시작점이 보입니다.</div></div><div class="card greenbg"><div class="label green">OUTPUT</div><div class="ctitle">무엇을 뽑는지</div><div class="cbody">보고서, 표, 초안, 체크리스트처럼 결과 형태가 보입니다.</div></div><div class="card greenbg"><div class="label green">CONDITION</div><div class="ctitle">어떤 기준인지</div><div class="cbody">분류 기준이나 판단 조건을 사람이 설명할 수 있습니다.</div></div><div class="card greenbg"><div class="label green">SCALE</div><div class="ctitle">얼마나 돌릴지</div><div class="cbody">샘플 개수나 파일럿 범위를 정할 수 있습니다.</div></div></div><div class="callout green">이 정도가 보이면 멘토는 바로 다음 제출물을 지정할 수 있습니다. 문제정의보다 파일럿 설계로 넘어가도 되는 단계입니다.</div></div>`},
{note:'멘티 C 사례를 교과서 케이스로 설명. 좋은 케이스는 칭찬보다 검증 계획이 중요하다.',html:`<div class="paper"><div class="caseTag green">Case 3 · 멘토 피드백 방향</div><div class="h2">잘 된 사례에는 더 큰 기획보다<br>검증 기준을 붙여줘야 합니다</div><table class="table" style="margin-top:24px"><tr><th>볼 것</th><th>멘토 판단</th><th>다음 제출 가이드</th></tr><tr><td>문제정의</td><td>이미 업무 장면과 반복성이 보임</td><td>문제정의 문장은 짧게 고정</td></tr><tr><td>업무 구조</td><td>입력과 출력이 연결됨</td><td>중간 처리 기준만 표로 정리</td></tr><tr><td>AI 활용</td><td>초안 생성이나 분류에 바로 적용 가능</td><td>샘플 10건으로 1차 실행</td></tr><tr><td>검증</td><td>이제 성공 기준이 필요함</td><td>정확도, 수정 횟수, 시간 단축 중 1개를 대표 지표로 선택</td></tr></table><div class="callout dark">좋은 케이스에 필요한 피드백은 “더 해보세요”가 아니라 “이제 무엇으로 성공을 판단할지 정하세요”입니다.</div></div>`},
{note:'멘티 D 사례. 숨겨진 함정. 문제정의가 맞아도 포맷에서 막힐 수 있다는 점을 강하게 전달한다.',html:`<div class="paper"><div class="caseTag purple">Case +1 · 멘티 D · 구현과 배포에서 막히는 경우</div><div class="h2">문제정의가 맞아도<br>파일 포맷이 막으면 시작도 어렵습니다</div><div class="grid2" style="margin-top:24px"><div class="card purplebg"><div class="label purple">겉으로 보이는 문제</div><div class="ctitle">HWPX 문서를 AI로 자동 처리하고 싶다</div><div class="cbody">업무 문제 자체는 분명합니다. 반복 문서 작성이나 검토를 줄이려는 방향도 맞습니다.</div></div><div class="card redbg"><div class="label red">실제 함정</div><div class="ctitle">LLM에 그대로 넣기보다 추출·변환 설계가 필요한 포맷</div><div class="cbody">HWPX는 ZIP 기반 XML 구조라 텍스트 추출 자체는 HWP보다 유리한 편입니다. 다만 LLM에 파일을 그대로 던져서 서식까지 보존한 결과물을 만들기는 어렵기 때문에, 추출·검토·재반영 단계를 나눠야 합니다.</div></div></div><div class="callout purple">이 사례는 문제정의 다음에 구현 가능성 체크가 바로 붙어야 하는 케이스입니다. 좋은 문제라도 포맷 처리 방식이 불명확하면 파일럿 설계를 바꿔야 합니다.</div></div>`},
{note:'멘티 D 케이스 해결 방향. HWPX 원본 자동화가 아니라 추출 가능한 단위로 분리하는 게 먼저라고 말한다.',html:`<div class="paper"><div class="caseTag purple">Case +1 · 현실적인 우회 방식</div><div class="h2">HWPX는 바로 자동화하지 말고<br>읽을 수 있는 단위로 먼저 분해합니다</div><div style="margin-top:24px"><div class="step"><div class="num purple">1</div><div><strong>원본 문서에서 텍스트와 표 구조를 먼저 추출</strong><span>문서 전체를 AI에게 그대로 맡기기보다 압축 해제 또는 변환을 통해 제목, 본문, 표, 서식 요소를 나눠 확인합니다.</span></div></div><div class="step"><div class="num purple">2</div><div><strong>AI에게 맡길 범위를 초안 작성이나 검토로 제한</strong><span>최종 HWPX 재생성이 아니라 문장 초안, 누락 체크, 요약처럼 안전한 범위부터 시작합니다.</span></div></div><div class="step"><div class="num purple">3</div><div><strong>최종 문서 반영은 사람이 하거나 별도 변환 도구를 둠</strong><span>서식 보존과 기관 제출용 문서는 변환 도구 또는 한글 편집기를 거친 뒤 사람이 마지막 검토 지점을 잡아야 합니다.</span></div></div></div><div class="callout blue">이 케이스의 첫 제출물은 자동화 결과물이 아니라 포맷 처리 가능성 체크리스트가 더 맞습니다.</div></div>`},
{note:'네 사례를 한 장으로 종합. 듣는 사람들이 내 케이스가 어느 칸인지 판단하게 한다.',html:`<div class="paper"><div class="kicker">Case Map</div><div class="h2">네 사례는 서로 다른 실패 지점을 보여줍니다</div><table class="table" style="margin-top:24px"><tr><th>이름</th><th>막힌 지점</th><th>멘토 처방</th><th>다음 제출물</th></tr><tr><td>멘티 A</td><td>결과물 이름이 문제정의를 끌고 감</td><td>챗봇에서 LLM 분석으로 전환</td><td>분류 기준표와 반복 패턴 리포트</td></tr><tr><td>멘티 B</td><td>범위가 커서 첫 실행이 안 보임</td><td>5단계 중 첫 스킬만 선택</td><td>주제별 분류표와 샘플 실행 로그</td></tr><tr><td>멘티 C</td><td>구조는 잡혔고 검증 기준이 필요함</td><td>파일럿 성공 기준 설정</td><td>샘플 실행 결과와 성공 지표</td></tr><tr><td>멘티 D</td><td>파일 포맷 처리 방식 때문에 구현이 막힘</td><td>추출·서식 보존 가능성 먼저 점검</td><td>추출 테스트와 서식 보존 체크리스트</td></tr></table></div>`},
{note:'멘티들이 스스로 유형을 판단하는 의사결정 트리. 질문 순서를 알려준다.',html:`<div class="paper"><div class="kicker">Mentor Decision Tree</div><div class="h2">내 케이스는 어디부터 봐야 할까?</div><div style="margin-top:24px"><div class="step"><div class="num">1</div><div><strong>결과물 이름부터 말하고 있나요?</strong><span>그렇다면 멘티 A 케이스처럼 문제정의와 데이터 흐름을 다시 봅니다.</span></div></div><div class="step"><div class="num">2</div><div><strong>해야 할 단계가 4개 이상인가요?</strong><span>그렇다면 멘티 B 케이스처럼 첫 스킬 하나만 남깁니다.</span></div></div><div class="step"><div class="num">3</div><div><strong>입력, 출력, 조건, 규모가 보이나요?</strong><span>그렇다면 멘티 C 케이스처럼 검증 기준과 파일럿으로 넘어갑니다.</span></div></div><div class="step"><div class="num">4</div><div><strong>파일 포맷 처리나 배포 조건이 막고 있나요?</strong><span>그렇다면 멘티 D 케이스처럼 추출·변환·서식 보존 가능성부터 테스트합니다.</span></div></div></div><div class="callout orange">문제정의, 범위, 검증, 구현 중 어디서 막혔는지만 찾아도 다음 행동이 훨씬 선명해집니다.</div></div>`},
{note:'워크숍 안내. 수강생들이 바로 자기 케이스를 점검하게 만든다.',html:`<div class="paper"><div class="kicker">Mini Workshop</div><div class="h2">내 케이스를 3문장으로 다시 써봅니다</div><div class="grid3" style="margin-top:26px"><div class="card orangebg"><div class="label orange">문장 1</div><div class="ctitle">문제정의</div><div class="cbody">누가, 언제, 무엇 때문에 반복적으로 막히나요?</div></div><div class="card bluebg"><div class="label blue">문장 2</div><div class="ctitle">첫 스킬</div><div class="cbody">AI가 가장 먼저 처리할 입력과 출력은 무엇인가요?</div></div><div class="card greenbg"><div class="label green">문장 3</div><div class="ctitle">다음 제출물</div><div class="cbody">이번 주 안에 문서, 표, 실행 로그 중 무엇을 가져오나요?</div></div></div><div class="callout dark">이 세 문장이 바로 안 나오면 아직 에이전트 만드는 단계가 아니라 문제를 좁히는 단계입니다.</div></div>`},
{note:'실습용 프롬프트. 슬라이드에서 바로 복붙 가능하게 한다.',html:`<div class="paper"><div class="kicker">Workshop Prompt</div><div class="h2">내 과제 점검용 복붙 프롬프트</div><div class="mono" style="margin-top:24px;white-space:pre-wrap">아래 과제를 보고 내가 어느 유형에 가까운지 판단해줘.\n\n유형은 4개로 나눠줘.\n1. 결과물 이름에 끌려 문제정의가 틀어진 경우\n2. 문제 범위가 너무 넓어 첫 스킬이 안 보이는 경우\n3. 입력, 출력, 조건, 규모가 보여 파일럿 가능한 경우\n4. 파일 포맷 처리나 배포 조건 때문에 구현 가능성 점검이 필요한 경우\n\n그 다음 아래 3가지를 제안해줘.\n- 다시 써야 할 문제정의 문장 1개\n- 이번 주에 만들 첫 스킬 이름 1개\n- 다음 제출물 3개 이내\n\n[내 과제]\n여기에 원문 붙여넣기</div><div class="callout blue">프롬프트의 목적은 멋진 답변을 받는 게 아니라, 내 과제를 실행 가능한 첫 단위로 줄이는 것입니다.</div></div>`},
{note:'마무리. 핵심 한 줄로 끝낸다.',html:`<div class="paper"><div class="kicker">Final Message</div><div class="bigquote">좋은 에이전트는<br>큰 문제를 한 번에 푸는 게 아니라<br><span class="hl">첫 실행 단위</span>를 정확히 고르는 데서 시작합니다.</div><div class="pillrow" style="justify-content:center;margin-top:34px"><span class="pill orange">문제정의</span><span class="pill blue">첫 스킬</span><span class="pill green">파일럿</span><span class="pill purple">구현 가능성</span></div></div>`}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
