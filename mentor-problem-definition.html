.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px;border-radius:18px;border:1px solid var(--line);background:#fff;margin-bottom:12px}.num{width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.num.red{background:var(--red)}.num.orange{background:var(--orange)}.num.green{background:var(--green)}.num.purple{background:var(--purple)}.step strong{display:block;font-size:18px;letter-spacing:-.035em;margin-bottom:5px}.step span{font-size:15px;color:#6b7280;line-height:1.65}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.table th{background:#f8fafc;font-size:13px;color:#6b7280;text-align:left;padding:14px 16px}.table td{padding:15px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.65;vertical-align:top}.table td:first-child{font-weight:900;color:#111827}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7;color:#374151}.bigquote{font-size:30px;line-height:1.45;letter-spacing:-.055em;font-weight:950;text-align:center;color:#111827}.arrow{font-size:24px;color:#cbd5e1;font-weight:950;display:flex;align-items:center;justify-content:center}.caseTag{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:18px}.caseTag.red{background:var(--red2);color:var(--red);border:1px solid var(--red3)}.caseTag.orange{background:var(--orange2);color:var(--orange);border:1px solid var(--orange3)}.caseTag.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}.caseTag.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}.twoflow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.notes{position:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}

:root{
  --bg:#fafaf9;--paper:#fff;--ink:#2c2c2c;--text:#2c2c2c;--muted:#6b6b6b;--sub:#8a8a8a;

<header class="topbar">

<script>
const SLIDES=[
{note:'오전 시작. 멘티 사례를 통해 잘된 사례·아쉬운 사례를 비교하고, 멘토가 어떻게 피드백했는지·문제정의를 초반에 잘 잡으려면 어떻게 해야 하는지를 다루는 시간임을 안내한다.',html:`<div class="paper"><div class="kicker">Problem Definition · Mentor Feedback</div><div class="h1">잘된 사례 vs 아쉬운 사례<br>멘티 4명으로 보는<br><span class="hl">문제정의 코칭</span></div><div class="sub">아쉬운 사례에는 멘토가 어떻게 피드백했는지,<br>자주 발생하는 문제정의 오류 4가지,<br>그리고 초반에 잘 잡으려면 어디부터 점검해야 하는지를 다룹니다.</div><div class="pillrow"><span class="pill orange">아쉬운 사례 · 멘티 A</span><span class="pill orange">아쉬운 사례 · 멘티 B</span><span class="pill green">잘된 사례 · 멘티 C</span><span class="pill purple">제약 사례 · 멘티 D</span><span class="pill blue">멘토 피드백</span><span class="pill dark">익명화</span></div></div>`},
{note:'강의 흐름 설명. 사례 외우기가 아니라 멘토 피드백 방식과 초반 문제정의 잘 잡는 법을 가져가는 것이 목적임을 강조한다.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">사례 검토 순서</div><div style="margin-top:26px"><div class="step"><div class="num red">1</div><div><strong>아쉬운 사례 1 — 결과물 이름이 문제정의를 끌고 간 경우</strong><span>'챗봇'이라는 결과물 이름이 설계 방향까지 흐트러뜨린 사례. 멘토가 어떻게 LLM 분석으로 방향을 돌렸는지 본다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>아쉬운 사례 2 — 범위가 너무 넓어 첫 실행이 안 보인 경우</strong><span>5단계를 한 번에 자동화하려다 막힌 사례. 멘토가 어떻게 첫 스킬 한 개로 줄였는지 본다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>잘된 사례 — 입력·출력·조건·규모가 명확해 파일럿 설계가 가능한 경우</strong><span>왜 잘된 사례인지, 그리고 잘된 사례에는 어떤 피드백을 더해야 하는지 본다.</span></div></div><div class="step"><div class="num purple">4</div><div><strong>제약 사례 — 문제정의는 맞아도 포맷·배포에서 막히는 경우</strong><span>HWPX 처리처럼 문제정의 이후 구현 가능성 점검이 따로 필요한 사례를 본다.</span></div></div></div><div class="callout dark">목표는 사례를 외우는 게 아니라, <b>잘된 사례·아쉬운 사례 구분 기준과 멘토의 피드백 방식</b>을 본인 과제에 옮기는 것입니다.</div></div>`},
{note:'3+1 추천 결과를 표로 정리. 각 사례의 역할이 다르다는 점을 말한다.',html:`<div class="paper"><div class="kicker">사례 선정</div><div class="h2">사례 구성 3+1 <span style="font-size:18px;color:#94a3b8;font-weight:700">· 익명화 버전</span></div><table class="table" style="margin-top:24px"><tr><th>순서</th><th>이름</th><th>유형</th><th>핵심 포인트</th></tr><tr><td>1</td><td>멘티 A</td><td>문제정의 잘못됨</td><td>챗봇과 LLM 분석을 혼동해 결과물 이름에 설계 방식까지 영향을 받음</td></tr><tr><td>2</td><td>멘티 B</td><td>문제 범위 과잉</td><td>5단계를 모두 하려다 첫 스킬 이름을 못 정함</td></tr><tr><td>3</td><td>멘티 C</td><td>실행 가능 사례</td><td>입력, 출력, 조건, 규모가 명확해 검증 설계가 가능한 사례</td></tr><tr><td>+1</td><td>멘티 D</td><td>구현·배포 제약</td><td>문제정의 이후 HWPX 처리 방식 검토가 필요한 사례</td></tr></table></div>`},
{note:'멘티 A 사례. 챗봇이 부적절하다는 뜻이 아니라, 먼저 해야 할 일이 답변 생성이 아니라 패턴 분석이라는 점을 강조한다.',html:`<div class="paper"><div class="caseTag red">사례 1 · 멘티 A · 문제정의가 잘못된 경우</div><div class="h2">자동 응답보다<br>문의 유형 분석이 먼저 필요한 사례</div><div class="twoflow" style="margin-top:26px"><div class="card redbg"><div class="label red">처음 접근</div><div class="ctitle">헬프데스크 문의를 자동 답변하는 챗봇</div><div class="cbody">자동 응답 화면을 먼저 떠올리면 FAQ 매칭, 실시간 응대, 답변 정책부터 설계하게 됩니다. 그러나 이 사례의 선행 과제는 누적 문의 데이터의 반복 패턴을 확인하는 일이었습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">멘토가 바꾼 관점</div><div class="ctitle">누적 문의 데이터에서 반복 패턴을 뽑는 LLM 분석</div><div class="cbody">반복 문의의 유형과 빈도를 먼저 확인해야 답변 기준도 설계할 수 있습니다. 따라서 1차 산출물은 자동 답변이 아니라 문의 유형 분석표입니다.</div></div></div><div class="callout orange">이 사례는 결과물 명칭이 문제정의와 실행 범위를 왜곡할 수 있음을 보여줍니다.</div></div>`},
{note:'멘티 A 사례의 이해 포인트. 멘티들이 챗봇과 LLM을 자주 혼동하므로 구분표를 보여준다.',html:`<div class="paper"><div class="caseTag red">사례 1 · 설계 구분</div><div class="h2">챗봇과 LLM 분석은 출발점이 다릅니다</div><table class="table" style="margin-top:24px"><tr><th>구분</th><th>챗봇으로 보면</th><th>LLM 분석으로 보면</th></tr><tr><td>질문</td><td>사용자 질문에 답변 기준은 무엇인가</td><td>반복 문의가 어떤 패턴으로 쌓였는가</td></tr><tr><td>필요 기준</td><td>FAQ, 답변 정책, 예외 응대 기준</td><td>분류 기준, 빈도 기준, 처리시간 기준</td></tr><tr><td>첫 산출물</td><td>답변 시나리오</td><td>반복 문의 Top N 분석표</td></tr><tr><td>첫 스킬</td><td>자동 답변 생성</td><td><span class="mono">문의유형 분류</span></td></tr></table><div class="callout blue">정리하면, 챗봇은 응답 인터페이스이고 LLM 분석은 누적 데이터를 해석하는 처리 방식입니다.</div></div>`},
{note:'추가 설명 페이지. 챗봇과 LLM은 같은 것이 아니라 층위가 다르다는 점을 분명히 짚는다.',html:`<div class="paper"><div class="caseTag red">설계 참고 · 챗봇 vs LLM</div><div class="h2">챗봇과 LLM 분석은<br>설계 층위가 다릅니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">Chatbot</div><div class="ctitle">사용자와 대화하는 인터페이스 또는 제품</div><div class="cbody">웹, 앱, 메신저 안에서 사용자가 질문을 던지고 답을 받는 <b>대화형 접점</b>입니다. 규칙 기반일 수도 있고, 검색 기반일 수도 있고, LLM을 결합한 챗봇일 수도 있습니다.</div><div class="pillrow"><span class="pill orange">보이는 것</span><span class="pill orange">대화 흐름</span><span class="pill orange">채널·UI</span></div></div><div class="card bluebg"><div class="label blue">LLM</div><div class="ctitle">텍스트를 이해·생성하는 언어 모델</div><div class="cbody">대량의 텍스트를 바탕으로 학습된 <b>언어 처리 엔진</b>입니다. 대화형 답변뿐 아니라 분류, 요약, 초안 작성, 패턴 분석처럼 챗봇이 아닌 업무에도 쓸 수 있습니다.</div><div class="pillrow"><span class="pill blue">보이지 않는 엔진</span><span class="pill blue">분류·요약·생성</span><span class="pill blue">분석 작업</span></div></div></div><table class="table" style="margin-top:22px"><tr><th>구분</th><th>챗봇</th><th>LLM</th></tr><tr><td>무엇인가</td><td>사용자와 대화하는 애플리케이션·인터페이스</td><td>자연어를 이해하고 생성하는 모델</td></tr><tr><td>꼭 서로 필요한가</td><td>아니요. 룰 기반·검색형 챗봇도 가능</td><td>아니요. 챗봇 없이도 분류, 요약, 보고서 작성에 사용 가능</td></tr><tr><td>잘 맞는 첫 질문</td><td>사용자에게 어떤 답을 돌려줄까?</td><td>이 데이터를 어떤 기준으로 읽고 분류할 것인가</td></tr><tr><td>예시</td><td>FAQ 응대, 예약, 신청 상태 조회</td><td>문의유형 분류, 반복 이슈 요약, 보고서 초안</td></tr></table><div class="callout dark">정리하면, <b>챗봇은 사용자 접점이고 LLM은 자연어 처리 모델</b>입니다. 따라서 챗봇을 만들지 않아도 LLM을 활용한 분류, 요약, 보고서 작성은 가능합니다.</div></div>`},
{note:'멘티 B 사례. 방향은 맞는데 너무 크다. 최종 제안서와 첫 스킬을 분리하는 코칭이 필요하다.',html:`<div class="paper"><div class="caseTag orange">사례 2 · 멘티 B · 문제가 너무 넓은 경우</div><div class="h2">최종 산출물부터 잡으면<br>첫 실행 단위가 불명확해집니다</div><div class="twoflow" style="margin-top:26px"><div class="card orangebg"><div class="label orange">처음 접근</div><div class="ctitle">교육 데이터와 외부 트렌드로 신규 교육 제안서 만들기</div><div class="cbody">수집, 분류, 트렌드 조사, 매칭, 제안서 작성이 모두 포함되면서 처리 시작점과 검증 기준이 불명확해졌습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">멘토가 줄인 범위</div><div class="ctitle">외부 교육 신청 데이터를 주제별로 분류하기</div><div class="cbody">최종 산출물은 제안서여도 첫 실행은 제안서가 아닙니다. 먼저 주제 분류가 되어야 이후 매칭과 제안이 가능합니다.</div></div></div><div class="callout orange">이 사례는 방향의 문제가 아니라 범위의 문제입니다. 전체 흐름을 유지하되 첫 실행 단위를 분리해야 합니다.</div></div>`},
{note:'멘티 B 사례를 5단계에서 첫 스킬로 줄이는 장표. 이 구조는 다른 멘티에게도 적용할 수 있다.',html:`<div class="paper"><div class="caseTag orange">사례 2 · 범위 조정 방식</div><div class="h2">전체 흐름보다<br>첫 실행 단위를 먼저 정합니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">너무 넓은 흐름</div><div class="ctitle">데이터 수집 → 분류 → 트렌드 조사 → 매칭 → 제안서</div><div class="cbody">각 단계의 성격이 달라 한 번에 자동화하면 기준이 계속 바뀝니다.</div></div><div class="card bluebg"><div class="label blue">이번 주 실행 단위</div><div class="ctitle"><span class="mono">주제별 분류</span></div><div class="cbody"><b>입력</b> 교육 신청 엑셀, 직군 매핑표<br><b>출력</b> 직군별 주제 랭킹<br><b>조건</b> 분류 기준 5개 이내</div></div></div><div class="callout blue">핵심 질문은 하나입니다. 이번 주에 검증할 첫 실행 단위는 무엇인지 정리합니다.</div></div>`},
{note:'멘티 C 사례. 실행 가능 사례의 기준을 해석해야 한다. 단순히 잘했다고 하지 않고, 왜 실행 가능한지 짚는다.',html:`<div class="paper"><div class="caseTag green">사례 3 · 멘티 C · 실행 가능 사례</div><div class="h2">실행 가능 사례는<br>입력, 출력, 조건, 규모가 명확합니다</div><div class="grid4" style="margin-top:28px"><div class="card greenbg"><div class="label green">INPUT</div><div class="ctitle">무엇을 넣는지</div><div class="cbody">처리에 사용할 자료가 명확합니다. 파일, 표, 텍스트처럼 시작점이 보입니다.</div></div><div class="card greenbg"><div class="label green">OUTPUT</div><div class="ctitle">무엇을 뽑는지</div><div class="cbody">보고서, 표, 초안, 체크리스트처럼 결과 형태가 보입니다.</div></div><div class="card greenbg"><div class="label green">CONDITION</div><div class="ctitle">어떤 기준인지</div><div class="cbody">분류 기준이나 판단 조건을 사람이 설명할 수 있습니다.</div></div><div class="card greenbg"><div class="label green">SCALE</div><div class="ctitle">얼마나 돌릴지</div><div class="cbody">샘플 개수나 파일럿 범위를 정할 수 있습니다.</div></div></div><div class="callout green">이 네 항목이 정리되면 문제정의 논의를 줄이고 파일럿 설계로 이동할 수 있습니다.</div></div>`},
{note:'멘티 C 사례를 교과서 사례로 설명. 실행 가능 사례는 칭찬보다 검증 계획이 중요하다.',html:`<div class="paper"><div class="caseTag green">사례 3 · 멘토 피드백 방향</div><div class="h2">실행 가능 사례에는 더 큰 기획보다<br>검증 기준을 붙여줘야 합니다</div><table class="table" style="margin-top:24px"><tr><th>볼 것</th><th>멘토 판단</th><th>다음 제출 가이드</th></tr><tr><td>문제정의</td><td>이미 업무 장면과 반복성이 보임</td><td>문제정의 문장은 짧게 고정</td></tr><tr><td>업무 구조</td><td>입력과 출력이 연결됨</td><td>중간 처리 기준만 표로 정리</td></tr><tr><td>처리 활용</td><td>초안 생성이나 분류에 적용 가능</td><td>샘플 10건으로 1차 실행</td></tr><tr><td>검증</td><td>이제 성공 기준이 필요함</td><td>정확도, 수정 횟수, 시간 단축 중 1개를 대표 지표로 선택</td></tr></table><div class="callout dark">실행 가능 사례에 필요한 피드백은 확장 제안이 아니라 성공 기준의 명확화입니다.</div></div>`},
{note:'멘티 D 사례. 구현 제약. 문제정의가 맞아도 포맷에서 막힐 수 있다는 점을 강하게 전달한다.',html:`<div class="paper"><div class="caseTag purple">사례 +1 · 멘티 D · 구현과 배포에서 막히는 경우</div><div class="h2">문제정의가 적절해도<br>파일 포맷이 실행을 제한할 수 있습니다</div><div class="grid2" style="margin-top:24px"><div class="card purplebg"><div class="label purple">겉으로 보이는 문제</div><div class="ctitle">HWPX 문서를 자동 처리하고 싶다</div><div class="cbody">업무 문제와 반복성은 명확합니다. 다만 문서 처리 방식이 별도 검토 대상입니다.</div></div><div class="card redbg"><div class="label red">실제 제약</div><div class="ctitle">원문 입력보다 추출·변환 절차가 필요한 포맷</div><div class="cbody">HWPX는 ZIP 기반 XML 구조라 텍스트 추출 자체는 HWP보다 유리한 편입니다. 다만 LLM에 파일을 그대로 던져서 서식까지 보존한 결과물을 만들기는 어렵기 때문에, 추출·검토·재반영 단계를 나눠야 합니다.</div></div></div><div class="callout purple">이 사례는 문제정의 이후 구현 가능성 검토가 필요한 유형입니다. 포맷 처리 방식이 불명확하면 파일럿 범위를 조정해야 합니다.</div></div>`},
{note:'멘티 D 사례 해결 방향. HWPX 원본 자동화가 아니라 추출 가능한 단위로 분리하는 게 먼저라고 말한다.',html:`<div class="paper"><div class="caseTag purple">사례 +1 · 현실적인 우회 방식</div><div class="h2">HWPX는 전체 자동화보다<br>처리 단위 분리가 먼저입니다</div><div style="margin-top:24px"><div class="step"><div class="num purple">1</div><div><strong>원본 문서에서 텍스트와 표 구조를 먼저 추출</strong><span>문서 전체를 원문 그대로 입력하기보다 압축 해제 또는 변환을 통해 제목, 본문, 표, 서식 요소를 나눠 확인합니다.</span></div></div><div class="step"><div class="num purple">2</div><div><strong>처리 범위를 초안 작성이나 검토로 제한</strong><span>최종 HWPX 재생성이 아니라 문장 초안, 누락 체크, 요약처럼 안전한 범위부터 시작합니다.</span></div></div><div class="step"><div class="num purple">3</div><div><strong>최종 문서 반영은 사람이 하거나 별도 변환 도구를 둠</strong><span>서식 보존과 기관 제출용 문서는 변환 도구 또는 한글 편집기를 거친 뒤 사람이 마지막 검토 지점을 잡아야 합니다.</span></div></div></div><div class="callout blue">이 사례의 첫 제출물은 완성 결과물이 아니라 포맷 처리 가능성 체크리스트가 더 맞습니다.</div></div>`},
{note:'잘된/아쉬운 평가 대신 Before/After로 정리한다. 멘토가 어떤 질문으로 판단 기준을 끌어냈는지에 무게를 둔다.',html:`<div class="paper"><div class="kicker">사례 인사이트</div><div class="h2">네 사례를 관통하는<br/>한 가지 패턴</div><div class="sub" style="margin-top:14px">잘됐다·아쉬웠다의 평가가 아니라, AI에게 무엇을 맡겼는지의 차이입니다.</div><div class="grid2" style="margin-top:26px"><div class="card redbg"><div class="label red">Before</div><div class="ctitle">AI에게 결과물만 요청</div><div class="cbody">"챗봇 만들어 줘", "제안서 써 줘", "회의록 정리해 줘"처럼 결과물 이름만 던집니다. 판단 기준이 머릿속에만 있어 결과는 그때그때 흔들립니다.</div></div><div class="card greenbg"><div class="label green">After</div><div class="ctitle">멘토가 판단 기준을 질문으로 끌어내고<br/>기준 문서 → Skill 구조로 전환</div><div class="cbody">"무엇을 포함·제외하나요?", "왜 그렇게 판단하나요?", "예외는 어디서 생기나요?"<br/>이 질문에서 나온 답을 기준 문서로 정리하고, 같은 기준을 다음 실행에 다시 쓸 수 있도록 Skill 구조로 옮깁니다.</div></div></div><div class="callout dark" style="margin-top:22px;text-align:center">좋은 Skill은 긴 프롬프트가 아니라, <b>판단 기준을 짧고 명확한 규칙으로 바꾸는 것</b>입니다.</div></div>`},
{note:'문제정의를 초반에 잘 잡으려면 어떤 순서로 점검해야 하는지 알려주는 의사결정 트리. 멘토가 멘티 사례에 적용한 점검 순서 그대로다.',html:`<div class="paper"><div class="kicker">초반에 문제정의를 잘 잡는 법</div><div class="h2">이 4가지를 순서대로 점검하면<br>문제정의 오류는 거의 잡힙니다</div><div style="margin-top:24px"><div class="step"><div class="num">1</div><div><strong>결과물 이름부터 적었는가? — 그렇다면 의심</strong><span>'챗봇', '대시보드', '제안서'처럼 결과물 이름이 먼저 나온다면, 데이터·반복 패턴부터 다시 검토합니다. (멘티 A 패턴)</span></div></div><div class="step"><div class="num">2</div><div><strong>처리 단계가 4개 이상인가? — 그렇다면 첫 스킬 1개만 남김</strong><span>최종 산출물부터 정의하면 첫 실행이 안 보입니다. 5단계를 그리되 이번 주에 검증할 단계 1개만 분리합니다. (멘티 B 패턴)</span></div></div><div class="step"><div class="num">3</div><div><strong>입력·출력·조건·규모가 한 문장씩 나오는가? — 그렇다면 잘된 사례</strong><span>네 항목이 모두 명확하면 문제정의 단계는 끝. 검증 기준(정확도·시간 단축·수정 횟수 중 1개)으로 넘어갑니다. (멘티 C 패턴)</span></div></div><div class="step"><div class="num">4</div><div><strong>파일 포맷·배포 조건이 표준이 아닌가? — 그렇다면 추출 가능성부터 테스트</strong><span>HWPX·이미지 PDF·내부 시스템 export처럼 표준이 아닌 포맷이 끼어 있으면, 자동화 범위 자체를 좁혀야 합니다. (멘티 D 패턴)</span></div></div></div><div class="callout orange"><b>문제정의 → 범위 → 검증 → 구현</b> 순서로 점검합니다. 앞 단계가 흔들리면 뒤 단계는 자동으로 무너집니다.</div></div>`},
{note:'워크숍 안내. 수강생들이 자기 사례를 점검하게 만든다.',html:`<div class="paper"><div class="kicker">실습 정리</div><div class="h2">내 과제를 3문장으로 재정의합니다</div><div class="grid3" style="margin-top:26px"><div class="card orangebg"><div class="label orange">문장 1</div><div class="ctitle">문제정의</div><div class="cbody">누가, 언제, 어떤 반복 상황에서 어려움을 겪는지 정리합니다.</div></div><div class="card bluebg"><div class="label blue">문장 2</div><div class="ctitle">첫 스킬</div><div class="cbody">가장 먼저 처리할 입력과 출력은 무엇인지 정리합니다.</div></div><div class="card greenbg"><div class="label green">문장 3</div><div class="ctitle">다음 제출물</div><div class="cbody">이번 주 안에 문서, 표, 실행 로그 중 무엇을 가져올지 정리합니다.</div></div></div><div class="callout dark">세 문장이 정리되지 않으면 구현보다 문제 범위 조정이 우선입니다.</div></div>`},
{note:'실습용 프롬프트. 슬라이드에서 수업 중 활용할 수 있게 한다.',html:`<div class="paper"><div class="kicker">점검 프롬프트</div><div class="h2">과제 점검용 프롬프트</div><div class="mono" style="margin-top:24px;white-space:pre-wrap">아래 과제를 보고 현재 병목 유형을 분류해 주세요.\n\n유형은 4개로 나눠 주세요.\n1. 결과물 이름에 끌려 문제정의가 틀어진 경우\n2. 문제 범위가 너무 넓어 첫 스킬이 안 보이는 경우\n3. 입력, 출력, 조건, 규모가 보여 파일럿 가능한 경우\n4. 파일 포맷 처리나 배포 조건 때문에 구현 가능성 점검이 필요한 경우\n\n그 다음 아래 3가지를 제안해 주세요.\n- 다시 써야 할 문제정의 문장 1개\n- 이번 주에 만들 첫 스킬 이름 1개\n- 다음 제출물 3개 이내\n\n[내 과제]\n여기에 본인 과제 입력</div><div class="callout blue">이 프롬프트의 목적은 과제를 실행 가능한 첫 단위로 축소하는 것입니다.</div></div>`},
{note:'마무리. 핵심 한 줄로 끝낸다.',html:`<div class="paper"><div class="kicker">핵심 정리</div><div class="bigquote">업무 자동화 과제는<br>큰 문제를 한 번에 해결하기보다<br><span class="hl">첫 실행 단위</span>를 정확히 정하는 데서 시작합니다.</div><div class="pillrow" style="justify-content:center;margin-top:34px"><span class="pill orange">문제정의</span><span class="pill blue">첫 스킬</span><span class="pill green">파일럿</span><span class="pill purple">구현 가능성</span></div></div>`},
{note:'오후 시작. 암묘지 형식화란 무엇인지, 왜 필요한지, 그리고 멘토 사례를 통해 어떻게 형식화하는지를 다루는 시간임을 안내한다.',html:`<div class="paper"><div class="kicker">Tacit Knowledge · Skill Development</div><div class="h1">판단 기준을 문서로 꺼내고<br>스킬로 옮기기<br><span class="hl">암묘지 형식화 + 스킬 개발</span></div><div class="sub">담당자 머릿속에만 있던 판단 기준을 어떻게 문서화하고, 그 기준을 반복 실행 가능한 스킬로 전환했는지를 멘토 사례로 다룹니다.</div><div class="pillrow"><span class="pill orange">유형 A 사례</span><span class="pill orange">유형 B 사례</span><span class="pill green">유형 C 사례</span><span class="pill blue">멘토 질문</span><span class="pill dark">형식화 프로세스</span></div></div>`},
{note:'암묘지의 정의와 업무 장면에서의 예시를 보여준다.',html:`<div class="paper"><div class="kicker">개념 정의</div><div class="h2">암묘지란<br>머릿속의 판단 기준입니다</div><div class="grid2" style="margin-top:26px"><div class="card bluebg"><div class="label blue">형식지</div><div class="ctitle">문서·규칙·매뉴얼</div><div class="cbody">이미 글로 쓰여 있거나 누군가에게 가르칠 수 있는 지식입니다. 절차서, 기준표, FAQ처럼 누가 봐도 같은 판단을 내릴 수 있습니다.</div></div><div class="card orangebg"><div class="label orange">암묘지</div><div class="ctitle">머릿속의 판단 경험</div><div class="cbody">한 사람이 경험으로 쌓은 판단 감각이지만, 아직 문서화되지 않았습니다. <b>"뭔가 이상한데…"</b>라는 직관이 실제로는 복잡한 규칙의 조합입니다.</div></div></div><div class="grid3" style="margin-top:20px"><div class="card graybg"><div class="ctitle" style="font-size:14px">질문 분류 담당자</div><div class="cbody">50건을 봐온 경험으로 "이건 Category A, 저건 B"라고 판단하지만, 왜인지 명확히 설명하지 못함</div></div><div class="card graybg"><div class="ctitle" style="font-size:14px">콘텐츠 검수자</div><div class="cbody">좋은 문장과 어색한 문장을 구분하는 감각이 있지만, 기준을 다른 사람에게 전수하기 어려움</div></div><div class="card graybg"><div class="ctitle" style="font-size:14px">마케팅 담당자</div><div class="cbody">타겟 고객이 누인지는 알지만, 구체적인 기준표를 만들지 못함</div></div></div><div class="callout dark">AI는 형식지로만 일합니다. 암묘지를 형식화해야 AI가 반복 실행할 수 있습니다.</div></div>`},
{note:'형식화가 필요한 이유. AI 관점과 업무 효율 관점 모두에서 설명한다.',html:`<div class="paper"><div class="kicker">형식화 필요성</div><div class="h2">암묘지를 형식화해야 하는 이유</div><div class="grid2" style="margin-top:24px"><div class="card redbg"><div class="label red">형식화 없이</div><div class="ctitle">매번 사람이 직접 지시</div><div class="cbody"><b>문제</b> "이건 어떻게 처리해?" 같은 질문이 반복되고, 답도 그때그때 다릅니다. <b>비용</b> 담당자 시간 + 일관성 문제</div></div><div class="card greenbg"><div class="label green">형식화 후</div><div class="ctitle">규칙을 한 번 정하고 반복 실행</div><div class="cbody"><b>효과</b> 같은 데이터는 항상 같은 기준으로 처리. 예외가 생기면 규칙을 개선합니다. <b>비용</b> 초기 형식화 + 정기적 검증만</div></div></div><div class="twoflow" style="margin-top:20px"><div class="card orangebg"><div class="label orange">AI 입장에서</div><div class="cbody">규칙이 명확하지 않으면 "~일까요?"라는 식으로 매번 묻게 됩니다. 기준이 문서화되면 같은 기준을 100번 실행할 수 있습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">당신 입장에서</div><div class="cbody">규칙을 한 번 만들면 담당자 시간이 줄고, 처리 품질이 일관됩니다. 예외는 규칙 개선으로 처리합니다.</div></div></div><div class="callout purple">형식화는 자동화의 필수 단계입니다. 규칙이 명확하지 않으면 AI도 사람처럼 매번 물어봅니다.</div></div>`},
{note:'시각적 비교. 형식화 없을 때의 문제점과 형식화 후의 개선 모습을 보여준다.',html:`<div class="paper"><div class="kicker">프로세스 비교</div><div class="h2">형식화 전후 비교<br>같은 데이터, 다른 결과</div><div class="twoflow" style="margin-top:28px"><div class="card redbg"><div class="label red">❌ 형식화 없음</div><div style="margin-top:14px"><div class="step" style="margin-bottom:8px"><div class="num red">1</div><div><strong>데이터 입력</strong></div></div><div class="step" style="margin-bottom:8px"><div class="num red">2</div><div><strong>AI 실행</strong><br><span style="font-size:13px">규칙이 명확하지 않아 "어떻게 처리할까요?"라고 매번 물음</span></div></div><div class="step" style="margin-bottom:8px"><div class="num red">3</div><div><strong>사람 판단</strong><br><span style="font-size:13px">정해진 기준이 없어 그때그때 지시</span></div></div><div class="step"><div class="num red">4</div><div><strong>검증 불가</strong><br><span style="font-size:13px">왜 그렇게 처리했는지 설명 불가능</span></div></div></div></div><div class="arrow" style="font-size:28px">→</div><div class="card greenbg"><div class="label green">✓ 형식화 완료</div><div style="margin-top:14px"><div class="step" style="margin-bottom:8px"><div class="num green">1</div><div><strong>규칙 문서화</strong></div></div><div class="step" style="margin-bottom:8px"><div class="num green">2</div><div><strong>AI 자동 실행</strong><br><span style="font-size:13px">같은 기준을 100번 반복 실행</span></div></div><div class="step" style="margin-bottom:8px"><div class="num green">3</div><div><strong>오류 분석</strong><br><span style="font-size:13px">왜 틀렸는지, 규칙의 어느 부분 때문인지 파악</span></div></div><div class="step"><div class="num green">4</div><div><strong>규칙 개선</strong><br><span style="font-size:13px">오류 분석으로 다음 버전 규칙 업데이트</span></div></div></div></div></div><div class="callout dark">형식화는 일을 추가하는 게 아닙니다. 반복 업무를 자동화 가능한 형태로 바꾸는 일입니다.</div></div>`},
{note:'유형 A 사례 소개. 완전히 형식화되지 않은 경우다.',html:`<div class="paper"><div class="caseTag red">유형 A · 암묘지 형식화 전</div><div class="h2">규칙이 전혀 문서화되지 않은 경우</div><div class="grid2" style="margin-top:26px"><div class="card redbg"><div class="label red">실제 상황</div><div class="ctitle">고객 이메일을 우선순위별로 분류</div><div class="cbody">해당 담당자가 100건을 봐왔으니 "이건 High, 저건 Low"라는 판단은 빠릅니다. 다만 기준을 누군가에게 설명하지 못합니다.</div></div><div class="card orangebg"><div class="label orange">형식화 현황</div><div class="ctitle">포함·제외·예시 전부 머릿속에만</div><div class="cbody">기준표도 없고, 우수 사례와 예외 사례도 문서로 남지 않았습니다. 그래서 AI도 매번 물어봅니다.</div></div></div><div class="callout red">이 유형은 형식화 작업 자체를 시작하지 않은 상태입니다. 판단 기준을 말로 끌어내고 문서로 정리하는 게 첫 번째 과제입니다.</div></div>`},
{note:'유형 B 사례. 부분적으로만 형식화된 경우다. 포함·제외는 있지만 예시가 부족하다.',html:`<div class="paper"><div class="caseTag orange">유형 B · 암묘지 부분 형식화</div><div class="h2">기준은 있지만 예시가 부족한 경우</div><div class="grid2" style="margin-top:26px"><div class="card orangebg"><div class="label orange">실제 상황</div><div class="ctitle">결재 문서에서 결함을 찾기</div><div class="cbody">담당자가 "이런 건 결함이다"는 포함 기준과 제외 기준은 만들었습니다. 다만 이건 틀리면 다음에 어떻게 고칠지를 모릅니다.</div></div><div class="card bluebg"><div class="label blue">형식화 현황</div><div class="ctitle">포함·제외만 있고 예시가 부족</div><div class="cbody">기준은 다음과 같습니다: <b>포함</b> 필수 항목 누락, 금액 오류, 승인자 대체 / <b>제외</b> 표준 서식, 정상 범위의 수정. 하지만 "경계 사례"는 어떻게 처리해야 하는지는 불명확합니다.</div></div></div><div class="callout orange">이 유형은 형식화가 되었지만 가장 복잡한 경계 사례까지는 다루지 못했습니다. 오류가 날 때마다 예외를 추가하는 방식으로 개선합니다.</div></div>`},
{note:'유형 C 사례. 완전히 형식화된 경우다. 포함·제외·우수예시·보완예시가 모두 있다.',html:`<div class="paper"><div class="caseTag green">유형 C · 암묘지 완전 형식화</div><div class="h2">포함·제외·우수예시·보완예시가 모두 갖춰진 경우</div><div class="grid2" style="margin-top:26px"><div class="card greenbg"><div class="label green">실제 상황</div><div class="ctitle">기술 문서에서 콘텐츠를 초안으로 변환</div><div class="cbody">담당자가 어떤 내용을 포함하고 어떤 내용을 빼야 하는지, 그리고 좋은 예와 보완할 예까지 모두 정리했습니다.</div></div><div class="card greenbg"><div class="label green">형식화 현황</div><div class="ctitle">4 elements가 완성된 상태</div><div class="cbody"><b>포함</b> 기술 스펙과 사용법 / <b>제외</b> 마케팅 카피와 이론 배경 / <b>우수예시</b> O 초안 3개 / <b>보완예시</b> X 초안 + 개선안 3개. AI가 반복 실행 가능합니다.</div></div></div><div class="callout green">이 유형이 이상적입니다. 형식화 후에는 AI가 일관되게 같은 기준을 적용하고, 오류 분석으로만 규칙을 개선합니다.</div></div>`},
{note:'Before/After 멘토 질문 흐름 1. 유형 A가 유형 C로 변하는 과정.',html:`<div class="paper"><div class="kicker">멘토 코칭 프로세스</div><div class="h2">유형 A → C로 진화하는 질문 흐름</div><div style="margin-top:26px"><div class="step"><div class="num">1</div><div><strong>멘토의 첫 질문: 기준이 보이나요?</strong><span><b>A의 답변</b> "음… 보면 알아요" / <b>멘토의 반응</b> 기준을 글로 쓸 수 없으면 AI도 모릅니다. 지금 판단하실 때 머릿속에서 어떤 과정이 일어나는지 말씀해 주세요.</span></div></div><div class="step"><div class="num">2</div><div><strong>멘토의 두 번째 질문: 포함·제외 기준이 뭔가요?</strong><span><b>A의 답변</b> "이건 포함합니다. 저건 안 합니다" / <b>멘토의 반응</b> 좋습니다. 이제 우수 예시 3개와 경계 사례 3개를 보여주세요.</span></div></div><div class="step"><div class="num">3</div><div><strong>멘토의 세 번째 질문: 경계 사례는 왜 그렇게 판단했나요?</strong><span><b>A의 답변</b> "이 경우는…" / <b>멘토의 반응</b> 그 설명이 바로 형식화된 기준입니다. 우수 예시와 보완 예시를 이 기준으로 정렬하면 AI가 같은 규칙을 반복할 수 있습니다.</span></div></div><div class="step"><div class="num">4</div><div><strong>멘토의 결론: 4가지가 정리되었습니다</strong><span><b>포함기준</b> "고객 이메일 중 긴급 표시나 명확한 요청이 있는 경우" → <b>제외기준</b> "일반 안내나 감사 인사" → <b>우수예시</b> 3개 → <b>보완예시</b> 3개. 이제 이 4가지를 Skill로 만들 준비가 됐습니다.</span></div></div></div><div class="callout blue">형식화의 핵심은 <b>AI가 이해할 수 있는 언어로 기준을 설명</b>하는 것입니다.</div></div>`},
{note:'Before/After 멘토 질문 흐름 2. 유형 B의 오류 분석으로 형식을 개선하는 경우.',html:`<div class="paper"><div class="kicker">형식화 개선 프로세스</div><div class="h2">유형 B → C로 개선하는 오류 분석 흐름</div><div style="margin-top:26px"><div class="step"><div class="num">1</div><div><strong>상황: 유형 B 기준으로 AI 실행해 보니 오류 발생</strong><span>기존 기준 <b>포함</b> "필수 항목 누락, 금액 오류, 승인자 대체" <b>제외</b> "표준 서식, 정상 범위 수정"으로 100건 처리 → 8건 오류</span></div></div><div class="step"><div class="num">2</div><div><strong>멘토의 첫 질문: 8건의 오류가 모두 같은 패턴인가요?</strong><span><b>분석 결과</b> 오류 5건은 "금액 오류인데도 승인자가 확인했으면 정상"인 경우. 오류 3건은 "과거 수정 이력과 다른 방식으로 수정"된 경우.</span></div></div><div class="step"><div class="num">3</div><div><strong>멘토의 두 번째 질문: 그럼 포함 기준을 다시 쓸 수 있나요?</strong><span><b>개선된 기준</b> <b>포함</b> "필수 항목 누락, 금액 오류(단, 승인자 확인 사항 제외), 승인자 대체(다만 히스토리와 일관된 경우만)" → 정확도 97%로 개선</span></div></div><div class="step"><div class="num">4</div><div><strong>멘토의 결론: 이제 우수·보완 예시까지 업데이트하면 유형 C가 됩니다</strong><span>오류 사례들이 바로 "보완 예시"가 됩니다. 왜 틀렸는지, 어떻게 고칠지를 보여주는 사례로 정리합니다.</span></div></div></div><div class="callout green">형식화는 완성이 아니라 <b>오류로 배우는 반복</b>입니다. 오류 분석이 규칙 개선을 만듭니다.</div></div>`},
{note:'세 유형을 비교하는 표. 언제 어떤 유형에서 어떤 일을 해야 하는지 정리한다.',html:`<div class="paper"><div class="kicker">유형 비교</div><div class="h2">A · B · C 유형의 특징과 다음 단계</div><table class="table" style="margin-top:24px"><tr><th>구분</th><th>유형 A<br><span style="font-weight:600;color:#b91c1c">형식화 前</span></th><th>유형 B<br><span style="font-weight:600;color:#b45309">부분 형식화</span></th><th>유형 C<br><span style="font-weight:600;color:#0f766e">완전 형식화</span></th></tr><tr><td>포함 기준</td><td>머릿속에만 있음</td><td>문서화됨</td><td>문서화됨</td></tr><tr><td>제외 기준</td><td>불명확</td><td>문서화됨</td><td>문서화됨</td></tr><tr><td>우수 예시</td><td>없음</td><td>일부만</td><td>3개 이상</td></tr><tr><td>보완 예시</td><td>없음</td><td>없음</td><td>3개 이상 + 개선안</td></tr><tr><td>AI 실행</td><td>매번 물어봄</td><td>틀릴 수 있음</td><td>일관되게 실행</td></tr><tr><td>해야 할 일</td><td>멘토 질문으로 기준 추출</td><td>오류 분석 + 예시 추가</td><td>1차 실행 + 검증</td></tr></table><div class="callout dark">특별히 주목할 점: <b>유형 B는 문제가 아닙니다</b>. 계획대로 유형 C로 개선하면 됩니다.</div></div>`},
{note:'4가지 형식화 구조를 설명한다. 이것이 오후 강의의 핵심이다.',html:`<div class="paper"><div class="kicker">형식화 구조</div><div class="h2">유형 C를 만드는 4가지 필수 요소<br><span style="font-size:20px;color:#8a8a8a;font-weight:700">포함·제외·우수·보완</span></div><div class="grid4" style="margin-top:28px"><div class="card bluebg"><div class="label blue">① 포함기준</div><div class="ctitle">무엇을 YES로 할까</div><div class="cbody">이 조건에 맞으면 처리합니다. 명확한 신호나 패턴으로 표현합니다.</div></div><div class="card orangebg"><div class="label orange">② 제외기준</div><div class="ctitle">무엇을 NO로 할까</div><div class="cbody">이 조건에 맞으면 건너뜁니다. 포함과는 명백히 다른 특징으로 구분합니다.</div></div><div class="card greenbg"><div class="label green">③ 우수예시</div><div class="ctitle">좋은 사례는 이렇습니다</div><div class="cbody"><b>O</b> 표시가 맞는 3개 사례. AI가 정확하게 했을 때의 결과물입니다.</div></div><div class="card purplebg"><div class="label purple">④ 보완예시</div><div class="ctitle">이렇게 틀렸는데 이렇게 고칩니다</div><div class="cbody"><b>X</b> 표시된 오류 사례 + 개선안 3개. 왜 틀렸는지, 어떻게 고칠지를 보여줍니다.</div></div></div><div class="callout dark">이 4가지를 모두 갖추면 AI가 같은 기준을 반복 실행할 수 있습니다. 이것이 형식화의 목표입니다.</div></div>`},
{note:'실습 안내. 수강생들이 자신의 암묘지를 정리하는 워크시트.',html:`<div class="paper"><div class="kicker">실습</div><div class="h2">내 업무의 암묘지를 형식화합니다</div><div class="sub" style="margin-top:14px">아침에 배운 문제정의를 바탕으로, 이번엔 그 문제를 푸는 판단 기준을 정리합니다.</div><div class="grid2" style="margin-top:26px"><div class="card orangebg"><div class="label orange">Step 1</div><div class="ctitle">포함 기준</div><div class="cbody">내가 처리하는 데이터는 어떤 조건일 때 YES입니까? 명확한 신호 1-2개로 표현하세요.</div></div><div class="card orangebg"><div class="label orange">Step 2</div><div class="ctitle">제외 기준</div><div class="cbody">어떤 조건일 때는 절대 처리하지 않습니까? 포함과는 명백히 다른 특징을 적으세요.</div></div><div class="card greenbg"><div class="label green">Step 3</div><div class="ctitle">우수 예시 3개</div><div class="cbody">포함 기준을 정확하게 따른 결과물 예시 3개를 모으세요. 실제 결과물이 가장 좋습니다.</div></div><div class="card purplebg"><div class="label purple">Step 4</div><div class="ctitle">보완 예시 3개</div><div class="cbody">과거에 틀렸던 사례를 찾거나, 앞으로 예상되는 경계 사례를 정리하세요. 각각 왜 틀렸는지, 어떻게 고칠지도 함께.</div></div></div><div class="callout blue">네 항목이 모두 정리되면 이를 Skill로 변환할 준비가 됐습니다.</div></div>`},
{note:'AI에게 암묘지를 전달할 때 지켜야 할 보안 원칙들을 안내한다.',html:`<div class="paper"><div class="kicker">보안 체크</div><div class="h2">암묘지를 AI에게 넘길 때 지켜야 할 것들</div><div style="margin-top:26px"><div class="step"><div class="num orange">1</div><div><strong>민감 정보 마스킹</strong><span>포함·제외·예시 안의 고객명, 금액, 회사명, 이메일은 마스킹해 제출합니다. <span class="mono">[고객명]</span>, <span class="mono">[금액]</span>, <span class="mono">[이메일]</span> 같은 형태로.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>샘플 범위 제한</strong><span>예시를 만들 때 실제 데이터 전체가 아니라 대표성 있는 샘플만 사용합니다. 보통 상품 10건, 고객 20건 정도면 충분합니다.</span></div></div><div class="step"><div class="num orange">3</div><div><strong>로컬 저장소에서만 작업</strong><span>Claude에 제출하기 전에, 먼저 로컬 파일이나 내부 문서 관리 시스템에서 포함·제외·예시를 정리해 검토합니다.</span></div></div><div class="step"><div class="num orange">4</div><div><strong>제출 전 최종 검토</strong><span>포함·제외·우수예시·보완예시를 다시 한 번 읽고, 민감 정보가 남아 있지는 않은지 확인한 후 Claude에 제출합니다.</span></div></div><div class="step"><div class="num orange">5</div><div><strong>실행 후 결과 검증</strong><span>AI 결과물이 나오면, 실제 조건과 맞는지 먼저 샘플로 검증합니다. 오류 패턴이 보이면 기준을 개선합니다.</span></div></div></div><div class="callout purple">암묘지 형식화는 효율이지만, 정보 보안도 동시에 고려해야 합니다.</div></div>`},
{note:'Claude에 암묘지를 제출하는 프롬프트 템플릿을 제시한다.',html:`<div class="paper"><div class="kicker">프롬프트 템플릿</div><div class="h2">Claude에 암묘지를 전달하는 프롬프트</div><div class="mono" style="margin-top:24px;white-space:pre-wrap">아래 업무에 대해 Skill을 구축해 주세요.

【문제정의】
[아침에 정리한 문제정의 1문장]

【포함기준】
[내가 처리하는 데이터는 어떤 조건일 때 YES입니까?]

【제외기준】
[어떤 조건일 때는 절대 처리하지 않습니까?]

【우수예시】
예시1: [입력] … → [출력] …
예시2: [입력] … → [출력] …
예시3: [입력] … → [출력] …

【보완예시】
예시1: [입력] … → [현재 결과] … ✗
보완: [어떻게 고칠까]

예시2: [입력] … → [현재 결과] … ✗
보완: [어떻게 고칠까]

예시3: [입력] … → [현재 결과] … ✗
보완: [어떻게 고칠까]

요청: 위 기준으로 [입력 형태] 데이터를 [처리 방식]으로 처리하는 Skill을 작성해 주세요.</div><div class="callout blue">이 구조로 제출하면 Claude가 일관된 기준으로 반복 실행할 수 있는 Skill을 만들 수 있습니다.</div></div>`},
{note:'아침과 오후를 연결하는 최종 정리.',html:`<div class="paper"><div class="kicker">핵심 정리</div><div class="h2">문제정의에서 스킬까지<br/>한 번에 이어지는 흐름</div><div class="grid2" style="margin-top:26px"><div class="card bluebg"><div class="label blue">아침 · 문제정의</div><div class="ctitle">입력, 출력, 조건, 규모</div><div class="cbody">AI에게 맡길 일이 무엇인지, 범위가 얼마나 되는지 명확히 합니다. 이것이 Skill의 <b>목표</b>입니다.</div></div><div class="card greenbg"><div class="label green">오후 · 암묘지 형식화</div><div class="ctitle">포함, 제외, 우수, 보완</div><div class="cbody">AI가 그 일을 어떻게 판단해야 하는지 기준을 명확히 합니다. 이것이 Skill의 <b>규칙</b>입니다.</div></div></div><div class="callout dark" style="margin-top:22px">처음부터 완벽할 필요는 없습니다. <br/>오류를 분석하고 기준을 수정하는 반복이 형식화된 암묘지를 만듭니다.<br/><b style="font-size:17px">유형 A → B → C로의 진화는 자연스럽습니다.</b></div></div>`}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
