<script>
const SLIDES=[
{note:'오프닝. 멘티 3명의 사례를 통해 잘된 사례·아쉬운 사례를 비교하고, 멘토 피드백 방식과 문제정의를 초반에 잘 잡는 법을 다루는 시간임을 안내한다.',html:`<div class="paper"><div class="kicker">Problem Definition · Mentor Feedback</div><div class="h1">잘된 사례 vs 아쉬운 사례<br>멘티 3명 사례로 보는<br><span class="hl">문제정의 코칭</span></div><div class="sub">멘티 3명 사례를 <b>Type A·B·C 3유형</b>으로 분류하고,<br>멘토가 어떻게 피드백했는지,<br>초반에 문제정의를 정확히 잡으려면 어디부터 점검해야 하는지를 다룹니다.</div><div class="pillrow"><span class="pill orange">아쉬운 사례 · 멘티 A</span><span class="pill orange">아쉬운 사례 · 멘티 B</span><span class="pill green">잘된 사례 · 멘티 C</span><span class="pill blue">멘토 피드백</span><span class="pill dark">익명화</span></div></div>`},
{note:'강의 목적 안내. 사례를 외우는 것이 아니라 멘토의 피드백 방식과 문제정의 점검 기준을 본인 과제에 적용하는 것이 목표다.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">세 사례를 검토하는 순서</div><div style="margin-top:26px"><div class="step"><div class="num red">1</div><div><strong>아쉬운 사례 A — 결과물 이름이 문제정의를 왜곡한 사례</strong><span>ChatBot이라는 결과물 이름이 설계 방향까지 흐트러뜨린 경우입니다. 멘토가 어떻게 방향을 돌렸는지, <b>진짜 문제가 무엇인지를 먼저 찾는 것이 왜 중요한지</b>를 봅니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>아쉬운 사례 B — 범위가 너무 넓어 첫 실행 단위가 보이지 않는 사례</strong><span>5단계를 한 번에 자동화하려다 첫 스킬을 정하지 못한 경우입니다. 멘토가 어떻게 실행 가능한 첫 단위로 좁혔는지 봅니다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>잘된 사례 C — 입력·출력·조건·규모가 모두 명확한 사례</strong><span>왜 잘된 사례인지, 좋은 문제정의에도 반드시 더해야 할 피드백이 무엇인지 봅니다.</span></div></div></div><div class="callout dark">목표는 사례를 외우는 것이 아닙니다. <b>멘토의 피드백 기준과 문제정의 점검 방식</b>을 내 과제에 옮기는 것입니다.</div></div>`},
{note:'문제정의 3유형 분류. tacit-skill의 Type A/B/C와 동일한 패턴.',html:`<div class="paper"><div class="kicker">문제정의 유형</div><div class="h2">반복되는 문제정의 오류는 <span class="hl">3가지 유형</span>으로 나뉩니다</div><div class="grid3" style="margin-top:24px"><div class="card redbg"><div class="label red">Type A · 아쉬운 사례</div><div class="ctitle">결과물 이름 왜곡</div><div class="cbody">ChatBot·대시보드·제안서 같은 <b>결과물 이름이 먼저</b> 나오면, 진짜 풀어야 할 문제가 가려집니다. 데이터·반복 패턴부터 다시 봐야 합니다.</div></div><div class="card orangebg"><div class="label orange">Type B · 아쉬운 사례</div><div class="ctitle">범위 과잉</div><div class="cbody">5단계를 한꺼번에 자동화하려다 <b>첫 실행 단위가 보이지 않는</b> 경우. 전체 흐름은 유지하되, 이번 주에 검증할 단계 1개만 분리해야 합니다.</div></div><div class="card greenbg"><div class="label green">⭐ Type C · 잘된 사례</div><div class="ctitle">실행 가능</div><div class="cbody"><b>입력·출력·조건·규모</b>가 한 문장씩 명확합니다. 문제정의 단계는 끝났고, 검증 기준 설정으로 넘어가면 됩니다.</div></div></div><div class="callout dark" style="margin-top:18px">이번 강의의 멘티 3명 사례는 각각 <b>Type A → Type B → Type C</b>입니다.</div></div>`},
{note:'3유형 비교 표.',html:`<div class="paper"><div class="kicker">유형 비교</div><div class="h2">세 유형의 차이와 다음 단계</div><table class="table" style="margin-top:22px"><tr><th>구분</th><th><span style="color:var(--red)">Type A</span><br>결과물 이름 왜곡</th><th><span style="color:var(--orange)">Type B</span><br>범위 과잉</th><th><span style="color:var(--green)">⭐ Type C</span><br>실행 가능</th></tr><tr><td>대표 멘티</td><td>멘티 A</td><td>멘티 B</td><td>멘티 C</td></tr><tr><td>막힌 지점</td><td>결과물 이름이 문제정의를 끌고 감</td><td>첫 실행 단위가 안 보임</td><td>구조는 갖춰졌고 검증 기준 부재</td></tr><tr><td>멘토 처방</td><td>ChatBot → LLM 분석으로 전환</td><td>5단계 중 1개만 선택</td><td>파일럿 성공 기준 1개 설정</td></tr><tr><td>다음 제출물</td><td>분류 기준표 + 패턴 리포트</td><td>주제별 분류표 + 샘플 로그</td><td>실행 결과 + 성공 지표</td></tr></table><div class="callout blue" style="margin-top:18px">Type A·B는 결함이 아닙니다. <b>처방대로 보강하면 자연스럽게 Type C</b>로 이동합니다.</div></div>`},
{note:'멘티 A 사례. 결과물 이름이 왜 문제인지, 진짜 문제가 무엇인지를 먼저 찾아야 한다는 점을 강조한다.',html:`<div class="paper"><div class="caseTag red">아쉬운 사례 1 · 멘티 A</div><div class="h2">결과물 이름이 정해지면<br><span style="color:var(--red)">진짜 문제가 가려집니다</span></div><div class="twoflow" style="margin-top:24px"><div class="card redbg"><div class="label red">처음 접근</div><div class="ctitle">헬프데스크 문의에 답하는 ChatBot</div><div class="cbody">ChatBot을 먼저 그리면 FAQ 설계, 실시간 응대, 답변 정책이 우선 과제가 됩니다. 그러나 이 시점에 실제로 필요한 것은 <b>누적 문의 데이터에 어떤 반복 패턴이 있는지</b>를 확인하는 일이었습니다.</div></div><div class="arrow">→</div><div class="card bluebg"><div class="label blue">진짜 문제</div><div class="ctitle">누적 문의 데이터의 반복 패턴 분석</div><div class="cbody">반복 문의 유형과 빈도를 먼저 파악해야 답변 기준도 설계할 수 있습니다. 1차 산출물은 자동 답변이 아니라 <b>문의 유형 분석표</b>입니다.</div></div></div><div class="callout orange" style="margin-top:18px">결과물 이름(ChatBot, 대시보드, 제안서)이 먼저 나왔다면 — 한 발 물러서서 <b>데이터가 무엇이고 반복 패턴이 있는가</b>부터 다시 확인해야 합니다.</div></div>`},
{note:'멘티 A 사례의 핵심 구분. ChatBot과 LLM 분석의 차이. 4페이지에서 5페이지로 자연스럽게 연결된다.',html:`<div class="paper"><div class="caseTag red">아쉬운 사례 1 · 설계 구분</div><div class="h2">ChatBot과 LLM 분석은<br>출발 질문이 다릅니다</div><table class="table" style="margin-top:24px"><tr><th>구분</th><th>ChatBot으로 접근하면</th><th>LLM 분석으로 접근하면</th></tr><tr><td>핵심 질문</td><td>사용자 질문에 무엇을 답할 것인가</td><td>누적 데이터에 어떤 패턴이 있는가</td></tr><tr><td>필요한 것</td><td>FAQ, 답변 정책, 예외 응대 기준</td><td>분류 기준, 빈도 기준, 처리 시간 기준</td></tr><tr><td>첫 산출물</td><td>답변 시나리오</td><td>반복 문의 Top N 분석표</td></tr><tr><td>첫 스킬</td><td>자동 답변 생성</td><td><span class="mono">문의 유형 분류</span></td></tr></table><div class="callout blue">ChatBot은 응답 인터페이스이고, LLM 분석은 누적 데이터를 읽는 처리 방식입니다. 이 둘은 <b>층위가 다릅니다.</b></div></div>`},
{note:'참고 슬라이드. ChatBot과 LLM은 층위가 다르다. 끊김 방지를 위해 테이블을 compact하게 처리했다.',html:`<div class="paper"><div class="caseTag red">참고 · ChatBot vs LLM</div><div class="h2">ChatBot과 LLM은<br>설계 층위가 다릅니다</div><div class="grid2" style="margin-top:20px;gap:14px"><div class="card orangebg"><div class="label orange">ChatBot</div><div class="ctitle">사용자와 대화하는 인터페이스</div><div class="cbody">웹·앱·메신저에서 사용자 질문에 답하는 대화형 접점입니다. 규칙 기반, 검색 기반, LLM 기반 모두 됩니다.</div></div><div class="card bluebg"><div class="label blue">LLM</div><div class="ctitle">자연어를 읽고 생성하는 모델</div><div class="cbody">분류·요약·초안 작성·패턴 분석처럼 ChatBot 없이도 독립적으로 동작합니다.</div></div></div><table class="table" style="margin-top:16px;font-size:14px"><tr><th>구분</th><th>ChatBot</th><th>LLM</th></tr><tr><td>무엇인가</td><td>사용자 대화 인터페이스</td><td>자연어 처리 모델</td></tr><tr><td>서로 필요한가</td><td colspan="2" style="color:#6b7280">아니요 — 각각 독립적으로 사용 가능</td></tr><tr><td>적합한 첫 질문</td><td>사용자에게 무엇을 답할까?</td><td>이 데이터를 어떻게 분류·분석할까?</td></tr></table><div class="callout dark" style="margin-top:14px"><b>ChatBot 없이도 LLM으로 분류·요약·보고서 초안 작업이 됩니다.</b></div></div>`},
{note:'멘티 B 사례. 5단계 중 첫 실행 단위를 시각적으로 선택하는 과정을 도식으로 보여준다.',html:`<div class="paper"><div class="caseTag orange">아쉬운 사례 2 · 멘티 B</div><div class="h2">5단계 전체를 한꺼번에 자동화하면<br><span style="color:var(--orange)">첫 실행 단위가 보이지 않습니다</span></div><div style="margin-top:22px;display:flex;flex-direction:column;gap:10px"><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center"><div style="padding:12px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:10px;font-size:13px;font-weight:700;color:var(--orange)">① 수집</div><div style="padding:12px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:10px;font-size:13px;font-weight:700;color:var(--orange)">② 분류</div><div style="padding:12px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:10px;font-size:13px;font-weight:700;color:var(--orange)">③ 트렌드</div><div style="padding:12px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:10px;font-size:13px;font-weight:700;color:var(--orange)">④ 매칭</div><div style="padding:12px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:10px;font-size:13px;font-weight:700;color:var(--orange)">⑤ 제안서</div></div><div style="text-align:center;font-size:20px;color:#cbd5e1;font-weight:700;padding:4px 0">↓ 멘토 조정: 첫 단계 1개만</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center"><div style="padding:12px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;font-size:13px;color:#9ca3af">① 수집</div><div style="padding:12px 6px;background:var(--blue2);border:2px solid var(--blue3);border-radius:10px;font-size:13px;font-weight:900;color:var(--blue)">② 분류 ★<br><span style="font-size:11px;font-weight:500">첫 실행</span></div><div style="padding:12px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;font-size:13px;color:#9ca3af">③ 트렌드</div><div style="padding:12px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;font-size:13px;color:#9ca3af">④ 매칭</div><div style="padding:12px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;font-size:13px;color:#9ca3af">⑤ 제안서</div></div></div><div class="callout orange" style="margin-top:14px">최종 목표는 제안서여도 됩니다. 단, <b>이번 주에 검증할 단계는 분류 하나뿐</b>입니다.</div></div>`},
{note:'멘티 B 범위 조정 방법론. 실용적 문장으로 개선.',html:`<div class="paper"><div class="caseTag orange">아쉬운 사례 2 · 범위 조정</div><div class="h2">전체 흐름은 유지하되<br>첫 실행 단위를 분리합니다</div><div class="grid2" style="margin-top:24px"><div class="card orangebg"><div class="label orange">전체 흐름 (계획)</div><div class="ctitle">수집 → 분류 → 트렌드 → 매칭 → 제안서</div><div class="cbody">각 단계의 성격이 달라 한 번에 돌리면 기준이 계속 바뀝니다. 검증도 어렵습니다.</div></div><div class="card bluebg"><div class="label blue">이번 주 실행 단위</div><div class="ctitle"><span class="mono">주제별 분류</span></div><div class="cbody"><b>입력</b> 교육 신청 엑셀, 직군 매핑표<br><b>출력</b> 직군별 주제 랭킹<br><b>기준</b> 분류 조건 5개 이내</div></div></div><div style="margin-top:18px;padding:16px 20px;background:#f8fafc;border-radius:12px;border:1.5px solid var(--line)"><div style="font-weight:700;font-size:15px;margin-bottom:10px;color:#111827">범위 조정 체크</div><div style="display:grid;gap:7px;font-size:14px;color:#4b5563"><div>✓ 이번 주에 검증할 단계가 1개로 특정됐는가</div><div>✓ 그 단계의 입력과 출력이 파일 단위로 명시됐는가</div><div>✓ 30분 안에 샘플 실행이 가능한가</div></div></div></div>`},
{note:'멘티 C 사례. 잘된 사례의 기준을 해석한다. 4항목이 갖춰졌을 때 무엇이 가능해지는지 강조한다. 별표 추가.',html:`<div class="paper"><div class="caseTag green">⭐ 잘된 사례 · 멘티 C</div><div class="h2">잘된 사례는<br>입력·출력·조건·규모가 모두 명확합니다</div><div class="grid4" style="margin-top:26px"><div class="card greenbg"><div class="label green">★ INPUT</div><div class="ctitle">무엇을 넣는가</div><div class="cbody">처리에 사용할 자료가 명확합니다. 파일, 표, 텍스트처럼 시작점이 눈에 보입니다.</div></div><div class="card greenbg"><div class="label green">★ OUTPUT</div><div class="ctitle">무엇을 뽑는가</div><div class="cbody">보고서, 표, 초안, 체크리스트처럼 결과 형태가 특정됩니다.</div></div><div class="card greenbg"><div class="label green">★ CONDITION</div><div class="ctitle">어떤 기준인가</div><div class="cbody">분류 기준이나 판단 조건을 직접 설명할 수 있습니다.</div></div><div class="card greenbg"><div class="label green">★ SCALE</div><div class="ctitle">얼마나 돌리는가</div><div class="cbody">샘플 개수나 파일럿 범위를 구체적으로 정할 수 있습니다.</div></div></div><div class="callout green" style="margin-top:18px"><b>이 4항목이 갖춰지면</b> 문제정의 논의를 줄이고 파일럿 설계로 바로 이동할 수 있습니다.</div></div>`},
{note:'멘티 C 사례의 멘토 피드백 방향. 잘된 사례에는 확장 제안보다 검증 기준 설정이 필요하다.',html:`<div class="paper"><div class="caseTag green">잘된 사례 · 멘토 피드백</div><div class="h2">잘된 사례에 필요한 피드백은<br>확장이 아니라 검증 기준입니다</div><table class="table" style="margin-top:24px"><tr><th>검토 항목</th><th>판단</th><th>다음 제출 방향</th></tr><tr><td>문제정의</td><td>업무 장면과 반복성이 명확히 보임</td><td>문제정의 문장은 짧게 고정합니다</td></tr><tr><td>업무 구조</td><td>입력과 출력이 연결됩니다</td><td>중간 처리 기준을 표 한 장으로 정리합니다</td></tr><tr><td>처리 적용</td><td>초안 생성이나 분류에 바로 쓸 수 있습니다</td><td>샘플 10건으로 1차 실행합니다</td></tr><tr><td>검증 기준</td><td>성공 기준이 아직 없습니다</td><td>정확도·수정 횟수·시간 단축 중 1개를 지표로 정합니다</td></tr></table><div class="callout dark">잘된 사례에 필요한 피드백은 더 큰 기획이 아닙니다. <b>성공 기준 하나를 명확히 정하는 것</b>이 다음 단계입니다.</div></div>`},
{note:'세 사례를 한 장으로 종합.',html:`<div class="paper"><div class="kicker">사례 종합</div><div class="h2">세 사례는 서로 다른 지점에서 막힙니다</div><table class="table" style="margin-top:24px"><tr><th>이름</th><th>막힌 지점</th><th>멘토 처방</th><th>다음 제출물</th></tr><tr><td>멘티 A</td><td>결과물 이름이 문제정의를 끌고 감</td><td>ChatBot → LLM 분석으로 전환</td><td>문의 유형 분류 기준표 + 반복 패턴 리포트</td></tr><tr><td>멘티 B</td><td>범위가 커서 첫 실행 단위가 안 보임</td><td>5단계 중 분류 하나만 선택</td><td>주제별 분류표 + 샘플 실행 로그</td></tr><tr><td>멘티 C</td><td>구조는 갖춰졌고 검증 기준이 없음</td><td>파일럿 성공 기준 1개 설정</td><td>샘플 실행 결과 + 성공 지표</td></tr></table><div class="callout blue" style="margin-top:18px"><b>내 사례는 어느 칸에 가까운가요?</b> 막힌 지점이 다르면 다음 행동도 달라집니다.</div></div>`},
{note:'문제정의 4요소. tacit-skill의 형식화 4요소와 짝을 이루는 핵심 도구.',html:`<div class="paper"><div class="kicker">문제정의 4요소</div><div class="h2">잘된 문제정의는 <span class="hl">4가지 요소</span>가 한 문장씩 명확합니다</div><div class="grid4" style="margin-top:24px"><div class="card bluebg"><div class="label blue">① 입력</div><div class="ctitle">무엇을 넣는가</div><div class="cbody">처리에 사용할 자료. 파일·표·텍스트처럼 시작점이 보입니다.</div></div><div class="card orangebg"><div class="label orange">② 출력</div><div class="ctitle">무엇을 뽑는가</div><div class="cbody">보고서·표·초안·체크리스트처럼 결과 형태가 보입니다.</div></div><div class="card greenbg"><div class="label green">③ 조건</div><div class="ctitle">어떤 기준으로</div><div class="cbody">분류·판단 기준을 사람이 설명할 수 있습니다.</div></div><div class="card purplebg"><div class="label purple">④ 규모</div><div class="ctitle">얼마나 돌릴지</div><div class="cbody">샘플 개수·파일럿 범위를 정할 수 있습니다.</div></div></div><div class="callout dark" style="margin-top:18px">4요소가 한 문장씩 나오면 — <b>문제정의는 끝입니다.</b> 검증 기준 설정으로 넘어가면 됩니다.</div></div>`},
{note:'핵심 메시지. 문제정의는 결과물 이름 짓기가 아니다.',html:`<div class="paper" style="padding:34px 44px;text-align:center"><div class="kicker" style="text-align:center">문제정의의 본질</div><div class="bigquote" style="margin-top:14px">결과물 이름을 먼저 정한다고<br>문제가 풀리지 않습니다.<br><span class="hl">진짜 풀어야 할 것</span>이 무엇인지<br>먼저 짚어야 합니다.</div><div style="margin-top:30px;font-size:16.5px;color:#4b5563;font-weight:600;line-height:1.7;max-width:780px;margin-left:auto;margin-right:auto">"챗봇을 만들자", "대시보드를 만들자"는 <b>도구의 이름</b>입니다.<br>"매주 반복되는 문의 패턴을 분석한다"가 <b>풀어야 할 문제</b>입니다.<br>잘못된 문제정의 위에서는 <b>좋은 데이터도, 좋은 AI도</b> 결과를 못 만듭니다.</div><div style="display:grid;grid-template-columns:1fr 40px 1fr;align-items:center;gap:14px;margin-top:36px;max-width:840px;margin-left:auto;margin-right:auto"><div style="padding:20px 22px;background:var(--red2);border:2px solid var(--red3);border-radius:14px"><div style="color:var(--red);font-size:12px;font-weight:900;letter-spacing:.04em;margin-bottom:8px">❌ 결과물 이름</div><div style="font-weight:900;font-size:17px;color:#111827;margin-bottom:6px">"챗봇 만들기"</div><div style="font-size:13.5px;color:#6b7280;line-height:1.65;text-align:left">FAQ·답변 정책·예외 응대부터 설계 — 진짜 문제는 "무엇을 답할 것인가"인데 가려집니다.</div></div><div style="text-align:center;font-size:30px;color:#cbd5e1;font-weight:900">→</div><div style="padding:20px 22px;background:var(--green2);border:2px solid var(--green3);border-radius:14px"><div style="color:var(--green);font-size:12px;font-weight:900;letter-spacing:.04em;margin-bottom:8px">⭕ 진짜 문제</div><div style="font-weight:900;font-size:17px;color:#111827;margin-bottom:6px">"문의 유형 분석"</div><div style="font-size:13.5px;color:#6b7280;line-height:1.65;text-align:left">반복 문의의 빈도·유형부터 데이터로 확인 — 답변 기준은 그 다음에 자연스럽게 따라옵니다.</div></div></div></div>`},
{note:'문제정의를 초반에 잘 잡는 3가지 점검 순서.',html:`<div class="paper"><div class="kicker">초반 문제정의 점검법</div><div class="h2">이 3가지를 순서대로 확인하면<br>대부분의 오류를 잡을 수 있습니다</div><div style="margin-top:24px"><div class="step"><div class="num">1</div><div><strong>결과물 이름부터 적었는가? — 그렇다면 한 발 물러납니다</strong><span>ChatBot·대시보드·제안서처럼 결과물 이름이 먼저 나왔다면, 데이터와 반복 패턴부터 다시 확인합니다. (멘티 A 패턴)</span></div></div><div class="step"><div class="num">2</div><div><strong>처리 단계가 4개 이상인가? — 그렇다면 첫 단계 1개만 꺼냅니다</strong><span>전체 흐름을 그리되, 이번 주에 검증할 단계는 1개만 남깁니다. (멘티 B 패턴)</span></div></div><div class="step"><div class="num">3</div><div><strong>입력·출력·조건·규모가 한 문장씩 나오는가? — 그렇다면 잘된 사례입니다</strong><span>4항목이 모두 명확하면 문제정의는 완료입니다. 검증 기준(정확도·시간 단축·수정 횟수 중 1개)으로 넘어갑니다. (멘티 C 패턴)</span></div></div></div><div class="callout orange" style="margin-top:6px"><b>문제정의 → 범위 → 검증 기준</b> 순으로 점검합니다. 앞 단계가 흔들리면 뒤는 자동으로 무너집니다.</div></div>`},
{note:'워크숍 안내.',html:`<div class="paper"><div class="kicker">실습</div><div class="h2">내 과제를 3문장으로 다시 씁니다</div><div class="grid3" style="margin-top:26px"><div class="card orangebg"><div class="label orange">문장 1</div><div class="ctitle">문제정의</div><div class="cbody">누가, 언제, 어떤 반복 상황에서 시간을 쓰는지 한 문장으로 씁니다.</div></div><div class="card bluebg"><div class="label blue">문장 2</div><div class="ctitle">첫 스킬</div><div class="cbody">이번 주에 검증할 입력과 출력을 파일 단위로 특정합니다.</div></div><div class="card greenbg"><div class="label green">문장 3</div><div class="ctitle">다음 제출물</div><div class="cbody">이번 주 안에 가져올 것 — 문서, 표, 실행 로그 중 하나입니다.</div></div></div><div class="callout dark">3문장이 채워지지 않으면 구현보다 범위 조정이 먼저입니다.</div></div>`},
{note:'점검 프롬프트.',html:`<div class="paper"><div class="kicker">점검 프롬프트</div><div class="h2">과제 점검 프롬프트</div><div class="mono" style="margin-top:24px;white-space:pre-wrap">아래 과제를 보고 현재 병목 유형을 분류해 주세요.

유형은 3가지입니다.
1. 결과물 이름에 끌려 문제정의가 틀어진 경우
2. 문제 범위가 너무 넓어 첫 실행 단위가 보이지 않는 경우
3. 입력·출력·조건·규모가 갖춰져 파일럿이 가능한 경우

다음 3가지를 제안해 주세요.
- 수정이 필요한 문제정의 문장 1개
- 이번 주에 검증할 첫 스킬 이름 1개
- 다음 제출물 3개 이내

[내 과제]
여기에 본인 과제 입력</div><div class="callout blue">이 프롬프트의 목적은 과제를 <b>이번 주 안에 검증 가능한 첫 단위</b>로 좁히는 것입니다.</div></div>`},
{note:'멘토 본인 사례 ① — 1인 기업의 8개 역할.',html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ① · 1인 기업의 현실</div><div class="h2">프리랜서 PM이 매주 굴리는 <span class="hl">8가지 일</span></div><div class="sub" style="margin-top:10px">영업·기획·실행·관리·정산까지 한 사람이 모두 처리합니다. 자동화 욕심이 모든 영역으로 번지기 쉽습니다.</div><table class="table" style="margin-top:18px;font-size:13.5px"><tr><th style="padding:11px 12px">단계</th><th style="padding:11px 12px">역할</th><th style="padding:11px 12px">주요 업무</th><th style="padding:11px 12px">시간 비중</th></tr><tr><td style="padding:10px 12px"><b style="color:var(--orange)">시작</b></td><td style="padding:10px 12px">영업·제안</td><td style="padding:10px 12px">잠재 클라이언트 미팅, 제안서 초안, 견적 산정</td><td style="padding:10px 12px">월 20%</td></tr><tr><td style="padding:10px 12px"><b style="color:var(--orange)">계약</b></td><td style="padding:10px 12px">기획·계약</td><td style="padding:10px 12px">스코프 정의, WBS, 계약서 검토, 일정 수립</td><td style="padding:10px 12px">프로젝트당 1주</td></tr><tr><td style="padding:10px 12px"><b style="color:var(--blue)">진행</b></td><td style="padding:10px 12px">클라이언트 미팅</td><td style="padding:10px 12px">주간 싱크, 의사결정 요청, 변경 대응</td><td style="padding:10px 12px">주 5~8시간</td></tr><tr style="background:var(--green2)"><td style="padding:10px 12px"><b style="color:var(--green)">⭐ 진행</b></td><td style="padding:10px 12px"><b>주간 진행 관리</b></td><td style="padding:10px 12px">5~10개 프로젝트 상태 정리, 블로커·다음 액션 정리</td><td style="padding:10px 12px"><b>주 2시간 고정</b></td></tr><tr><td style="padding:10px 12px"><b style="color:var(--blue)">실행</b></td><td style="padding:10px 12px">산출물 작업</td><td style="padding:10px 12px">실제 결과물 제작, 리뷰, 수정 반영</td><td style="padding:10px 12px">대부분</td></tr><tr><td style="padding:10px 12px"><b style="color:var(--purple)">관리</b></td><td style="padding:10px 12px">일정·캘린더</td><td style="padding:10px 12px">미팅 조율, 마감 추적, 우선순위 재배치</td><td style="padding:10px 12px">주 1시간</td></tr><tr><td style="padding:10px 12px"><b style="color:var(--purple)">대응</b></td><td style="padding:10px 12px">CS·이슈</td><td style="padding:10px 12px">변경 요청, 컴플레인, 즉시 대응</td><td style="padding:10px 12px">불규칙</td></tr><tr><td style="padding:10px 12px"><b style="color:#6b7280">마감</b></td><td style="padding:10px 12px">정산·세금</td><td style="padding:10px 12px">세금계산서, 입금 확인, 종합소득세 자료</td><td style="padding:10px 12px">월 1회</td></tr></table><div class="callout dark" style="margin-top:16px">"8개 다 자동화하자"는 첫 시도 — 6주간 갈아엎기 5번. <b>매번 새 기준이 튀어나와 멈췄습니다.</b></div></div>`},
{note:'멘토 본인 사례 ② — 매트릭스로 1개 좁히기.',html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ② · 임팩트×현실가능성으로 좁히기</div><div class="h2">8개를 한 번에 못 한다면 <span class="hl">하나만</span></div><div class="sub" style="margin-top:10px">매트릭스에 8개 역할을 올려놓고 1순위를 골랐습니다. 매주 반복 + 시간 잡아먹음 + 기준 명확 — 세 조건을 다 만족하는 것 하나.</div><div style="margin-top:18px;display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;font-size:13px"><div></div><div style="text-align:center;color:#9ca3af;font-weight:900;font-size:12px;padding-bottom:4px">현실가능성 低<br><span style="font-weight:500">(기준 불명확)</span></div><div style="text-align:center;color:var(--green);font-weight:900;font-size:12px;padding-bottom:4px">현실가능성 高<br><span style="font-weight:500;color:#9ca3af">(기준 명확)</span></div><div style="display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:900;font-size:12px;writing-mode:vertical-rl;text-orientation:mixed">임팩트 高</div><div class="card orangebg" style="padding:13px 14px;min-height:96px"><div class="label orange">대기 — 기준화 먼저</div><div class="cbody" style="font-size:12.5px;line-height:1.6">• 영업·제안 (매번 다름)<br>• 기획·견적 (감각 위주)<br>• CS 대응 (예측 불가)</div></div><div class="card greenbg" style="padding:13px 14px;min-height:96px;border-width:2px;position:relative"><div style="position:absolute;top:-10px;right:10px;background:var(--orange);color:#fff;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:900">⭐ 1순위</div><div class="label green">즉시 실행</div><div class="cbody" style="font-size:12.5px;line-height:1.6"><b>주간 진행 관리</b><br>일정·캘린더 정리</div></div><div style="display:flex;align-items:center;justify-content:center;color:#9ca3af;font-weight:900;font-size:12px;writing-mode:vertical-rl;text-orientation:mixed">임팩트 低</div><div class="card graybg" style="padding:13px 14px;min-height:96px"><div class="label">보류</div><div class="cbody" style="font-size:12.5px;line-height:1.6">• 네트워킹 메모<br>• 자기계발 자료</div></div><div class="card graybg" style="padding:13px 14px;min-height:96px"><div class="label">잉여 시간에</div><div class="cbody" style="font-size:12.5px;line-height:1.6">• 정산·세금 (월 1회)<br>• 계약서 양식</div></div></div><div style="margin-top:16px;padding:14px 18px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:12px"><div class="label orange" style="margin-bottom:8px">왜 "주간 진행 관리"가 1순위였나</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:13.5px"><div><b>매주 반복</b><div style="color:#6b7280;font-size:12.5px;margin-top:2px">월요일마다 무조건</div></div><div><b>시간 잡아먹음</b><div style="color:#6b7280;font-size:12.5px;margin-top:2px">일요일 저녁 2시간</div></div><div><b>기준 명확</b><div style="color:#6b7280;font-size:12.5px;margin-top:2px">머릿속에서 이미 작동</div></div></div></div><div class="callout dark" style="margin-top:14px">매트릭스로 1개 좁힘 → <b>첫 작동까지 단 하루</b>. 8개 동시 시도 6주의 교훈입니다.</div></div>`},
{note:'멘토 본인 사례 ③ — /PM-주간정리 형식화와 효과.',html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ③ · /PM-주간정리 형식화</div><div class="h2"><span class="mono" style="font-size:24px;padding:4px 12px">/PM-주간정리</span><br>머릿속 PM 감각을 4요소로 풀어 쓰니</div><div class="grid2" style="margin-top:18px;gap:10px"><div class="card bluebg" style="padding:14px 16px"><div class="label blue">① 포함 — 4단 스냅샷</div><div class="cbody" style="font-size:13px">이번 주 완료 / 다음 주 진행 / <b>블로커 / 의사결정 대기</b><br><span style="color:#9ca3af;font-size:12px">클라이언트별 분리 출력</span></div></div><div class="card orangebg" style="padding:14px 16px"><div class="label orange">② 제외</div><div class="cbody" style="font-size:13px">잡담·추측·완료 항목<br><b>지금 액션 필요한 것만</b><br><span style="color:#9ca3af;font-size:12px">보고서 아닌 행동 리스트</span></div></div><div class="card greenbg" style="padding:14px 16px"><div class="label green">③ 우수예시 — 블로커 패턴</div><div class="cbody" style="font-size:13px">"<b>[클라A] 답변 대기 (3일째)</b>"<br>"결제 보류 — 세금계산서 후"<br>"스코프 변경 감지"</div></div><div class="card purplebg" style="padding:14px 16px"><div class="label purple">④ 보완예시 — 자주 빠뜨리던 것</div><div class="cbody" style="font-size:13px">담당자·마감 빠짐 → <b style="color:var(--orange)">[확인 필요]</b><br>3주 정체 → <b style="color:var(--red)">⚠️</b><br>이슈인데 클라 모름 → <b style="color:var(--orange)">⚡ 선제 보고</b></div></div></div><div style="margin-top:14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div style="padding:14px 12px;background:var(--green2);border:1.5px solid var(--green3);border-radius:12px;text-align:center"><div style="font-size:22px;font-weight:900;color:var(--green);letter-spacing:-.02em">2시간 → 5분</div><div style="font-size:12px;color:#6b7280;margin-top:2px">정리 시간 압축</div></div><div style="padding:14px 12px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:12px;text-align:center"><div style="font-size:22px;font-weight:900;color:var(--orange);letter-spacing:-.02em">5 → 10개</div><div style="font-size:12px;color:#6b7280;margin-top:2px">동시 진행 프로젝트</div></div><div style="padding:14px 12px;background:var(--purple2);border:1.5px solid var(--purple3);border-radius:12px;text-align:center"><div style="font-size:22px;font-weight:900;color:var(--purple);letter-spacing:-.02em">0회</div><div style="font-size:12px;color:#6b7280;margin-top:2px">"어 그게요…"</div></div></div><div class="callout dark" style="margin-top:14px">압축된 시간이 다음 형식화의 재투자 자원입니다. 현재 진행 중: <b>견적 산정 → 제안서 → 정산</b> 순서.</div></div>`},
{note:'마무리.',html:`<div class="paper"><div class="kicker">핵심 정리</div><div class="bigquote">업무 자동화 과제는<br>큰 그림을 한 번에 해결하는 것이 아니라<br><span class="hl">첫 실행 단위</span>를 정확히 정하는 데서 시작합니다.</div><div class="pillrow" style="justify-content:center;margin-top:34px"><span class="pill orange">문제정의</span><span class="pill blue">첫 스킬</span><span class="pill green">파일럿</span></div></div>`}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
