<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KITECH 2주차 슬라이드 | 이유진 멘토</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#2563EB;--blue-bg:#EFF6FF;--blue-bd:#BFDBFE;--blue-dk:#1E3A8A;
  --amber:#92400E;--amber-bg:#FFFBEB;--amber-bd:#FCD34D;
  --red:#B91C1C;--red-bg:#FEF2F2;--red-bd:#FCA5A5;
  --gray-50:#F9FAFB;--gray-100:#F3F4F6;--gray-200:#E5E7EB;
  --gray-300:#D1D5DB;--gray-400:#9CA3AF;--gray-500:#6B7280;
  --gray-600:#4B5563;--gray-700:#374151;--gray-900:#111827;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;}
body{background:#0F172A;display:flex;flex-direction:column;}

/* ── Top bar ── */
.topbar{
  height:44px;flex-shrink:0;
  background:rgba(15,23,42,.95);border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;padding:0 20px;gap:16px;
}
.tb-title{font-size:12px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.05em;text-transform:uppercase;}
.tb-section{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:700;letter-spacing:.04em;}
.tb-section.am{background:#1D4ED8;color:#fff;}
.tb-section.vs{background:#0F766E;color:#fff;}
.tb-section.pm{background:#7C3AED;color:#fff;}
.tb-counter{margin-left:auto;font-size:12px;color:rgba(255,255,255,.35);font-variant-numeric:tabular-nums;}
.tb-btn{background:none;border:1px solid rgba(255,255,255,.15);border-radius:5px;color:rgba(255,255,255,.5);font-size:11px;padding:4px 10px;cursor:pointer;transition:all .15s;}
.tb-btn:hover{background:rgba(255,255,255,.08);color:#fff;}
.tb-btn.active{background:rgba(37,99,235,.3);border-color:#2563EB;color:#93C5FD;}

/* ── Progress bar ── */
.progress-bar{height:2px;background:rgba(255,255,255,.07);flex-shrink:0;}
.progress-fill{height:100%;background:linear-gradient(90deg,#2563EB,#7C3AED);transition:width .4s cubic-bezier(.22,1,.36,1);}

/* ── Slide stage ── */
.stage{flex:1;position:relative;overflow:hidden;}
.slide{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 60px;
  opacity:0;transform:translateX(60px);
  transition:opacity .38s cubic-bezier(.22,1,.36,1),transform .38s cubic-bezier(.22,1,.36,1);
  pointer-events:none;overflow-y:auto;
}
.slide.active{opacity:1;transform:translateX(0);pointer-events:auto;}
.slide.exit-left{opacity:0;transform:translateX(-60px);}
.slide.enter-right{opacity:0;transform:translateX(60px);}

/* ── Slide content widths ── */
.slide-inner{width:100%;max-width:820px;}

/* ── Nav arrows ── */
.nav-arrow{
  position:fixed;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.4);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;z-index:10;
}
.nav-arrow:hover{background:rgba(255,255,255,.15);color:#fff;}
.nav-arrow.prev{left:14px;}
.nav-arrow.next{right:14px;}
.nav-arrow:disabled{opacity:.2;cursor:default;}

/* ── Speaker notes ── */
.notes-panel{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(15,23,42,.97);border-top:1px solid rgba(255,255,255,.1);
  padding:14px 24px;font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.7;
  transform:translateY(100%);transition:transform .3s;
  max-height:160px;overflow-y:auto;
}
.notes-panel.open{transform:translateY(0);}
.notes-label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#60A5FA;margin-bottom:6px;}

/* ── Slide type: cover ── */
.cover-kicker{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:12px;}
.cover-h1{font-size:42px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:16px;}
.cover-sub{font-size:16px;color:rgba(255,255,255,.55);line-height:1.6;}
.cover-pills{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}
.cpill{padding:6px 16px;border-radius:99px;font-size:12px;font-weight:700;}
.cpill.am{background:rgba(37,99,235,.25);color:#93C5FD;border:1px solid rgba(37,99,235,.4);}
.cpill.vs{background:rgba(13,148,136,.2);color:#5EEAD4;border:1px solid rgba(13,148,136,.35);}
.cpill.pm{background:rgba(124,58,237,.25);color:#C4B5FD;border:1px solid rgba(124,58,237,.4);}

/* ── Slide type: section divider ── */
.sec-num{font-size:80px;font-weight:900;color:rgba(255,255,255,.05);line-height:1;margin-bottom:-10px;}
.sec-tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px;}
.sec-tag.am{background:#1D4ED8;color:#fff;}
.sec-tag.vs{background:#0F766E;color:#fff;}
.sec-tag.pm{background:#7C3AED;color:#fff;}
.sec-h{font-size:36px;font-weight:800;color:#fff;line-height:1.3;margin-bottom:12px;}
.sec-desc{font-size:15px;color:rgba(255,255,255,.5);line-height:1.7;}

/* ── Slide content elements ── */
.slide-h{font-size:26px;font-weight:800;color:#fff;margin-bottom:6px;line-height:1.3;}
.slide-sub{font-size:13px;color:rgba(255,255,255,.4);margin-bottom:24px;}
.slide-h2{font-size:19px;font-weight:700;color:#fff;margin-bottom:14px;}
.slide-p{font-size:14px;color:rgba(255,255,255,.7);line-height:1.8;margin-bottom:12px;}

/* ── Card grid ── */
.card-grid{display:grid;gap:12px;}
.card-grid.cols2{grid-template-columns:1fr 1fr;}
.card-grid.cols3{grid-template-columns:1fr 1fr 1fr;}
.card-grid.cols4{grid-template-columns:1fr 1fr 1fr 1fr;}
.card{border-radius:10px;padding:16px 18px;}
.card.blue{background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.3);}
.card.red{background:rgba(185,28,28,.15);border:1px solid rgba(185,28,28,.25);}
.card.amber{background:rgba(146,64,14,.2);border:1px solid rgba(252,211,77,.3);}
.card.gray{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);}
.card.green{background:rgba(5,150,105,.15);border:1px solid rgba(5,150,105,.3);}
.card.dark{background:rgba(15,23,42,.8);border:1px solid rgba(255,255,255,.1);}
.card-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.card-tag.blue{color:#93C5FD;}
.card-tag.red{color:#FCA5A5;}
.card-tag.amber{color:#FCD34D;}
.card-tag.gray{color:rgba(255,255,255,.35);}
.card-tag.green{color:#6EE7B7;}
.card-title{font-size:15px;font-weight:700;color:#fff;margin-bottom:6px;}
.card-body{font-size:13px;color:rgba(255,255,255,.6);line-height:1.75;}
.card-body li{margin-bottom:3px;list-style:none;padding-left:14px;position:relative;}
.card-body li::before{content:"·";position:absolute;left:2px;color:rgba(255,255,255,.3);}

/* ── Table ── */
.sl-tbl{width:100%;border-collapse:collapse;font-size:13px;border-radius:8px;overflow:hidden;}
.sl-tbl thead th{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;text-align:left;}
.sl-tbl tbody td{padding:9px 14px;color:rgba(255,255,255,.7);border-bottom:1px solid rgba(255,255,255,.06);}
.sl-tbl tbody tr:last-child td{border-bottom:none;}
.sl-tbl tbody tr:hover td{background:rgba(255,255,255,.03);}
.good-cell{color:#6EE7B7;font-weight:600;}
.warn-cell{color:rgba(255,255,255,.35);}

/* ── Note / callout ── */
.sl-note{border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.75;margin-top:14px;}
.sl-note.blue{background:rgba(37,99,235,.15);border-left:3px solid #2563EB;color:#BAE6FD;}
.sl-note.amber{background:rgba(146,64,14,.2);border-left:3px solid #FCD34D;color:#FDE68A;}
.sl-note.red{background:rgba(185,28,28,.15);border-left:3px solid #EF4444;color:#FCA5A5;}

/* ── Steps ── */
.step-list{display:flex;flex-direction:column;gap:10px;}
.step-item{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
.step-num{width:26px;height:26px;border-radius:50%;background:#2563EB;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:13.5px;color:rgba(255,255,255,.75);line-height:1.7;}
.step-text strong{color:#fff;}

/* ── BA pair ── */
.ba-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ba-bef{background:rgba(185,28,28,.12);border:1px solid rgba(185,28,28,.25);border-radius:8px;padding:14px;}
.ba-aft{background:rgba(37,99,235,.12);border:1px solid rgba(37,99,235,.3);border-radius:8px;padding:14px;}
.ba-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.ba-label.bef{color:#FCA5A5;}
.ba-label.aft{color:#93C5FD;}
.ba-task{font-size:14px;font-weight:700;color:#fff;margin-bottom:6px;line-height:1.4;}
.ba-body{font-size:12.5px;color:rgba(255,255,255,.5);line-height:1.8;}

/* ── Quadrant mini ── */
.quad-wrap{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,.1);}
.quad{padding:14px;text-align:center;}
.quad.q1{background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.3);}
.quad.q2{background:rgba(185,28,28,.12);border:1px solid rgba(185,28,28,.2);}
.quad.q3{background:rgba(107,114,128,.1);border:1px solid rgba(107,114,128,.15);}
.quad.q4{background:rgba(107,114,128,.08);border:1px solid rgba(107,114,128,.1);}
.quad-num{font-size:28px;font-weight:900;opacity:.2;line-height:1;margin-bottom:4px;}
.quad-title{font-size:13px;font-weight:700;color:#fff;margin-bottom:4px;}
.quad-desc{font-size:11.5px;color:rgba(255,255,255,.45);}

/* ── Code block ── */
.code-block{background:#0D1117;border-radius:8px;padding:14px 18px;font-family:"Menlo","Monaco","Consolas",monospace;font-size:12.5px;line-height:1.9;border:1px solid rgba(255,255,255,.08);}
.code-h{color:#7DD3FC;}
.code-li{color:#6EE7B7;}
.code-cm{color:#6A9955;}
.code-var{color:#9CDCFE;}
.code-str{color:#CE9178;}

/* ── Checklist ── */
.check-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);margin-bottom:6px;font-size:13px;color:rgba(255,255,255,.7);}
.check-row svg{flex-shrink:0;margin-top:2px;}

/* ── Analogy box ── */
.analogy{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-left:3px solid #2563EB;border-radius:0 8px 8px 0;padding:16px 20px;font-size:14px;color:rgba(255,255,255,.7);line-height:1.85;}
.analogy strong{color:#fff;}

/* ── Criteria cards ── */
.crit-num{width:28px;height:28px;border-radius:8px;background:#2563EB;color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.crit-name{font-size:16px;font-weight:700;color:#fff;margin-bottom:4px;}
.crit-q{font-size:12.5px;color:rgba(255,255,255,.45);}

/* ── Funnel ── */
.funnel{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;align-items:start;gap:0;}
.funnel-box{border-radius:8px;padding:14px;text-align:center;}
.funnel-arrow{display:flex;align-items:center;justify-content:center;padding-top:40px;}
.funnel-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}

/* ── Tactile callout ── */
.big-callout{background:linear-gradient(135deg,rgba(37,99,235,.2),rgba(124,58,237,.2));border:1.5px solid rgba(37,99,235,.35);border-radius:12px;padding:22px 28px;text-align:center;margin-bottom:16px;}
.bc-label{font-size:11px;color:rgba(255,255,255,.4);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase;}
.bc-text{font-size:18px;font-weight:700;color:#fff;line-height:1.6;}
.bc-text .hl{color:#93C5FD;}

/* ── Scroll hint ── */
.scroll-hint{position:absolute;bottom:8px;right:20px;font-size:10px;color:rgba(255,255,255,.2);pointer-events:none;}
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="tb-title">KITECH 2주차</span>
  <span id="sectionBadge" class="tb-section am">오전</span>
  <span id="slideTitle" style="font-size:12px;color:rgba(255,255,255,.5);"></span>
  <span class="tb-counter"><span id="cur">1</span> / <span id="tot">1</span></span>
  <button class="tb-btn" id="notesBtn" onclick="toggleNotes()">멘토 노트</button>
  <button class="tb-btn" onclick="toggleOverview()">목차</button>
</div>
<div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>

<!-- Stage -->
<div class="stage" id="stage"></div>

<!-- Nav arrows -->
<button class="nav-arrow prev" id="btnPrev" onclick="go(-1)">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4l-5 5 5 5"/></svg>
</button>
<button class="nav-arrow next" id="btnNext" onclick="go(1)">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4l5 5-5 5"/></svg>
</button>

<!-- Speaker notes -->
<div class="notes-panel" id="notesPanel">
  <div class="notes-label">멘토 노트</div>
  <div id="notesContent">—</div>
</div>

<!-- Overview overlay -->
<div id="overview" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;overflow-y:auto;padding:32px;">
  <div style="max-width:900px;margin:0 auto;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;">
      <h2 style="color:#fff;font-size:20px;">슬라이드 목차</h2>
      <button onclick="toggleOverview()" style="background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:13px;">닫기</button>
    </div>
    <div id="overviewGrid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// SLIDE DATA
// ─────────────────────────────────────────────
const SLIDES = [

// ═══ COVER ═══
{
  section:'cover', title:'표지',
  notes:'강의 시작 전 화면. 참여자들이 자리 잡는 동안 보여주세요.',
  html:`<div class="slide-inner" style="text-align:center;padding-top:20px;">
    <div class="cover-kicker">KITECH AI 업무 자동화 · 2주차</div>
    <div class="cover-h1">단일 에이전트 설계와<br/>업무 자동화 실습</div>
    <div class="cover-sub">이유진 멘토 담당 파트 강의안<br/>오전 20분 / VS Code 실습 / 오후 40분</div>
    <div class="cover-pills" style="justify-content:center;">
      <span class="cpill am">오전 — 문제 좁히기</span>
      <span class="cpill vs">VS Code 환경 실습</span>
      <span class="cpill pm">오후 — 암묵지 형식화</span>
    </div>
  </div>`
},

// ═══ 오전 SECTION ═══
{
  section:'am', title:'오전 세션',
  notes:'오전 파트 시작을 알리는 섹션 구분 슬라이드. "오늘 딱 한 가지만 기억하면 됩니다"로 시작하세요.',
  html:`<div class="slide-inner" style="text-align:center;">
    <div class="sec-num">01</div>
    <div class="sec-tag am">오전 · 20분</div>
    <div class="sec-h">문제 좁히기</div>
    <div class="sec-desc">넓은 과제를 이번 주 안에 작동시킬 수 있는 단위로 줄이기</div>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:28px;flex-wrap:wrap;">
      <span style="padding:5px 14px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);font-size:12px;">0–5분 목표 설명</span>
      <span style="padding:5px 14px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.45);font-size:12px;">5–12분 기준 + 사례</span>
      <span style="padding:5px 14px;border-radius:6px;background:rgba(37,99,235,.2);border:1px solid rgba(37,99,235,.4);color:#93C5FD;font-size:12px;">12–20분 내 과제 실습</span>
    </div>
  </div>`
},

// 오늘 하는 것 / 하지 않는 것
{
  section:'am', title:'오늘 하는 것 vs 하지 않는 것',
  notes:'명확한 경계 설정이 핵심. "완성도가 아니라 작동 여부가 목표"임을 강조하세요.',
  html:`<div class="slide-inner">
    <div class="slide-h">오늘 하는 것과 하지 않는 것</div>
    <div class="slide-sub">목표를 명확히 해야 좁히기도 됩니다</div>
    <div class="card-grid cols2">
      <div class="card green">
        <div class="card-tag green">오늘 하는 것</div>
        <ul class="card-body">
          <li>내 업무 중 <strong style="color:#fff;">작은 한 단계</strong> 고르기</li>
          <li>그 단계에 필요한 데이터 정리하기</li>
          <li>AI에게 알려줄 <strong style="color:#fff;">기준 문서</strong> 만들기</li>
          <li>단일 에이전트 한 번 작동시켜보기</li>
          <li>반복할 수 있는 작업인지 판단하기</li>
        </ul>
      </div>
      <div class="card red">
        <div class="card-tag red">오늘 하지 않는 것</div>
        <ul class="card-body">
          <li>전체 업무 자동화</li>
          <li>멀티 에이전트 구성</li>
          <li>웹 서비스 / DB / API / MCP 구축</li>
          <li>완성도 높은 시스템 제작</li>
          <li>지난주 과제 완성</li>
        </ul>
      </div>
    </div>
    <div class="sl-note blue">오늘 목표는 완벽한 시스템이 아닙니다. <strong>AI에게 맡길 첫 번째 업무를 하나 골라서 한 번 돌려보는 것</strong>, 그게 전부입니다.</div>
  </div>`
},

// 왜 좁혀야 하는가
{
  section:'am', title:'왜 문제를 좁혀야 하는가',
  notes:'신입 비유가 핵심. "정산 업무 전체 다 해줘" vs "이 엑셀에서 이상한 금액만 찾아서 표시해줘" 예시를 직접 말로 덧붙이세요.',
  html:`<div class="slide-inner">
    <div class="slide-h">왜 문제를 좁혀야 하는가</div>
    <div class="slide-sub">비유로 이해하기</div>
    <div class="analogy" style="margin-bottom:18px;">
      에이전트 만들기는 큰 부서 하나를 세우는 일이 아닙니다.<br/>
      <strong>신입 한 명에게 첫 업무 지시서를 쓰는 것</strong>에 가깝습니다.<br/><br/>

// Before / After
{
  section:'am', title:'Before / After 사례',
  notes:'참여자 업무 유형(R&D, 행정, 교육운영 등)에 맞는 사례를 골라 강조하세요.',
  html:`<div class="slide-inner">
    <div class="slide-h">Before / After 사례</div>
    <div class="slide-sub">좁히기 전과 후 비교</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="ba-pair">
        <div class="ba-bef">
          <div class="ba-label bef">Before — 너무 넓다</div>
          <div class="ba-task">재무 업무 전체를 자동화</div>
          <div class="ba-body">데이터 확인 → 금액 검증 → 이상값 탐지 → 보고서 → 승인</div>
        </div>
        <div class="ba-aft">
          <div class="ba-label aft">After — 좁혔다</div>
          <div class="ba-task">엑셀에서 이상값 찾아 요약 메모</div>
          <div class="ba-body">입력: CSV / 출력: 이상값 목록 + 한 줄 요약 / 매주 반복</div>
        </div>
      </div>
      <div class="ba-pair">
        <div class="ba-bef">
          <div class="ba-label bef">Before — 너무 넓다</div>
          <div class="ba-task">교육 운영 전체를 자동화</div>
          <div class="ba-body">신청자 확인 → 안내 메일 → 명단 → 만족도 → 보고서</div>
        </div>
        <div class="ba-aft">
          <div class="ba-label aft">After — 좁혔다</div>
          <div class="ba-task">참석자 CSV → 안내 메일 초안</div>
          <div class="ba-body">입력: 명단 CSV + 교육 일정 / 출력: 안내 메일 초안 / 행사마다 반복</div>
        </div>
      </div>
      <div class="ba-pair">
        <div class="ba-bef">
          <div class="ba-label bef">Before — 너무 넓다</div>
          <div class="ba-task">기술동향 보고서 전체 자동화</div>
          <div class="ba-body">자료 수집 → 분석 → 초안 → 검토 → 편집</div>
        </div>
        <div class="ba-aft">
          <div class="ba-label aft">After — 좁혔다</div>
          <div class="ba-task">논문 3건 → 보고서 서두 단락</div>
          <div class="ba-body">입력: PDF 본문 텍스트 / 출력: 핵심 3줄 + 시사점 1줄</div>
        </div>
      </div>
    </div>
  </div>`
},

// 실습 워크시트
{
  section:'am', title:'실습 — 내 과제 좁히기',
  notes:'8분 실습. 순회하면서 "원래 과제"가 너무 크면 계속 쪼개도록 유도. "오늘 만들 에이전트" 칸이 한 문장이어야 함.',
  html:`<div class="slide-inner">
    <div class="slide-h">실습 — 내 과제 좁히기</div>
    <div class="slide-sub" style="margin-bottom:16px;">8분 · 아래 워크시트를 직접 채워보세요</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div class="step-item">
        <div class="step-num">1</div>
        <div class="step-text"><strong>원래 과제</strong> — AI에게 맡기고 싶은 업무를 크게 적는다<br/><span style="color:rgba(255,255,255,.35);font-size:12px;">예) 기술 트렌드 보고서 작성 전체 자동화</span></div>
      </div>
      <div class="step-item">
        <div class="step-num">2</div>
        <div class="step-text"><strong>포함된 단계들</strong> — 이 업무 안의 세부 단계를 3~5개로 나눈다<br/><span style="color:rgba(255,255,255,.35);font-size:12px;">예) 자료 수집 → 요약 → 분류 → 초안 → 검토</span></div>
      </div>
      <div class="step-item">
        <div class="step-num">3</div>
        <div class="step-text"><strong>가장 반복되는 단계</strong> — 자주 반복되고 번거로운 단계 하나 고른다<br/><span style="color:rgba(255,255,255,.35);font-size:12px;">예) 논문/기사 본문 요약</span></div>
      </div>
      <div class="step-item">
        <div class="step-num">4</div>
        <div class="step-text"><strong>입력 데이터</strong> — AI가 읽어야 하는 자료는 무엇인가?<br/><span style="color:rgba(255,255,255,.35);font-size:12px;">예) PDF 본문 텍스트 (민감정보 없음)</span></div>
      </div>
      <div class="step-item">
        <div class="step-num">5</div>

// ─────────────────────────────────────────────
// RENDER ENGINE
// ─────────────────────────────────────────────
const stage = document.getElementById('stage');
let cur = 0;
let notesOpen = false;
let overviewOpen = false;

const SECTION_INFO = {
  cover:{ label:'강의안', cls:'' },
  am:{ label:'오전', cls:'am' },
  vs:{ label:'VS Code', cls:'vs' },
  pm:{ label:'오후', cls:'pm' },
};

function init() {
  document.getElementById('tot').textContent = SLIDES.length;
  SLIDES.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide';
    div.id = 'slide-' + i;
    div.innerHTML = '<div style="width:100%;max-width:840px;">' + s.html + '</div>';
    stage.appendChild(div);
  });
  buildOverview();
  showSlide(0, 0);
}

function showSlide(idx, dir) {
  const prev = document.getElementById('slide-' + cur);
  if (prev) {
    prev.classList.remove('active');
    prev.classList.add(dir >= 0 ? 'exit-left' : 'enter-right');
    setTimeout(() => prev.classList.remove('exit-left', 'enter-right'), 400);
  }
  cur = idx;
  const next = document.getElementById('slide-' + cur);
  next.classList.remove('exit-left', 'enter-right');
  next.classList.add('active');

  // update topbar
  document.getElementById('cur').textContent = cur + 1;
  const s = SLIDES[cur];
  const si = SECTION_INFO[s.section] || SECTION_INFO.cover;
  const badge = document.getElementById('sectionBadge');
  badge.textContent = si.label;
  badge.className = 'tb-section' + (si.cls ? ' ' + si.cls : '');
  document.getElementById('slideTitle').textContent = s.title;

  // progress
  document.getElementById('pFill').style.width = ((cur + 1) / SLIDES.length * 100) + '%';

  // notes
  document.getElementById('notesContent').textContent = s.notes || '—';

  // arrows
  document.getElementById('btnPrev').disabled = cur === 0;
  document.getElementById('btnNext').disabled = cur === SLIDES.length - 1;
}

function go(dir) {
  const next = cur + dir;
  if (next < 0 || next >= SLIDES.length) return;
  showSlide(next, dir);
}

function toggleNotes() {
  notesOpen = !notesOpen;
  document.getElementById('notesPanel').classList.toggle('open', notesOpen);
  document.getElementById('notesBtn').classList.toggle('active', notesOpen);
}

function buildOverview() {
  const grid = document.getElementById('overviewGrid');
  SLIDES.forEach((s, i) => {
    const si = SECTION_INFO[s.section] || SECTION_INFO.cover;
    const card = document.createElement('div');
    card.style.cssText = 'background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s;';
    card.innerHTML = `<div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.3);margin-bottom:4px;">${i+1} / ${SLIDES.length}</div><div style="font-size:12.5px;font-weight:600;color:#fff;line-height:1.4;">${s.title}</div>`;
    card.addEventListener('mouseenter', () => card.style.background = 'rgba(255,255,255,.09)');
    card.addEventListener('mouseleave', () => card.style.background = 'rgba(255,255,255,.04)');
    card.addEventListener('click', () => { showSlide(i, i > cur ? 1 : -1); toggleOverview(); });
    grid.appendChild(card);
  });
}

function toggleOverview() {
  overviewOpen = !overviewOpen;
  document.getElementById('overview').style.display = overviewOpen ? 'block' : 'none';
}

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); go(1); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); go(-1); }
  if (e.key === 'Escape') { if (overviewOpen) toggleOverview(); if (notesOpen) toggleNotes(); }
  if (e.key === 'n' || e.key === 'N') toggleNotes();
  if (e.key === 'o' || e.key === 'O') toggleOverview();
});

// Touch swipe
let touchX = 0;
stage.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
stage.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

init();
</script>
