body{display:flex;flex-direction:column}.topbar{height:54px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 26px;z-index:30}.badge{font-size:12px;font-weight:950;color:var(--orange);letter-spacing:-.02em}.badge-dot{width:14px;height:14px;border:2px solid var(--orange);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;margin-left:4px}.tb-title{font-weight:850;font-size:14px;color:#4b5563}.tb-meta{font-size:13px;color:#8b8f98}.spacer{flex:1}.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12px;color:#6b7280;cursor:pointer}.btn:hover{border-color:#cbd5e1;color:#111827}.btn.active{background:#111827;color:#fff;border-color:#111827}.counter{font-variant-numeric:tabular-nums;font-size:13px;color:#9ca3af;font-weight:800}.progress{height:3px;background:#eef2f7}.progress div{height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--blue));transition:width .28s ease}.stage{flex:1;position:relative;overflow:hidden}.slide{position:absolute;inset:0;padding:34px 72px 58px;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateX(48px);transition:.32s cubic-bezier(.22,1,.36,1);pointer-events:none}.slide.active{opacity:1;transform:translateX(0);pointer-events:auto}.slide.exit{opacity:0;transform:translateX(-48px)}.inner{width:100%;max-width:1120px;margin:auto}.paper{background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:46px 54px;box-shadow:0 22px 60px rgba(15,23,42,.08)}.kicker{font-size:14px;font-weight:950;color:var(--orange);letter-spacing:-.02em;margin-bottom:12px}.h1{font-size:48px;line-height:1.13;letter-spacing:-.065em;font-weight:950;color:var(--text)}.h2{font-size:34px;line-height:1.2;letter-spacing:-.05em;font-weight:950;color:var(--text)}.h3{font-size:22px;line-height:1.35;letter-spacing:-.035em;font-weight:950}.sub{font-size:20px;color:#7b7f86;line-height:1.65;margin-top:18px}.small{font-size:14px;color:#7b7f86;line-height:1.75}.muted{color:#8a8f98}.hl{color:var(--orange)}.blue{color:var(--blue)}.green{color:var(--green)}.purple{color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border-radius:22px;padding:24px;border:1px solid var(--line);background:#fff}.bluebg{background:var(--blue2);border-color:var(--blue3)}.orangebg{background:var(--orange2);border-color:var(--orange3)}.redbg{background:var(--red2);border-color:var(--red3)}.greenbg{background:var(--green2);border-color:var(--green3)}.purplebg{background:var(--purple2);border-color:var(--purple3)}.graybg{background:#f8fafc;border-color:#e2e8f0}.label{font-size:12px;font-weight:950;letter-spacing:.02em;color:#9ca3af;text-transform:uppercase;margin-bottom:10px}.label.orange{color:var(--orange)}.label.blue{color:var(--blue)}.label.red{color:var(--red)}.label.green{color:var(--green)}.label.purple{color:var(--purple)}.ctitle{font-size:20px;font-weight:950;letter-spacing:-.035em;line-height:1.32;margin-bottom:10px}.cbody{font-size:15px;color:#6b7280;line-height:1.72}.cbody b{color:#111827}.callout{border-radius:20px;padding:19px 23px;margin-top:18px;font-size:17px;line-height:1.65;font-weight:760}.callout.orange{background:var(--orange2);border:1px solid var(--orange3);color:#9a3412}.callout.blue{background:var(--blue2);border:1px solid var(--blue3);color:#1d4ed8}.callout.green{background:var(--green2);border:1px solid var(--green3);color:#047857}.callout.purple{background:var(--purple2);border:1px solid var(--purple3);color:#5b21b6}.callout.dark{background:#111827;color:#fff}.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;padding:8px 15px;font-size:14px;font-weight:850;color:#6b7280}.pill.orange{background:var(--orange2);border-color:var(--orange3);color:var(--orange)}.pill.blue{background:var(--blue2);border-color:var(--blue3);color:var(--blue)}.pill.green{background:var(--green2);border-color:var(--green3);color:var(--green)}.pill.purple{background:var(--purple2);border-color:var(--purple3);color:var(--purple)}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px;border-radius:18px;border:1px solid var(--line);background:#fff;margin-bottom:12px}.num{width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.num.red{background:var(--red)}.num.orange{background:var(--orange)}.num.green{background:var(--green)}.num.purple{background:var(--purple)}.step strong{display:block;font-size:18px;letter-spacing:-.035em;margin-bottom:5px}.step span{font-size:15px;color:#6b7280;line-height:1.65}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.table th{background:#f8fafc;font-size:13px;color:#6b7280;text-align:left;padding:14px 16px}.table td{padding:15px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.65;vertical-align:top}.table td:first-child{font-weight:900;color:#111827}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7;color:#374151}.bigquote{font-size:30px;line-height:1.45;letter-spacing:-.055em;font-weight:950;text-align:center;color:#111827}.arrow{font-size:24px;color:#cbd5e1;font-weight:950;display:flex;align-items:center;justify-content:center}.caseTag{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:18px}.caseTag.red{background:var(--red2);color:var(--red);border:1px solid var(--red3)}.caseTag.orange{background:var(--orange2);color:var(--orange);border:1px solid var(--orange3)}.caseTag.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}.caseTag.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}.twoflow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.notes{position:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}
@media(max-width:900px){.slide{padding:26px 22px 54px}.paper{padding:32px 24px;border-radius:24px}.h1{font-size:36px}.h2{font-size:28px}.grid2,.grid3,.grid4,.twoflow{grid-template-columns:1fr}.arrow{display:none}.topbar{padding:0 14px}.tb-meta{display:none}.nav{display:none}}
/* Design-system alignment: KITECH 운영용 강의자료 톤 */
:root{
  --bg:#fafaf9;--paper:#fff;--ink:#2c2c2c;--text:#2c2c2c;--muted:#6b6b6b;--sub:#8a8a8a;
  --blue:#2563eb;--blue2:rgba(37,99,235,.08);--blue3:rgba(37,99,235,.25);
  --orange:#b45309;--orange2:rgba(180,83,9,.08);--orange3:rgba(180,83,9,.22);
  --red:#b91c1c;--red2:rgba(185,28,28,.07);--red3:rgba(185,28,28,.22);
  --green:#0f766e;--green2:rgba(15,118,110,.08);--green3:rgba(15,118,110,.24);
  --purple:#7c3aed;--purple2:rgba(124,58,237,.08);--purple3:rgba(124,58,237,.24);
  --line:#e5e5e3;--dark:#111827;
}
.topbar{height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:0 28px}
.badge{color:var(--blue);letter-spacing:.03em;text-transform:uppercase}.badge-dot{border-color:var(--blue)}
.tb-title{color:var(--text);font-weight:800}.tb-meta{color:var(--muted)}
.progress{background:#f1f1ef}.progress div{background:linear-gradient(90deg,var(--blue),var(--green))}
.stage{overflow:hidden}.slide{padding:36px 72px 62px;overflow-y:auto;align-items:flex-start}.inner{max-width:1020px;margin:auto}
.paper{border-radius:14px;border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04);padding:42px 48px;max-height:calc(100vh - 128px);overflow-y:auto}
.kicker{color:var(--blue);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.h1{font-size:42px;letter-spacing:-.5px;font-weight:850}.h2{font-size:30px;letter-spacing:-.35px;font-weight:850}.sub{font-size:17px;color:var(--muted)}
.card{border-radius:12px;border:1.5px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.02);padding:22px}
.ctitle{font-size:19px;font-weight:800;letter-spacing:-.2px}.cbody{font-size:14.5px;color:var(--muted)}
.callout{border-radius:12px;font-size:15px;font-weight:650}.pill{border-radius:999px;font-size:12px;padding:6px 12px}
.step{border-radius:12px;border:1.5px solid var(--line);padding:15px}.num{border-radius:999px;background:var(--blue)}
.table{border-radius:12px;border:1.5px solid var(--line)}.table th{background:#f8fafc}.mono{border-radius:10px}
.nav{width:42px;height:42px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.dot.on{background:var(--blue)}.notes{border-radius:14px;background:#111827}
@media(max-height:760px){.paper{padding:30px 36px}.h1{font-size:36px}.h2{font-size:26px}.sub{font-size:15.5px}.card{padding:18px}.callout{padding:15px 18px}}

<body>
<header class="topbar">
  <span class="badge">멘토 사례 <span class="badge-dot">2</span></span>
  <span class="tb-title">암묵지 형식화 사례 워크숍</span>
  <span class="tb-meta">13:50–14:10 · 발표 이유진 멘토</span>
  <span class="spacer"></span>
  <span class="counter"><span id="cur">1</span> / <span id="tot">16</span></span>
  <button class="btn" id="noteBtn">발표 노트</button>
</header>
<div class="progress"><div id="bar"></div></div>
<main class="stage" id="stage"></main>
<button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button>
<div class="dots" id="dots"></div>
<div class="notes" id="notes"><b>발표 노트</b><br><span id="noteText"></span></div>
<script>
const SLIDES=[
{note:'오프닝. 오전에 문제를 좁혔다면, 오후는 그 문제를 푸는 판단 기준을 꺼내는 작업임을 안내한다.',html:`<div class="paper"><div class="kicker">Tacit Knowledge · Skill Development</div><div class="h1">머릿속 판단 기준을<br>문서로 꺼내고<br><span class="hl">스킬로 옮기기</span></div><div class="sub">담당자에게만 축적된 판단 기준을 어떻게 문서화하고,<br>그 기준을 반복 실행 가능한 스킬로 전환했는지를<br>멘토 3명의 사례로 검토합니다.</div><div class="pillrow"><span class="pill orange">사례 A · 뉴스 선별</span><span class="pill blue">사례 B · 원규 검토</span><span class="pill green">사례 C · 회의록</span><span class="pill purple">4가지 형식화 요소</span><span class="pill dark">실습</span></div></div>`},
{note:'오후 20분 흐름 안내. 사례를 외우는 것이 아니라 형식화 방식과 4가지 요소를 본인 업무에 옮기는 것이 목표다.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">오후 20분 검토 순서</div><div style="margin-top:24px"><div class="step"><div class="num orange">1</div><div><strong>0~5분 — 암묵지 형식화란 무엇인가</strong><span>업무 중 반복되는 판단 기준을 문서로 꺼내, 처리 기준과 스킬 구조로 바꾸는 과정을 정의합니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>5~10분 — 사례 A · 뉴스 선별과 한 문장 요약</strong><span>기사 선별 기준과 문장 작성 규칙이 어떻게 처리 기준과 3개 스킬로 분리됐는지 봅니다.</span></div></div><div class="step"><div class="num blue">3</div><div><strong>10~15분 — 사례 B · 원규 검토 스킬</strong><span>원규 검토 시 사용하는 5가지 관점이 어떻게 스킬의 뼈대가 되는지 봅니다.</span></div></div><div class="step"><div class="num green">4</div><div><strong>15~20분 — 사례 C · 회의록과 HWPX 제약</strong><span>회의록 작성 기준은 정리됐지만 포맷 처리 제약이 남은 사례를 점검합니다.</span></div></div></div><div class="callout dark">목표는 사례를 외우는 것이 아닙니다. <b>판단 기준을 글로 옮기는 방식</b>을 본인 업무로 가져가는 것입니다.</div></div>`},
{note:'암묵지의 정의. 형식지와 암묵지를 대비시켜 무엇을 문서화해야 하는지 보여준다.',html:`<div class="paper"><div class="kicker">개념 정의</div><div class="h2">암묵지란<br>머릿속에만 있는 판단 기준입니다</div><div class="grid2" style="margin-top:24px"><div class="card bluebg"><div class="label blue">형식지</div><div class="ctitle">이미 문서화된 기준</div><div class="cbody">매뉴얼·규정·절차서·작성 양식처럼 누가 봐도 같은 판단을 내릴 수 있도록 글로 정리된 지식입니다. 그대로 처리 기준으로 활용할 수 있습니다.</div></div><div class="card orangebg"><div class="label orange">암묵지</div><div class="ctitle">경험으로 쌓인 판단 기준</div><div class="cbody">담당자 머릿속에는 있지만 아직 문서로 정리되지 않은 기준입니다. <b>“뭐가 이상한데”</b>라는 직관이 실제로는 복잡한 규칙의 조합입니다.</div></div></div><div class="callout purple" style="margin-top:18px">AI는 형식지로만 일합니다. <b>암묵지를 문서로 꺼내야</b> AI가 같은 기준을 반복 실행할 수 있습니다.</div></div>`},
{note:'멘토 사례 A. 뉴스 선별 기준이 어떻게 처리 기준으로 정리됐는지 보여준다.',html:`<div class="paper"><div class="caseTag orange">사례 A · 언론홍보 담당자</div><div class="h2">선별 기준과 문장 규칙을<br>처리 기준으로 정리합니다</div><div class="sub" style="margin-top:14px">매일 아침 뉴스 50건을 검토해 주요 10건을 선별하고, 한 문장 요약문으로 배포하는 업무</div><div class="grid2" style="margin-top:22px"><div class="card redbg"><div class="label red">Before</div><div class="ctitle">담당자 머릿속에만 축적된 기준</div><div class="cbody">선별 기준과 문장 스타일이 한 사람에게만 쌓여 있어 누락 시 설명 책임이 발생했고, 다른 사람이 대신 작성하기 어려운 상태였습니다.</div></div><div class="card greenbg"><div class="label green">After</div><div class="ctitle">처리 기준으로 문서화</div><div class="cbody"><b>포함</b> 우리 원 언급 / R&D 예산·출연연 제도<br><b>제외</b> 동일 사안 3차 이상 후속 / 특정 정당 결부 기사<br><b>문장</b> 한 기사 = 한 문장, 매체명 위치 3변형, 종결어미 다양화</div></div></div><div class="callout blue">반복 판단 기준을 글로 옮기면 그대로 <b>스킬 설계의 입력</b>이 됩니다.</div></div>`},
{note:'사례 A의 스킬 구조. 업무 전체를 한 번에 처리하지 않고 역할별 스킬 3개로 분리했다.',html:`<div class="paper"><div class="caseTag orange">사례 A · 스킬 구조</div><div class="h2">하나의 업무를<br>3개의 스킬로 분리합니다</div><div style="margin-top:22px;display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr 24px 1fr 24px 1fr;align-items:center;gap:6px"><div style="padding:14px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-size:12.5px"><div style="color:#9ca3af;font-size:10.5px;font-weight:700;margin-bottom:4px">입력</div><b>뉴스 50건</b></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700">→</div><div style="padding:14px 8px;background:var(--orange2);border:2px solid var(--orange3);border-radius:10px;text-align:center;font-size:12.5px"><div style="color:var(--orange);font-size:10.5px;font-weight:900;margin-bottom:4px">SKILL 1</div><b><span class="mono" style="font-size:11px;padding:2px 6px">/한문장-작성</span></b><div style="font-size:11px;color:#6b7280;margin-top:4px">선별+초안</div></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700">→</div><div style="padding:14px 8px;background:var(--blue2);border:2px solid var(--blue3);border-radius:10px;text-align:center;font-size:12.5px"><div style="color:var(--blue);font-size:10.5px;font-weight:900;margin-bottom:4px">SKILL 2</div><b><span class="mono" style="font-size:11px;padding:2px 6px">/best-sentences</span></b><div style="font-size:11px;color:#6b7280;margin-top:4px">스타일 참조</div></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700">→</div><div style="padding:14px 8px;background:var(--green2);border:2px solid var(--green3);border-radius:10px;text-align:center;font-size:12.5px"><div style="color:var(--green);font-size:10.5px;font-weight:900;margin-bottom:4px">SKILL 3</div><b><span class="mono" style="font-size:11px;padding:2px 6px">/template-mail</span></b><div style="font-size:11px;color:#6b7280;margin-top:4px">메일 포맷</div></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700">→</div><div style="padding:14px 8px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;text-align:center;font-size:12.5px"><div style="color:#9ca3af;font-size:10.5px;font-weight:700;margin-bottom:4px">출력</div><b>메일링<br>완성본</b></div></div><div class="callout dark" style="margin-top:18px">업무를 단계별 스킬로 분리하면 <b>각 단계의 기준과 개선 지점</b>이 명확해집니다.</div></div>`},
{note:'멘토 사례 B. 원규 검토 시 사용하는 5가지 관점이 어떻게 스킬 구조가 되는지 보여준다.',html:`<div class="paper"><div class="caseTag blue">사례 B · 규정관리 담당자</div><div class="h2">반복 적용하는 관점을 목록화하면<br>스킬의 뼈대가 됩니다</div><div class="sub" style="margin-top:12px">원규 개정안을 5가지 관점으로 검토해 의견서 초안을 만드는 업무 — <span class="mono">/원규-검토</span></div><div style="margin-top:20px;padding:18px 22px;background:var(--blue2);border:1.5px solid var(--blue3);border-radius:14px"><div style="font-weight:850;font-size:14px;color:var(--blue);margin-bottom:12px;letter-spacing:.02em">5가지 검토 관점 — 이 항목이 곷 스킬 구조</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px"><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">1. 법적 정합성</b> — 상위 법령·지침과 충돌 없는가</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">2. 재무적 타당성</b> — 예산·비용 구조와 맞는가</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">3. 운영 실행가능성</b> — 현장에서 작동하는가</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">4. 위험 관리</b> — 허점·예외 상황 없는가</div><div style="padding:10px 14px;background:#fff;border-radius:8px;border:1px solid var(--blue3);grid-column:1/-1"><b style="color:var(--blue)">5. 전략 정합성</b> — 기관 중장기 전략과 방향이 맞는가</div></div></div><div class="callout blue" style="margin-top:18px">암묵지 형식화에서 가장 먼저 할 일은 <b>리스트화</b>입니다. 머릿속의 관점을 항목으로 꺼내는 순간, 그 자체가 스킬 구조가 됩니다.</div></div>`},
{note:'사례 B의 스킬 명세. 입력·기준·출력·사람 검토 항목을 표로 정리한다.',html:`<div class="paper"><div class="caseTag blue">사례 B · 스킬 명세</div><div class="h2">스킬 설계는<br>입력·기준·출력·사람 검토에서 시작합니다</div><table class="table" style="margin-top:22px"><tr><th>항목</th><th>내용</th><th>설계 관점</th></tr><tr><td>스킬 이름</td><td><span class="mono">/원규-검토</span></td><td>이름만 봐도 무엇을 하는지 보여야 합니다</td></tr><tr><td>입력</td><td>원규 개정안, 기존 규정, 검토 요청 배경</td><td>파일만으로는 부족합니다 — 왜 검토하는지 함께 줍니다</td></tr><tr><td>처리 기준</td><td>5가지 검토 관점 + 누락 체크 기준</td><td>이 기준이 없으면 결과물이 일반적 설명에 머봉니다</td></tr><tr><td>출력</td><td>관점별 검토 의견 초안, 보완 항목, 질문 목록</td><td>최종본이 아니라 <b>사람이 검토할 초안</b>으로 둡니다</td></tr><tr><td>사람 검토</td><td>최종 제출 전 담당자 확인 + 서명</td><td>규정과 책임이 연결된 문서는 사람 판단을 반드시 남깁니다</td></tr></table></div>`},
{note:'멘토 사례 C. 회의록 작성 기준은 정리됐으나 HWPX 포맷 제약이 남은 경우.',html:`<div class="paper"><div class="caseTag green">사례 C · 디지털인재교육팀</div><div class="h2">기준은 정리됐어도<br><span style="color:var(--green)">포맷 제약</span>은 별도로 점검해야 합니다</div><div class="sub" style="margin-top:12px">주간 회의 내용에서 결정사항·액션아이템·논의내용으로 구조화한 회의록 초안 작성</div><div class="grid2" style="margin-top:22px"><div class="card greenbg"><div class="label green">정리된 암묵지</div><div class="ctitle">회의록 작성 기준 — 문서화 완료</div><div class="cbody">참석자·안건·논의내용·결정사항·액션아이템 구조 / 결정사항과 논의사항 구분 기준 / “~하기로 했다”, “~까지 검토” 같은 패턴 감지 규칙까지 정리됐습니다.</div></div><div class="card redbg"><div class="label red">남은 제약</div><div class="ctitle">HWPX 포맷 처리</div><div class="cbody">공공기관 표준 파일 포맷이 HWPX인데, MD나 DOCS로 변환할 때 서식 보존과 재반영 단계에서 깨짐이 발생합니다. 언어 처리가 아니라 <b>포맷 처리 방식의 문제</b>입니다.</div></div></div><div class="callout dark" style="margin-top:18px">암묵지가 정리됐어도 <b>1주차에 포맷 처리 가능성을 별도 점검</b>해야 합니다. 기준 문서화와 구현 가능성은 별개입니다.</div></div>`},
{note:'사례 C의 관점 전환. 처음부터 완벽한 기준 문서를 쓰는 것이 아니라, 돌려보고 비교하면서 기준이 쌓이는 과정도 형식화다.',html:`<div class="paper"><div class="kicker">관점 전환</div><div class="h2">설계하면서<br>암묵지를 만들어가는 방식</div><div class="sub" style="margin-top:12px">처음부터 기준이 완벽하지 않아도 됩니다. 결과물을 돌려보고 비교하면서 기준을 채우는 과정 자체가 형식화입니다.</div><div style="margin-top:22px"><div class="step"><div class="num green">1</div><div><strong>일단 한 번 돌려봅니다</strong><span>작은 입력으로 결과물을 만들어 보고, 어디가 부족한지 눈으로 확인합니다.</span></div></div><div class="step"><div class="num green">2</div><div><strong>결과물을 비교하면서 기준을 끌어냅니다</strong><span>마음에 드는 결과와 그렇지 않은 결과를 나란히 두고, <b>포함·제외·표현·예외</b> 기준을 한 줄씩 적어 갑니다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>기준을 반영하고 다시 돌려봅니다</strong><span>늘어난 기준을 다음 실행에 반영하고, 같은 자리에서 막히는 부분이 있으면 거기에 기준을 한 줄 더 채웁니다.</span></div></div></div><div class="callout green" style="margin-top:6px">완벽한 기준 문서를 먼저 쓰는 것이 아니라 — <b>돌려보고 비교하면서 기준이 쌓이는 과정</b>이 곷 형식화입니다.</div></div>`},
{note:'세 사례를 한 장으로 비교한다. 수강생이 자기 사례를 어디에 대입할지 확인하게 한다.',html:`<div class="paper"><div class="kicker">사례 종합</div><div class="h2">세 사례는 서로 다른 형식화 지점을 보여줍니다</div><table class="table" style="margin-top:22px"><tr><th>사례</th><th>암묵지</th><th>스킬화 방식</th><th>다음 제출물</th></tr><tr><td><b>사례 A</b><br><span style="font-weight:600;color:var(--orange)">뉴스 선별</span></td><td>기사 선별 기준 + 문장 스타일</td><td>선별·문장 작성·메일 템플릿 3개로 분리</td><td>도메인 규칙표 + 샘플 실행 결과</td></tr><tr><td><b>사례 B</b><br><span style="font-weight:600;color:var(--blue)">원규 검토</span></td><td>머릿속에서 돌리는 5가지 관점</td><td>관점별 검토 의견 초안 자동 생성</td><td>5관점 체크리스트 + 검토 기준</td></tr><tr><td><b>사례 C</b><br><span style="font-weight:600;color:var(--green)">회의록</span></td><td>결정사항·액션아이템 분류 기준</td><td>회의록 초안 + 누락 체크</td><td>HWPX 추출 테스트 + 포맷 처리 계획</td></tr></table><div class="callout blue" style="margin-top:18px"><b>스킬 설계는 기술 기능이 아니라</b> 담당자의 판단 기준을 얼마나 명확히 정리했는가에서 출발합니다.</div></div>`},
{note:'4가지 형식화 요소. 포함·제외·우수·보완. 이것이 오후 강의의 핵심이다.',html:`<div class="paper"><div class="kicker">형식화 4요소</div><div class="h2">반복 실행 가능한 스킬을 만드는<br>4가지 필수 요소</div><div class="grid4" style="margin-top:24px"><div class="card bluebg"><div class="label blue">① 포함기준</div><div class="ctitle">YES 조건</div><div class="cbody">이 조건에 맞으면 처리합니다. 명확한 신호나 패턴으로 표현합니다.</div></div><div class="card orangebg"><div class="label orange">② 제외기준</div><div class="ctitle">NO 조건</div><div class="cbody">이 조건에 맞으면 건너뜁니다. 포함과 명백히 다른 특징으로 구분합니다.</div></div><div class="card greenbg"><div class="label green">③ 우수예시</div><div class="ctitle">⭕️ 좋은 결과 3개</div><div class="cbody">기준을 정확히 따른 결과물 3개. AI가 잘했을 때의 모습입니다.</div></div><div class="card purplebg"><div class="label purple">④ 보완예시</div><div class="ctitle">❌ 오류 + 개선안 3개</div><div class="cbody">왜 틀렸는지, 어떻게 고치면 되는지를 함께 보여줍니다.</div></div></div><div class="callout dark" style="margin-top:18px">이 4가지가 모두 갖춰지면 AI가 같은 기준을 반복 실행할 수 있습니다. <b>이것이 형식화의 목표</b>입니다.</div></div>`},
{note:'실습 안내. 수강생들이 자신의 암묵지를 4단계로 정리한다.',html:`<div class="paper"><div class="kicker">실습</div><div class="h2">내 업무의 암묵지를 4단계로 정리합니다</div><div class="sub" style="margin-top:12px">오전에 정한 문제정의를 바탕으로, 그 문제를 푸는 판단 기준을 글로 옮깁니다.</div><div class="grid2" style="margin-top:22px"><div class="card bluebg"><div class="label blue">Step 1 — 포함 기준</div><div class="cbody">내가 처리하는 데이터는 어떤 조건일 때 YES입니까? 신호 1~2개로 표현합니다.</div></div><div class="card orangebg"><div class="label orange">Step 2 — 제외 기준</div><div class="cbody">어떤 조건일 때는 처리하지 않습니까? 포함과 명백히 다른 특징을 적습니다.</div></div><div class="card greenbg"><div class="label green">Step 3 — 우수 예시 3개</div><div class="cbody">포함 기준을 정확히 따른 결과물 3개를 모읍니다. 실제 결과물이 가장 좋습니다.</div></div><div class="card purplebg"><div class="label purple">Step 4 — 보완 예시 3개</div><div class="cbody">과거 오류 사례나 경계 사례를 정리합니다. 왜 틀렸는지·어떻게 고칠지도 함께.</div></div></div><div class="callout blue">4항목이 정리되면 — 그대로 <b>스킬 변환 준비 완료</b>입니다.</div></div>`},
{note:'Claude에 암묵지를 전달하는 프롬프트 템플릿.',html:`<div class="paper"><div class="kicker">프롬프트 템플릿</div><div class="h2">Claude에 암묵지를 전달하는 프롬프트</div><div class="mono" style="margin-top:20px;white-space:pre-wrap;font-size:13px;line-height:1.7">아래 업무에 대해 Skill을 구축해 주세요.\n\n【문제정의】\n[오전에 정리한 문제정의 1문장]\n\n【포함기준】\n[YES 조건을 신호 1~2개로]\n\n【제외기준】\n[NO 조건을 포함과 명확히 구분]\n\n【우수예시】\n예시1: [입력] → [출력]\n예시2: [입력] → [출력]\n예시3: [입력] → [출력]\n\n【보완예시】\n예시1: [입력] → [현재 결과] ✗  보완: [어떻게 고칠까]\n예시2: [입력] → [현재 결과] ✗  보완: [어떻게 고칠까]\n예시3: [입력] → [현재 결과] ✗  보완: [어떻게 고칠까]\n\n요청: 위 기준으로 [입력 형태] 데이터를 [처리 방식]으로 처리하는 Skill을 작성해 주세요.</div><div class="callout blue">이 구조로 제출하면 Claude가 <b>일관된 기준으로 반복 실행</b>할 수 있는 Skill을 만듭니다.</div></div>`},
{note:'보안 체크. 민감 데이터 처리 원칙을 짧게 정리한다.',html:`<div class="paper"><div class="kicker">보안 체크</div><div class="h2">암묵지를 AI에 넘길 때<br>지켜야 할 원칙</div><div style="margin-top:22px"><div class="step"><div class="num orange">1</div><div><strong>민감 정보 마스킹</strong><span>예시 안의 고객명·금액·회사명·이메일은 <span class="mono">[고객명]</span>, <span class="mono">[금액]</span> 형태로 가립니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>샘플 범위 제한</strong><span>전체 데이터가 아니라 대표성 있는 5~10건만 사용합니다.</span></div></div><div class="step"><div class="num orange">3</div><div><strong>로컬에서 먼저 정리</strong><span>Claude에 제출하기 전 로컬 파일에서 포함·제외·예시를 검토합니다.</span></div></div><div class="step"><div class="num orange">4</div><div><strong>제출 후 결과 검증</strong><span>샘플로 먼저 검증한 뒤 본 데이터에 적용합니다. 오류 패턴은 기준 개선으로 반영합니다.</span></div></div></div><div class="callout purple">형식화는 효율을 만들지만 — <b>정보 보안도 동시에 고려</b>해야 합니다.</div></div>`},
{note:'마무리. 오전과 오후를 한 흐름으로 연결한다.',html:`<div class="paper"><div class="kicker">핵심 정리</div><div class="h2">문제정의에서 스킬까지<br>한 번에 이어지는 흐름</div><div class="grid2" style="margin-top:24px"><div class="card bluebg"><div class="label blue">오전 · 문제정의</div><div class="ctitle">입력·출력·조건·규모</div><div class="cbody">AI에게 맡길 일이 무엇인지, 범위는 얼마나 되는지를 명확히 합니다. 이것이 스킬의 <b>목표</b>입니다.</div></div><div class="card greenbg"><div class="label green">오후 · 암묵지 형식화</div><div class="ctitle">포함·제외·우수·보완</div><div class="cbody">AI가 그 일을 어떻게 판단해야 하는지 기준을 명확히 합니다. 이것이 스킬의 <b>규칙</b>입니다.</div></div></div><div class="callout dark" style="margin-top:20px">처음부터 완벽할 필요는 없습니다.<br><b style="font-size:18px">돌려보고·비교하고·기준을 채우는 반복</b>이 형식화된 암묵지를 만듭니다.</div></div>`}
];
const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
