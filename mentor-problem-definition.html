.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border-radius:22px;padding:24px;border:1px solid var(--line);background:#fff}.bluebg{background:var(--blue2);border-color:var(--blue3)}.orangebg{background:var(--orange2);border-color:var(--orange3)}.redbg{background:var(--red2);border-color:var(--red3)}.greenbg{background:var(--green2);border-color:var(--green3)}.purplebg{background:var(--purple2);border-color:var(--purple3)}.graybg{background:#f8fafc;border-color:#e2e8f0}.label{font-size:12px;font-weight:950;letter-spacing:.02em;color:#9ca3af;text-transform:uppercase;margin-bottom:10px}.label.orange{color:var(--orange)}.label.blue{color:var(--blue)}.label.red{color:var(--red)}.label.green{color:var(--green)}.label.purple{color:var(--purple)}.ctitle{font-size:20px;font-weight:950;letter-spacing:-.035em;line-height:1.32;margin-bottom:10px}.cbody{font-size:15px;color:#6b7280;line-height:1.72}.cbody b{color:#111827}.callout{border-radius:20px;padding:19px 23px;margin-top:18px;font-size:17px;line-height:1.65;font-weight:760}.callout.orange{background:var(--orange2);border:1px solid var(--orange3);color:#9a3412}.callout.blue{background:var(--blue2);border:1px solid var(--blue3);color:#1d4ed8}.callout.green{background:var(--green2);border:1px solid var(--green3);color:#047857}.callout.purple{background:var(--purple2);border:1px solid var(--purple3);color:#5b21b6}.callout.dark{background:#111827;color:#fff}.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;padding:8px 15px;font-size:14px;font-weight:850;color:#6b7280}.pill.orange{background:var(--orange2);border-color:var(--orange3);color:var(--orange)}.pill.blue{background:var(--blue2);border-color:var(--blue3);color:var(--blue)}.pill.green{background:var(--green2);border-color:var(--green3);color:va .step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px;border-radius:18px;border:1px solid var(--line);background:#fff;margin-bottom:12px}.num{width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.num.red{background:var(--red)}.num.orange{background:var(--orange)}.num.green{background:var(--green)}.num.purple{background:var(--purple)}.step strong{display:block;font-size:15.5px;letter-spacing:-.035em;margin-bottom:3px}.step span{font-size:13.5px;color:#6b7280;line-height:1.6}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.table th{background:#f8fafc;font-size:13px;color:#6b7280;text-align:left;padding:14px 16px}.table td{padding:15px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.65;vertical-align:top}.table td:first-child{font-weight:900;color:#111827}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7;color:#374151}.bigquote{font-size:30px;line-height:1.45;letter-spacing:-.055em;font-weight:950;text-align:center;color:#111827}.arrow{font-size:24px;color:#cbd5e1;font-weight:950;display:flex;align-items:center;justify-content:center}.caseTag{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:18px}.caseTag.red{background:var(--red2);color:var(--red);border:1px solid var(--red3)}.caseTag.orange{background:var(--orange2);color:var(--orange);border:1px solid var(--orange3)}.caseTag.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}.caseTag.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}.twoflow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.notes{position:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}

/* Design-system alignment: KITECH 운영용 강의자료 톤 */
:root{
  --bg:#fafaf9;--paper:#fff;--ink:#2c2c2c;--text:#2c2c2c;--muted:#6b6b6b;--sub:#8a8a8a;
  --blue:#2563eb;--blue2:rgba(37,99,235,.08);--blue3:rgba(37,99,235,.25);
  --orange:#b45309;--orange2:rgba(180,83,9,.08);--orange3:rgba(180,83,9,.22);
  --red:#b91c1c;--red2:rgba(185,28,28,.07);--red3:rgba(185,28,28,.22);

<body>
<header class="topbar">
  <span class="badge">멘토 사례 <span class="badge-dot">1</span></span>
  <span class="tb-title">문제 좁히기 사례 워크숍</span>
  <span class="tb-meta">10:40–10:50 · 발표 이유진 멘토</span>
  <span class="spacer"></span>
  <span class="counter"><span id="cur">1</span> / <span id="tot">16</span></span>
  <button class="btn" id="noteBtn">발표 노트</button>
</header>
<div class="progress"><div id="bar"></div></div>
<main class="stage" id="stage"></main>
<button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button>
<div class="dots" id="dots"></div>
<div class="notes" id="notes"><b>발표 노트</b><br><span id="noteText"></span></div>
<script>
const SLIDES=[
{note:'1. 표지 — 강의자 톤. 멘티 3명 사례, 세 가지 막힌 지점, 강의 목표.',html:`<div class="paper"><div class="kicker">Problem Definition · Mentor Feedback</div><div class="h1">잘된 사례와 아쉬운 사례로 보는<br><span class="hl">문제정의 코칭</span></div><div class="sub" style="margin-top:14px">이번 파트에서는 멘티 3명의 사례를 통해<br>문제정의를 어떻게 바라보고, 어디서부터 고쳐야 하는지를 함께 봅니다.<br><br>세 사례는 각각 다른 지점에서 막혀 있었습니다.</div><div style="margin-top:18px;padding:14px 18px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px;font-size:14.5px;color:#374151;line-height:1.8"><b style="color:var(--red)">·</b> 결과물 이름이 먼저 정해져 진짜 문제가 흐려진 사례<br><b style="color:var(--orange)">·</b> 하고 싶은 범위가 너무 커서 첫 실행 단위가 보이지 않은 사례<br><b style="color:var(--green)">·</b> 입력·출력·조건·규모가 비교적 잘 잡혀 있던 사례</div><div class="callout dark" style="margin-top:14px">중요한 건 사례를 외우는 게 아닙니다. 멘토가 어떤 기준으로 문제를 다시 짚었는지, 그 기준을 내 과제에 어떻게 적용할 수 있는지를 봅니다.</div></div>`},
{note:'2. Today Flow — 세 사례 순서 안내.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">오늘은 세 가지 사례를 순서대로 봅니다</div><div style="margin-top:18px"><div class="step"><div class="num red">1</div><div><strong>아쉬운 사례 A — 결과물 이름이 문제정의를 흔든 사례</strong><span>"챗봇을 만들겠다"는 결과물 이름이 먼저 나오면서 풀어야 할 진짜 문제가 가려진 경우입니다. 멘토가 "정말 필요한 게 챗봇인가, 아니면 누적 문의 데이터를 먼저 분석해야 하는가"를 다시 짚어준 사례를 봅니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>아쉬운 사례 B — 범위가 너무 커서 첫 실행이 어려웠던 사례</strong><span>수집·분류·트렌드 분석·매칭·제안서 작성까지 전체 흐름을 한 번에 자동화하려 한 경우입니다. 방향은 맞지만 첫 주에 무엇을 실행해야 하는지가 보이지 않았습니다. 전체 흐름은 유지하되, 이번 주에 검증할 단계를 하나로 좁히는 멘토 피드백을 봅니다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>잘된 사례 C — 입력과 출력이 분명했던 사례</strong><span>입력·출력·판단 기준·실행 규모가 상대적으로 명확했던 사례입니다. 이 경우는 문제정의를 더 키울 게 아니라 "이제 어떤 기준으로 성공을 판단할 것인가"로 넘어가야 합니다.</span></div></div></div><div class="callout dark" style="margin-top:14px">오늘의 목표는 세 사례 비교가 아닙니다. 내 과제가 지금 어디서 막혀 있는지, 다음에 무엇을 제출해야 할지 — 그 판단 기준을 잡는 것입니다.</div></div>`},
{note:'3. 문제정의 3유형 카드.',html:`<div class="paper"><div class="kicker">문제정의 유형</div><div class="h2">반복해서 나타나는 문제정의 오류는 <span class="hl">크게 3가지</span>입니다</div><div class="grid3" style="margin-top:18px"><div class="card redbg"><div class="label red">Type A</div><div class="ctitle">결과물 이름이 먼저 나온 경우</div><div class="cbody">"챗봇을 만들겠다", "대시보드를 만들겠다", "제안서를 만들겠다"처럼 결과물 이름이 먼저 나오면 진짜 문제가 가려질 수 있습니다. 한 발 물러서서 — 지금 필요한 것이 정말 챗봇인지, 아니면 데이터를 읽고 반복 패턴을 정리하는 일인지부터 다시 봐야 합니다.</div></div><div class="card orangebg"><div class="label orange">Type B</div><div class="ctitle">범위가 너무 넓은 경우</div><div class="cbody">전체 업무 흐름을 한 번에 자동화하려 하면 첫 실행 단위가 보이지 않습니다. 모두 중요해 보여도 — 이번 주에 검증할 것은 하나만 골라야 합니다. 전체 그림은 유지하되, 첫 실행 단위는 작게 분리하는 게 핵심입니다.</div></div><div class="card greenbg"><div class="label green">⭐ Type C</div><div class="ctitle">바로 파일럿이 가능한 경우</div><div class="cbody">입력·출력·조건·규모가 한 문장씩 설명된다면 문제정의는 꽤 잘 잡힌 상태입니다. 더 큰 기획을 붙이기보다 — 샘플을 돌려보고 성공 기준을 정하는 쪽으로 넘어가야 합니다.</div></div></div><div class="callout dark" style="margin-top:14px">이번 강의에서 볼 세 사례는 <b>Type A → Type B → Type C 순서</b>로 이어집니다.</div></div>`},
{note:'4. 3유형 비교 표.',html:`<div class="paper"><div class="kicker">유형 비교</div><div class="h2">세 유형은 <span class="hl">막힌 지점</span>이 다릅니다</div><table class="table" style="margin-top:14px"><tr><th>구분</th><th><span style="color:var(--red)">Type A</span><br>결과물 이름 왜곡</th><th><span style="color:var(--orange)">Type B</span><br>범위 과잉</th><th><span style="color:var(--green)">⭐ Type C</span><br>실행 가능</th></tr><tr><td>대표 사례</td><td>멘티 A</td><td>멘티 B</td><td>멘티 C</td></tr><tr><td>막힌 지점</td><td>결과물 이름이 문제정의를 끌고 감</td><td>전체 범위가 커서 첫 실행 단위가 안 보임</td><td>구조는 잡혔지만 검증 기준이 부족</td></tr><tr><td>멘토 피드백</td><td>챗봇이 아니라 LLM 분석으로 다시 보기</td><td>5단계 중 1단계만 먼저 실행</td><td>파일럿 성공 기준 하나 정하기</td></tr><tr><td>다음 제출물</td><td>문의 유형 분류 기준표, 반복 패턴 리포트</td><td>주제별 분류표, 샘플 실행 로그</td><td>샘플 실행 결과, 성공 지표</td></tr></table><div class="callout dark" style="margin-top:14px">Type A·B는 실패 사례가 아닙니다. 아직 문제정의가 덜 좁혀진 상태일 뿐입니다 — 멘토 피드백대로 보강하면 충분히 Type C로 넘어갑니다.</div></div>`},
{note:'5. 멘티 A — 결과물 이름이 문제정의를 가린 사례.',html:`<div class="paper"><div class="caseTag red">아쉬운 사례 1 · 멘티 A</div><div class="h2">결과물 이름이 먼저 정해지면<br><span style="color:var(--red)">진짜 문제가 가려집니다</span></div><div class="grid2" style="margin-top:18px"><div class="card redbg"><div class="label red">처음 접근</div><div class="ctitle">"헬프데스크 문의에 답하는 챗봇을 만들겠다"</div><div class="cbody">챗봇이라는 이름이 먼저 나오면 자연스럽게 FAQ 설계, 답변 정책, 예외 응대 기준을 먼저 생각하게 됩니다. 문제는 — 이 단계에서 아직 "무엇을 답해야 하는지"가 정리되지 않았다는 점입니다.</div></div><div class="card greenbg"><div class="label green">멘토가 다시 본 진짜 문제</div><div class="ctitle">먼저 누적 문의 데이터를 본다</div><div class="cbody">반복적으로 들어오는 문의는 무엇인지, 어떤 유형이 많은지, 어떤 문의가 처리 시간을 잡아먹는지 — 이걸 먼저 확인해야 했습니다. 그래서 1차 산출물은 자동 답변 챗봇이 아니라 <b>문의 유형 분석표</b>가 됩니다.</div></div></div><div class="callout dark" style="margin-top:14px">결과물 이름이 먼저 나왔을 때는 바로 구현으로 들어가지 않습니다. "이 업무에 쌓인 데이터는 무엇인가? 그 안에 반복되는 패턴이 있는가?" — 이 질문부터 다시 확인합니다.</div></div>`},
{note:'6. 멘티 A — ChatBot vs LLM 분석 시작 질문 차이.',html:`<div class="paper"><div class="caseTag red">아쉬운 사례 1 · 설계 구분</div><div class="h2">챗봇과 LLM 분석은 <span class="hl">시작 질문</span>이 다릅니다</div><table class="table" style="margin-top:14px"><tr><th>구분</th><th>챗봇으로 접근할 때</th><th>LLM 분석으로 접근할 때</th></tr><tr><td>핵심 질문</td><td>사용자 질문에 무엇을 답할 것인가</td><td>누적 데이터에 어떤 패턴이 있는가</td></tr><tr><td>먼저 필요한 것</td><td>FAQ, 답변 정책, 예외 응대 기준</td><td>분류 기준, 빈도 기준, 처리 시간 기준</td></tr><tr><td>첫 산출물</td><td>답변 시나리오</td><td>반복 문의 Top N 분석표</td></tr><tr><td>첫 스킬</td><td>자동 답변 생성</td><td><span class="mono">문의 유형 분류</span></td></tr></table><div class="callout dark" style="margin-top:14px">챗봇은 사용자와 대화하는 화면·접점에 가깝고, LLM 분석은 데이터를 읽고 분류·요약하는 처리 방식입니다. 둘은 같은 게 아닙니다 — 이 사례에서는 답변보다 <b>반복 패턴 찾기가 더 앞단의 과제</b>였습니다.</div></div>`},
{note:'7. 참고 — ChatBot vs LLM 설계 층위.',html:`<div class="paper"><div class="caseTag red">참고 · ChatBot vs LLM</div><div class="h2">챗봇과 LLM은 <span class="hl">설계 층위</span>가 다릅니다</div><div class="grid2" style="margin-top:18px"><div class="card orangebg"><div class="label orange">ChatBot</div><div class="ctitle">사용자와 대화하는 인터페이스</div><div class="cbody">웹사이트·앱·메신저 안에서 사용자의 질문을 받고 답변하는 접점입니다. 규칙 기반으로도, 검색 기반으로도, LLM을 붙여서도 만들 수 있습니다.</div></div><div class="card bluebg"><div class="label blue">LLM</div><div class="ctitle">자연어를 읽고 생성하는 모델</div><div class="cbody">꼭 챗봇 형태로 쓰지 않아도 됩니다. 문의 분류, 문서 요약, 보고서 초안, 반복 패턴 분석에도 사용할 수 있습니다.</div></div></div><table class="table" style="margin-top:14px"><tr><th>구분</th><th>챗봇</th><th>LLM</th></tr><tr><td>무엇인가</td><td>사용자 대화 인터페이스</td><td>자연어를 처리하는 모델</td></tr><tr><td>꼭 함께 써야 하나</td><td>아닙니다</td><td>아닙니다</td></tr><tr><td>적합한 첫 질문</td><td>사용자에게 무엇을 답할까?</td><td>이 데이터를 어떻게 분류·분석할까?</td></tr></table><div class="callout dark" style="margin-top:14px">챗봇을 만들지 않아도 — LLM으로 분류·요약·분석은 충분히 됩니다.</div></div>`},
{note:'8. 멘티 B — 5단계를 한꺼번에 자동화하려다 막힌 사례.',html:`<div class="paper"><div class="caseTag orange">아쉬운 사례 2 · 멘티 B</div><div class="h2">전체를 한 번에 자동화하면<br><span style="color:var(--orange)">첫 실행 단위가 흐려집니다</span></div><div class="sub" style="margin-top:12px">멘티 B의 처음 흐름은 <b>수집 → 분류 → 트렌드 분석 → 매칭 → 제안서 작성</b>이었습니다.</div><div style="margin-top:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center"><div style="padding:11px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:9px;font-size:13px;font-weight:700;color:var(--orange)">① 수집</div><div style="padding:11px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:9px;font-size:13px;font-weight:700;color:var(--orange)">② 분류</div><div style="padding:11px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:9px;font-size:13px;font-weight:700;color:var(--orange)">③ 트렌드</div><div style="padding:11px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:9px;font-size:13px;font-weight:700;color:var(--orange)">④ 매칭</div><div style="padding:11px 6px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:9px;font-size:13px;font-weight:700;color:var(--orange)">⑤ 제안서</div></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700;margin:8px 0">↓ 멘토 조정 — 분류 하나만 먼저</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center"><div style="padding:11px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;font-size:13px;color:#9ca3af">① 수집</div><div style="padding:11px 6px;background:var(--blue2);border:2px solid var(--blue3);border-radius:9px;font-size:13px;font-weight:900;color:var(--blue)">② 분류 ★<br><span style="font-size:11px;font-weight:500">첫 실행</span></div><div style="padding:11px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;font-size:13px;color:#9ca3af">③ 트렌드</div><div style="padding:11px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;font-size:13px;color:#9ca3af">④ 매칭</div><div style="padding:11px 6px;background:#f8fafc;border:1.5px solid var(--line);border-radius:9px;font-size:13px;color:#9ca3af">⑤ 제안서</div></div><div class="callout dark" style="margin-top:14px">최종 목표가 제안서까지 가는 건 괜찮습니다. 다만 — 이번 주에 검증할 단계는 <b>분류 하나뿐</b>입니다. 분류가 안정적으로 되어야 그 다음 트렌드·매칭도 의미가 생깁니다.</div></div>`},
{note:'9. 멘티 B — 범위 조정 방식.',html:`<div class="paper"><div class="caseTag orange">아쉬운 사례 2 · 범위 조정</div><div class="h2">전체 흐름은 유지하되<br><span class="hl">이번 주 실행 단위는 하나만</span> 남깁니다</div><div class="grid2" style="margin-top:18px"><div class="card orangebg"><div class="label orange">전체 흐름</div><div class="ctitle">수집 → 분류 → 트렌드 → 매칭 → 제안서</div><div class="cbody">흐름 자체는 좋습니다. 다만 단계마다 필요한 기준이 다릅니다 — 수집·분류·트렌드 판단·매칭·제안서 구성 기준이 모두 달라서, 한 번에 돌리면 중간에 기준이 계속 흔들립니다.</div></div><div class="card bluebg"><div class="label blue">이번 주 실행 단위</div><div class="ctitle"><span class="mono">주제별 분류</span></div><div class="cbody"><b>입력</b> 교육 신청 엑셀, 직군 매핑표<br><b>출력</b> 직군별 주제 랭킹<br><b>기준</b> 분류 조건 5개 이내<br>이렇게 좁혀야 30분 안에 샘플 실행이 됩니다.</div></div></div><div style="margin-top:14px;padding:14px 18px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px"><div style="font-weight:700;font-size:14px;color:#111827;margin-bottom:8px">범위 조정 체크</div><div style="display:grid;gap:6px;font-size:13.5px;color:#4b5563"><div>✓ 이번 주에 검증할 단계가 하나로 정해졌는가?</div><div>✓ 그 단계의 입력과 출력이 파일 단위로 보이는가?</div><div>✓ 30분 안에 샘플 실행이 가능한가?</div></div></div></div>`},
{note:'10. 멘티 C — Input/Output/Condition/Scale.',html:`<div class="paper"><div class="caseTag green">잘된 사례 · 멘티 C</div><div class="h2">잘된 문제정의는<br>입력·출력·조건·규모가 <span class="hl">분명합니다</span></div><div class="grid4" style="margin-top:18px"><div class="card greenbg"><div class="label green">INPUT</div><div class="ctitle">무엇을 넣을 것인가</div><div class="cbody">처리에 사용할 자료가 분명했습니다. 파일·표·텍스트처럼 <b>시작점이 눈에 보이는 상태</b>였습니다.</div></div><div class="card greenbg"><div class="label green">OUTPUT</div><div class="ctitle">무엇을 뽑을 것인가</div><div class="cbody">결과물 형태도 분명했습니다. 보고서·표·초안·체크리스트처럼 <b>무엇이 나와야 하는지</b> 설명할 수 있었습니다.</div></div><div class="card greenbg"><div class="label green">CONDITION</div><div class="ctitle">어떤 기준으로</div><div class="cbody">분류 기준·판단 조건이 어느 정도 정리되어 있었습니다 — 즉, <b>사람이 먼저 기준을 설명할 수 있는 상태</b>였습니다.</div></div><div class="card greenbg"><div class="label green">SCALE</div><div class="ctitle">어느 정도 규모</div><div class="cbody">처음부터 전체를 돌리는 게 아니라 <b>샘플 몇 건으로 테스트할지</b>를 정할 수 있었습니다.</div></div></div><div class="callout dark" style="margin-top:14px">네 가지가 갖춰지면 — 문제정의를 더 붙잡고 있을 필요가 없습니다. 이제는 파일럿을 돌리고, 어떤 기준으로 성공 여부를 볼지 정해야 합니다.</div></div>`},
{note:'11. 멘티 C — 멘토 피드백 (확장이 아니라 검증 기준).',html:`<div class="paper"><div class="caseTag green">잘된 사례 · 멘토 피드백</div><div class="h2">잘된 사례에는 <span class="hl">확장이 아니라 검증 기준</span>이 필요합니다</div><table class="table" style="margin-top:14px"><tr><th>검토 항목</th><th>판단</th><th>다음 방향</th></tr><tr><td>문제정의</td><td>업무 장면과 반복성이 잘 보임</td><td>문장은 짧게 고정</td></tr><tr><td>업무 구조</td><td>입력과 출력이 자연스럽게 연결됨</td><td>중간 처리 기준은 표 한 장으로 정리</td></tr><tr><td>AI 적용</td><td>초안 생성·분류에 바로 적용 가능</td><td>샘플 10건으로 1차 실행</td></tr><tr><td>검증 기준</td><td>아직 성공 기준이 부족</td><td>정확도 / 수정 횟수 / 시간 단축 중 1개 선택</td></tr></table><div style="margin-top:14px;padding:14px 18px;background:var(--green2);border:1.5px solid var(--green3);border-radius:10px;font-size:14px;color:#111827;line-height:1.7"><b>잘된 사례라고 해서 더 크게 만들 필요는 없습니다.</b> 이 단계에서 과제를 키우면 다시 흐려집니다. 필요한 건 하나 — "이 파일럿이 잘 됐다고 판단할 기준은 무엇인가?" 예를 들어, 분류 정확도 80% 이상 / 수정 횟수 감소 / 정리 시간 단축 — 이 중 하나만 정해도 다음 단계로 넘어갈 수 있습니다.</div></div>`},
{note:'12. 사례 종합.',html:`<div class="paper"><div class="kicker">사례 종합</div><div class="h2">세 사례는 <span class="hl">서로 다른 지점</span>에서 막혀 있었습니다</div><table class="table" style="margin-top:14px"><tr><th>이름</th><th>막힌 지점</th><th>멘토 피드백</th><th>다음 제출물</th></tr><tr><td>멘티 A</td><td>결과물 이름이 문제정의를 끌고 감</td><td>챗봇이 아니라 LLM 분석으로 다시 정의</td><td>문의 유형 분류 기준표, 반복 패턴 리포트</td></tr><tr><td>멘티 B</td><td>범위가 커서 첫 실행 단위가 안 보임</td><td>5단계 중 분류 하나만 먼저</td><td>주제별 분류표, 샘플 실행 로그</td></tr><tr><td>멘티 C</td><td>구조는 좋지만 검증 기준이 부족</td><td>파일럿 성공 기준 하나 설정</td><td>샘플 실행 결과, 성공 지표</td></tr></table><div class="callout dark" style="margin-top:14px">내 과제가 어느 칸에 가까운지 보면 다음 행동이 정해집니다 — 결과물 이름이 먼저 나왔다면 문제부터 다시, 범위가 너무 넓다면 첫 단계 하나만, 구조가 잡혔다면 성공 기준을.</div></div>`},
{note:'13. 문제정의 4요소.',html:`<div class="paper"><div class="kicker">문제정의 4요소</div><div class="h2">잘된 문제정의는<br>네 가지가 <span class="hl">한 문장씩</span> 나옵니다</div><div class="grid2" style="margin-top:18px;gap:12px"><div class="card bluebg"><div class="label blue">① 입력 — 무엇을 넣는가</div><div class="cbody">처리에 사용할 자료입니다. 시작점이 보여야 합니다.<br><span style="color:#9ca3af;font-size:13px">예: "최근 3개월간 접수된 헬프데스크 문의 내역"</span></div></div><div class="card orangebg"><div class="label orange">② 출력 — 무엇을 뽑는가</div><div class="cbody">AI를 통해 얻고 싶은 결과 형태입니다.<br><span style="color:#9ca3af;font-size:13px">예: "반복 문의 유형별 Top 10 분류표"</span></div></div><div class="card greenbg"><div class="label green">③ 조건 — 어떤 기준으로</div><div class="cbody">분류·요약·추천에 적용할 기준입니다. <b>사람이 먼저 설명할 수 있어야</b> 합니다.<br><span style="color:#9ca3af;font-size:13px">예: "문의 목적·처리 부서·긴급도 기준으로 분류한다"</span></div></div><div class="card purplebg"><div class="label purple">④ 규모 — 얼마나 돌릴지</div><div class="cbody">전체가 아니라 샘플·파일럿 범위를 먼저 정합니다.<br><span style="color:#9ca3af;font-size:13px">예: "문의 30건으로 1차 테스트한다"</span></div></div></div><div class="callout dark" style="margin-top:14px">네 가지가 한 문장씩 나오면 — 문제정의는 일단 끝났다고 봐도 됩니다. 그 다음은 구현이 아니라 <b>검증 기준</b>입니다.</div></div>`},
{note:'14. 문제정의의 본질 — 결과물 이름이 아니라 반복 병목.',html:`<div class="paper" style="text-align:center"><div class="kicker" style="text-align:center">문제정의의 본질</div><div class="bigquote" style="margin-top:10px">결과물 이름을 먼저 정한다고<br>문제가 풀리지는 않습니다.</div><div style="margin-top:18px;font-size:15.5px;color:#4b5563;line-height:1.75;font-weight:600;max-width:780px;margin-left:auto;margin-right:auto">"챗봇을 만들자", "대시보드를 만들자", "제안서를 자동화하자" — 이런 말은 문제정의라기보다 <b>결과물 이름</b>에 가깝습니다.<br>진짜 문제정의는 <b style="color:#111827">반복되는 상황과 병목</b>을 정확히 짚는 것입니다.</div><div class="grid2" style="margin-top:22px"><div class="card redbg"><div class="label red">잘못 잡힌 방향</div><div class="ctitle">"챗봇 만들기"</div><div class="cbody">FAQ·답변 정책·예외 응대부터 설계하게 됩니다. 정작 어떤 질문이 반복되는지 모르면, 챗봇이 무엇을 답해야 하는지도 정하기 어렵습니다.</div></div><div class="card greenbg"><div class="label green">다시 잡은 방향</div><div class="ctitle">"문의 유형 분석"</div><div class="cbody">먼저 반복 문의의 빈도·유형을 확인합니다. 답변 기준은 그 뒤에 만들고, 필요하면 그 다음에 챗봇으로 확장할 수 있습니다.</div></div></div><div class="callout dark" style="margin-top:14px">잘못된 문제정의 위에서는 좋은 데이터·좋은 AI도 제대로 작동하지 않습니다. 초반에는 <b>"무엇을 만들까?"보다 "무엇이 반복해서 문제인가?"</b>를 먼저 봅니다.</div></div>`},
{note:'15. 초반 점검법 3가지.',html:`<div class="paper"><div class="kicker">초반 문제정의 점검법</div><div class="h2">이 세 가지만 순서대로 확인해도<br><span class="hl">대부분의 오류</span>는 잡힙니다</div><div style="margin-top:18px"><div class="step"><div class="num red">1</div><div><strong>결과물 이름부터 적었는가?</strong><span>챗봇·대시보드·제안서처럼 결과물 이름이 먼저 나왔다면 잠깐 멈춥니다. 그 이름이 진짜 문제를 설명하는지, 아니면 해결책을 너무 빨리 정해버린 것인지 — 데이터와 반복 패턴부터 다시 확인합니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>처리 단계가 4개 이상인가?</strong><span>수집·분류·분석·매칭·작성처럼 단계가 많다면, 이번 주에 검증할 단계 하나만 남깁니다. 전체 흐름을 버리라는 게 아닙니다 — 첫 실행은 작아야 검증이 됩니다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>입력·출력·조건·규모가 한 문장씩 나오는가?</strong><span>네 가지가 명확하다면 문제정의는 잘 잡힌 상태입니다. 더 설명을 붙이기보다 — 샘플을 돌리고 성공 기준을 정합니다. 정확도·수정 횟수·시간 단축 중 하나만 잡아도 충분합니다.</span></div></div></div><div class="callout dark" style="margin-top:14px">정리하면 순서는 — <b>문제정의 → 범위 조정 → 검증 기준</b>입니다. 앞 단계가 흔들리면 뒤 단계는 자동으로 무너집니다.</div></div>`},
{note:'16. 실습 — 3문장으로 다시 쓰기.',html:`<div class="paper"><div class="kicker">실습</div><div class="h2">내 과제를 <span class="hl">3문장</span>으로 다시 써봅니다</div><div class="grid3" style="margin-top:18px"><div class="card orangebg"><div class="label orange">문장 1 — 문제정의</div><div class="cbody">누가, 언제, 어떤 반복 상황에서 시간을 쓰고 있는지 씁니다.<br><br><span style="color:#9ca3af;font-size:12.5px">예: "담당자는 매주 월요일마다 여러 프로젝트의 진행 상황을 취합하느라 2시간 이상을 사용한다."</span></div></div><div class="card bluebg"><div class="label blue">문장 2 — 첫 스킬</div><div class="cbody">이번 주에 검증할 입력과 출력을 파일 단위로 씁니다.<br><br><span style="color:#9ca3af;font-size:12.5px">예: "회의록과 업무 메모를 입력으로 넣고, 프로젝트별 완료·블로커·다음 액션을 뽑는 스킬을 테스트한다."</span></div></div><div class="card greenbg"><div class="label green">문장 3 — 다음 제출물</div><div class="cbody">이번 주 안에 가져올 결과물을 씁니다.<br><br><span style="color:#9ca3af;font-size:12.5px">예: "샘플 5건 실행 결과, 수정 전후 비교표, 개선 기준 1개."</span></div></div></div><div class="callout dark" style="margin-top:14px">3문장이 채워지지 않는다면 — 아직 구현보다 범위 조정이 먼저입니다.</div></div>`},
{note:'17. 점검 프롬프트 — 복붙용.',html:`<div class="paper" style="padding:24px 36px"><div class="kicker">점검 프롬프트</div><div class="h2" style="font-size:24px">과제 점검 프롬프트</div><div class="mono" style="margin-top:12px;white-space:pre-wrap;font-size:12px;line-height:1.65;padding:12px 14px">아래 과제를 보고 현재 병목 유형을 분류해 주세요.

유형은 3가지입니다.
1. 결과물 이름이 먼저 나와 문제정의가 흐려진 경우
2. 범위가 너무 넓어 첫 실행 단위가 보이지 않는 경우
3. 입력·출력·조건·규모가 정리되어 파일럿이 가능한 경우

다음 3가지를 제안해 주세요.
- 수정이 필요한 문제정의 문장 1개
- 이번 주에 검증할 첫 스킬 이름 1개
- 다음 제출물 3개 이내

[내 과제]
여기에 본인 과제를 입력하세요.</div><div class="callout dark" style="margin-top:12px;padding:12px 16px;font-size:13.5px">이 프롬프트의 목적은 과제를 더 멋지게 포장하는 게 아닙니다 — 이번 주 안에 실제로 테스트할 수 있는 첫 단위로 좁히는 것입니다.</div></div>`},
{note:"18. MENTOR'S CASE ① — 1인 기업의 8개 역할.",html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ① · 1인 기업의 현실</div><div class="h2"><span class="hl">1인 기업</span>은 모든 일을 혼자 굴려야 합니다</div><div class="sub" style="margin-top:10px">프리랜서 PM은 영업·기획·실행·관리·정산까지 거의 모든 일을 혼자 처리합니다. 자동화하고 싶은 영역도 자연스럽게 많아집니다.</div><table class="table" style="margin-top:14px;font-size:13.5px"><tr><th style="padding:10px 12px">단계</th><th style="padding:10px 12px">역할</th><th style="padding:10px 12px">주요 업무</th><th style="padding:10px 12px">시간 비중</th></tr><tr><td style="padding:9px 12px"><b style="color:var(--orange)">시작</b></td><td style="padding:9px 12px">영업·제안</td><td style="padding:9px 12px">잠재 클라이언트 미팅, 제안서 초안, 견적 산정</td><td style="padding:9px 12px">월 20%</td></tr><tr><td style="padding:9px 12px"><b style="color:var(--orange)">계약</b></td><td style="padding:9px 12px">기획·계약</td><td style="padding:9px 12px">스코프 정의, WBS, 계약서 검토, 일정 수립</td><td style="padding:9px 12px">프로젝트당 1주</td></tr><tr><td style="padding:9px 12px"><b style="color:var(--blue)">진행</b></td><td style="padding:9px 12px">클라이언트 미팅</td><td style="padding:9px 12px">주간 싱크, 의사결정 요청, 변경 대응</td><td style="padding:9px 12px">주 5~8시간</td></tr><tr style="background:var(--green2)"><td style="padding:9px 12px"><b style="color:var(--green)">⭐ 진행</b></td><td style="padding:9px 12px"><b>주간 진행 관리</b></td><td style="padding:9px 12px">5~10개 프로젝트 상태 정리, 블로커·다음 액션 정리</td><td style="padding:9px 12px"><b>주 2시간 고정</b></td></tr><tr><td style="padding:9px 12px"><b style="color:var(--blue)">실행</b></td><td style="padding:9px 12px">산출물 작업</td><td style="padding:9px 12px">결과물 제작, 리뷰, 수정 반영</td><td style="padding:9px 12px">대부분</td></tr><tr><td style="padding:9px 12px"><b style="color:var(--purple)">관리</b></td><td style="padding:9px 12px">일정·캘린더</td><td style="padding:9px 12px">미팅 조율, 마감 추적, 우선순위 조정</td><td style="padding:9px 12px">주 1시간</td></tr><tr><td style="padding:9px 12px"><b style="color:var(--purple)">대응</b></td><td style="padding:9px 12px">CS·이슈</td><td style="padding:9px 12px">변경 요청, 컴플레인, 긴급 대응</td><td style="padding:9px 12px">불규칙</td></tr><tr><td style="padding:9px 12px"><b style="color:#6b7280">마감</b></td><td style="padding:9px 12px">정산·세금</td><td style="padding:9px 12px">세금계산서, 입금 확인, 종합소득세 자료 정리</td><td style="padding:9px 12px">월 1회</td></tr></table><div class="callout dark" style="margin-top:14px">처음에는 8개를 모두 자동화하고 싶었습니다. 그런데 그렇게 접근하니 6주 동안 방향만 다섯 번 바꿨고 — 결국 어느 것도 안정적으로 작동하지 않았습니다. <b>"다 자동화하자"가 아니라 "이번에 하나만 제대로 하자"</b>로 바꿔야 했습니다.</div></div>`},
{note:"19. MENTOR'S CASE ② — 매트릭스로 1순위 좁히기.",html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ② · 1순위 고르기</div><div class="h2">8개를 한 번에 할 수 없다면 — <span class="hl">하나만 고릅니다</span></div><div class="sub" style="margin-top:10px">하고 싶은 것부터가 아니라 — 임팩트·현실가능성·기준 명확성을 같이 봅니다.</div><div style="margin-top:18px;display:grid;grid-template-columns:84px 1fr 1fr;gap:8px;font-size:13px"><div></div><div style="text-align:center;color:#9ca3af;font-weight:900;font-size:12px;padding-bottom:4px">현실가능성 낮음</div><div style="text-align:center;color:var(--green);font-weight:900;font-size:12px;padding-bottom:4px">현실가능성 높음</div><div style="display:flex;align-items:center;justify-content:center;color:var(--orange);font-weight:900;font-size:12px;writing-mode:vertical-rl;text-orientation:mixed">임팩트 高</div><div class="card orangebg" style="padding:13px 14px;min-height:96px"><div class="label orange">대기 — 기준화 먼저</div><div class="cbody" style="font-size:12.5px;line-height:1.6">• 영업·제안<br>• 기획·견적<br>• CS 대응</div></div><div class="card greenbg" style="padding:13px 14px;min-height:96px;border-width:2px;position:relative"><div style="position:absolute;top:-10px;right:10px;background:var(--orange);color:#fff;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:900">⭐ 1순위</div><div class="label green">즉시 실행</div><div class="cbody" style="font-size:12.5px;line-height:1.6"><b>주간 진행 관리</b><br>일정·캘린더 정리</div></div><div style="display:flex;align-items:center;justify-content:center;color:#9ca3af;font-weight:900;font-size:12px;writing-mode:vertical-rl;text-orientation:mixed">임팩트 低</div><div class="card graybg" style="padding:13px 14px;min-height:96px"><div class="label">보류</div><div class="cbody" style="font-size:12.5px;line-height:1.6">• 네트워킹 메모<br>• 자기계발 자료</div></div><div class="card graybg" style="padding:13px 14px;min-height:96px"><div class="label">잉여 시간에</div><div class="cbody" style="font-size:12.5px;line-height:1.6">• 정산·세금 (월 1회)<br>• 계약서 양식</div></div></div><div style="margin-top:14px;padding:14px 18px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:12px"><div class="label orange" style="margin-bottom:8px">왜 "주간 진행 관리"가 1순위였나</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;font-size:13.5px"><div><b>매주 반복</b><div style="color:#6b7280;font-size:12.5px;margin-top:2px">월요일마다 무조건</div></div><div><b>시간을 잡아먹음</b><div style="color:#6b7280;font-size:12.5px;margin-top:2px">일요일 저녁 2시간</div></div><div><b>기준 명확</b><div style="color:#6b7280;font-size:12.5px;margin-top:2px">머릿속에서 이미 작동</div></div></div></div><div class="callout dark" style="margin-top:14px">8개를 한 번에 하려던 6주보다 — <b>하나로 좁힌 하루</b>가 훨씬 빠르게 작동했습니다.</div></div>`},
{note:"20. MENTOR'S CASE ③ — /PM-주간정리 형식화 + 효과.",html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ③ · 머릿속 기준을 스킬로</div><div class="h2"><span class="mono" style="font-size:22px;padding:3px 10px">/PM-주간정리</span> — 4요소로 풀어 쓴 결과</div><div class="grid2" style="margin-top:14px;gap:10px"><div class="card bluebg" style="padding:14px 16px"><div class="label blue">① 포함할 것 — 4단 구조</div><div class="cbody" style="font-size:13px">이번 주 완료 / 다음 주 진행 / <b>블로커 / 의사결정 대기</b><br><span style="color:#9ca3af;font-size:12px">클라이언트별로 분리해서 출력</span></div></div><div class="card orangebg" style="padding:14px 16px"><div class="label orange">② 제외할 것</div><div class="cbody" style="font-size:13px">잡담·추측·완료된 세부 항목<br><b>지금 액션이 필요한 것만</b><br><span style="color:#9ca3af;font-size:12px">보고서가 아니라 행동 리스트</span></div></div><div class="card greenbg" style="padding:14px 16px"><div class="label green">③ 좋은 예시 — 블로커 패턴</div><div class="cbody" style="font-size:13px">"<b>[클라 A] 답변 대기 3일째</b>"<br>"결제 보류 — 세금계산서 후"<br>"스코프 변경 가능성 감지"</div></div><div class="card purplebg" style="padding:14px 16px"><div class="label purple">④ 보완 기준 — 자주 빠지는 것</div><div class="cbody" style="font-size:13px">담당자·마감 빠짐 → <b style="color:var(--orange)">[확인 필요]</b><br>3주 정체 → <b style="color:var(--red)">⚠️</b><br>클라가 모르는 이슈 → <b style="color:var(--orange)">⚡ 선제 보고</b></div></div></div><div style="margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px"><div style="padding:14px 12px;background:var(--green2);border:1.5px solid var(--green3);border-radius:12px;text-align:center"><div style="font-size:22px;font-weight:900;color:var(--green);letter-spacing:-.02em">2시간 → 5분</div><div style="font-size:12px;color:#6b7280;margin-top:2px">정리 시간</div></div><div style="padding:14px 12px;background:var(--orange2);border:1.5px solid var(--orange3);border-radius:12px;text-align:center"><div style="font-size:22px;font-weight:900;color:var(--orange);letter-spacing:-.02em">5 → 10개</div><div style="font-size:12px;color:#6b7280;margin-top:2px">동시 진행 프로젝트</div></div><div style="padding:14px 12px;background:var(--purple2);border:1.5px solid var(--purple3);border-radius:12px;text-align:center"><div style="font-size:22px;font-weight:900;color:var(--purple);letter-spacing:-.02em">"그게요…" 줄음</div><div style="font-size:12px;color:#6b7280;margin-top:2px">상황 다시 설명 빈도</div></div></div><div class="callout dark" style="margin-top:12px">절약된 시간은 다음 자동화로 이어집니다 — 현재는 <b>견적 산정 → 제안서 → 정산</b> 순서로 다음 스킬을 확장 중입니다.</div></div>`},
{note:'21. 마무리 — 큰 그림보다 첫 실행 단위.',html:`<div class="paper" style="text-align:center"><div class="kicker" style="text-align:center">핵심 정리</div><div class="bigquote" style="margin-top:10px">업무 자동화는<br>큰 그림보다 <span class="hl">첫 실행 단위</span>가 중요합니다</div><div style="margin-top:20px;font-size:15.5px;color:#4b5563;line-height:1.75;font-weight:600;max-width:780px;margin-left:auto;margin-right:auto">처음부터 큰 그림을 한 번에 해결하려 하면 어렵습니다. 먼저 할 일은 하나 — <b style="color:#111827">"이번 주에 실제로 돌려볼 수 있는 첫 실행 단위가 무엇인가?"</b><br>그 첫 단위가 정해져야 문제정의도 선명해지고, 첫 스킬도 만들 수 있고, 파일럿도 돌릴 수 있습니다.</div><div style="display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr;align-items:center;gap:8px;margin-top:24px;max-width:760px;margin-left:auto;margin-right:auto"><div style="padding:18px 14px;background:var(--orange2);border:2px solid var(--orange3);border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">1</div><div style="font-weight:900;font-size:16px;color:#111827">문제정의</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px">진짜 반복 병목 확인</div></div><div style="text-align:center;font-size:24px;color:#cbd5e1;font-weight:900">→</div><div style="padding:18px 14px;background:var(--orange2);border:2px solid var(--orange3);border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">2</div><div style="font-weight:900;font-size:16px;color:#111827">첫 스킬</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px">입력·출력 하나로 좁히기</div></div><div style="text-align:center;font-size:24px;color:#cbd5e1;font-weight:900">→</div><div style="padding:18px 14px;background:var(--orange2);border:2px solid var(--orange3);border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">3</div><div style="font-weight:900;font-size:16px;color:#111827">파일럿</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px">샘플 + 성공 기준</div></div></div><div class="callout dark" style="margin-top:22px">큰 자동화는 한 번에 만들어지지 않습니다 — <b>작게 정의한 첫 실행 단위가 반복되면서</b> 큰 시스템으로 확장됩니다.</div></div>`}
];

const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
