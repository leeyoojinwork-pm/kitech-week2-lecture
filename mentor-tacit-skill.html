.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{border-radius:22px;padding:24px;border:1px solid var(--line);background:#fff}.bluebg{background:var(--blue2);border-color:var(--blue3)}.orangebg{background:var(--orange2);border-color:var(--orange3)}.redbg{background:var(--red2);border-color:var(--red3)}.greenbg{background:var(--green2);border-color:var(--green3)}.purplebg{background:var(--purple2);border-color:var(--purple3)}.graybg{background:#f8fafc;border-color:#e2e8f0}.label{font-size:12px;font-weight:950;letter-spacing:.02em;color:#9ca3af;text-transform:uppercase;margin-bottom:10px}.label.orange{color:var(--orange)}.label.blue{color:var(--blue)}.label.red{color:var(--red)}.label.green{color:var(--green)}.label.purple{color:var(--purple)}.ctitle{font-size:20px;font-weight:950;letter-spacing:-.035em;line-height:1.32;margin-bottom:10px}.cbody{font-size:15px;color:#6b7280;line-height:1.72}.cbody b{color:#111827}.callout{border-radius:20px;padding:19px 23px;margin-top:18px;font-size:17px;line-height:1.65;font-weight:760}.callout.orange{background:var(--orange2);border:1px solid var(--orange3);color:#9a3412}.callout.blue{background:var(--blue2);border:1px solid var(--blue3);color:#1d4ed8}.callout.green{background:var(--green2);border:1px solid var(--green3);color:#047857}.callout.purple{background:var(--purple2);border:1px solid var(--purple3);color:#5b21b6}.callout.dark{background:#111827;color:#fff}.pillrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}.pill{border-radius:999px;background:#f3f4f6;border:1px solid #e5e7eb;padding:8px 15px;font-size:14px;font-weight:850;color:#6b7280}.pill.orange{background:var(--orange2);border-color:var(--orange3);color:var(--orange)}.pill.blue{background:var(--blue2);border-color:var(--blue3);color:var(--blue)}.pill.green{background:var(--green2);border-color:var(--green3);color:var(--green)}.pill.purple{background:var(--purple2);border-color:var(--purple3);color:var(--purple)}
.step{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:17px;border-radius:18px;border:1px solid var(--line);background:#fff;margin-bottom:12px}.num{width:42px;height:42px;border-radius:50%;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:950}.num.red{background:var(--red)}.num.orange{background:var(--orange)}.num.green{background:var(--green)}.num.purple{background:var(--purple)}.step strong{display:block;font-size:15.5px;letter-spacing:-.035em;margin-bottom:3px}.step span{font-size:13.5px;color:#6b7280;line-height:1.6}.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}.table th{background:#f8fafc;font-size:13px;color:#6b7280;text-align:left;padding:14px 16px}.table td{padding:15px 16px;border-top:1px solid var(--line);font-size:15px;line-height:1.65;vertical-align:top}.table td:first-child{font-weight:900;color:#111827}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:12px;padding:11px 14px;font-size:14px;line-height:1.7;color:#374151}.bigquote{font-size:30px;line-height:1.45;letter-spacing:-.055em;font-weight:950;text-align:center;color:#111827}.arrow{font-size:24px;color:#cbd5e1;font-weight:950;display:flex;align-items:center;justify-content:center}.caseTag{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-size:13px;font-weight:900;margin-bottom:18px}.caseTag.red{background:var(--red2);color:var(--red);border:1px solid var(--red3)}.caseTag.orange{background:var(--orange2);color:var(--orange);border:1px solid var(--orange3)}.caseTag.green{background:var(--green2);color:var(--green);border:1px solid var(--green3)}.caseTag.purple{background:var(--purple2);color:var(--purple);border:1px solid var(--purple3)}.twoflow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}.notes{position:fixed;left:24px;right:24px;bottom:18px;background:#111827;color:#d1d5db;border-radius:22px;padding:18px 22px;font-size:14px;line-height:1.7;box-shadow:0 20px 60px rgba(0,0,0,.22);transform:translateY(150%);transition:.25s;z-index:40}.notes.open{transform:translateY(0)}.notes b{color:#fbbf24}.nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#9ca3af;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 10px 30px rgba(15,23,42,.08);font-size:28px}.nav:hover{color:#111827}.nav:disabled{opacity:.25}.prev{left:24px}.next{right:24px}.dots{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:7px;z-index:20}.dot{width:7px;height:7px;border-radius:999px;background:#cbd5e1;border:0;transition:.2s}.dot.on{width:24px;background:var(--orange)}

/* Design-system alignment: KITECH 운영용 강의자료 톤 */
:root{
  --bg:#fafaf9;--paper:#fff;--ink:#2c2c2c;--text:#2c2c2c;--muted:#6b6b6b;--sub:#8a8a8a;
  --blue:#2563eb;--blue2:rgba(37,99,235,.08);--blue3:rgba(37,99,235,.25);
  --orange:#b45309;--orange2:rgba(180,83,9,.08);--orange3:rgba(180,83,9,.22);
  --red:#b91c1c;--red2:rgba(185,28,28,.07);--red3:rgba(185,28,28,.22);
  --green:#0f766e;--green2:rgba(15,118,110,.08);--green3:rgba(15,118,110,.24);
  --purple:#7c3aed;--purple2:rgba(124,58,237,.08);--purple3:rgba(124,58,237,.24);
  --line:#e5e5e3;--dark:#111827;
}
.topbar{height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:0 28px}
.badge{color:var(--blue);letter-spacing:.03em;text-transform:uppercase}.badge-dot{border-color:var(--blue)}
.tb-title{color:var(--text);font-weight:800}.tb-meta{color:var(--muted)}
.progress{background:#f1f1ef}.progress div{background:linear-gradient(90deg,var(--blue),var(--green))}
.stage{overflow:hidden}.slide{padding:36px 72px 62px;overflow-y:auto;align-items:flex-start}.inner{max-width:1020px;margin:auto}
.paper{border-radius:14px;border:1.5px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.04);padding:30px 40px;max-height:calc(100vh - 100px);overflow-y:auto}
.kicker{color:var(--blue);font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.h1{font-size:38px;letter-spacing:-.5px;font-weight:850}.h2{font-size:26px;letter-spacing:-.35px;font-weight:850}.sub{font-size:15.5px;color:var(--muted);margin-top:10px}
.card{border-radius:12px;border:1.5px solid var(--line);box-shadow:0 1px 4px rgba(0,0,0,.02);padding:16px 18px}
.ctitle{font-size:17px;font-weight:800;letter-spacing:-.2px;margin-bottom:6px}.cbody{font-size:13.5px;color:var(--muted);line-height:1.65}
.callout{border-radius:12px;font-size:14px;font-weight:650;padding:13px 16px;margin-top:14px}.pill{border-radius:999px;font-size:12px;padding:6px 12px}
.step{border-radius:12px;border:1.5px solid var(--line);padding:11px 13px;margin-bottom:8px}.num{border-radius:999px;background:var(--blue)}
.table{border-radius:12px;border:1.5px solid var(--line)}.table th{background:#f8fafc;padding:10px 12px;font-size:12.5px}.table td{padding:11px 12px;font-size:13.5px;line-height:1.55}.mono{border-radius:10px;padding:8px 11px;font-size:13px}
.nav{width:42px;height:42px;color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.04)}
.dot.on{background:var(--blue)}.notes{border-radius:14px;background:#111827}
@media(max-height:820px){.paper{padding:24px 34px}.h1{font-size:32px}.h2{font-size:23px}.sub{font-size:14.5px;margin-top:8px}.card{padding:14px 16px}.callout{padding:11px 14px;font-size:13.5px;margin-top:12px}.step{padding:9px 12px;margin-bottom:6px}.step strong{font-size:14.5px}.step span{font-size:12.5px}.ctitle{font-size:15.5px}.cbody{font-size:12.5px}.table th{padding:8px 10px;font-size:11.5px}.table td{padding:9px 10px;font-size:12.5px}}
@media(max-width:900px){.slide{padding:26px 22px 54px}.paper{padding:28px 22px;border-radius:14px}.h1{font-size:32px}.h2{font-size:25px}.grid2,.grid3,.grid4,.twoflow{grid-template-columns:1fr}.arrow{display:none}.topbar{padding:0 14px}.tb-meta{display:none}.nav{width:36px;height:36px;font-size:22px}.prev{left:8px}.next{right:8px}}

<body>
<header class="topbar">
  <span class="badge">멘토 사례 <span class="badge-dot">2</span></span>
  <span class="tb-title">암묵지 형식화 사례 워크숍</span>
  <span class="tb-meta">13:50–14:10 · 발표 이유진 멘토</span>
  <span class="spacer"></span>
  <span class="counter"><span id="cur">1</span> / <span id="tot">16</span></span>

</header>
<div class="progress"><div id="bar"></div></div>

<script>
const SLIDES=[
{note:'1. 표지 — 멘티 3명 사례, 오늘 다룰 5가지.',html:`<div class="paper"><div class="kicker">Tacit Knowledge · Skill Development</div><div class="h1">멘티 3명 사례로 보는<br><span class="hl">암묵지 형식화 + 스킬 개발</span></div><div class="sub" style="margin-top:14px">머릿속에만 있던 판단 기준을 문서화하고,<br>반복 실행 가능한 스킬 구조로 전환합니다.</div><div style="margin-top:18px;padding:14px 18px;background:#f8fafc;border:1.5px solid var(--line);border-radius:10px"><div style="font-size:12px;font-weight:900;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">오늘 다룰 사례</div><div style="display:flex;flex-wrap:wrap;gap:8px"><span class="pill orange">사례 A · 뉴스 선별</span><span class="pill blue">사례 B · 원규 검토</span><span class="pill green">사례 C · 회의록</span><span class="pill purple">형식화 4요소</span><span class="pill">실습</span></div></div></div>`},
{note:'2. Today Flow — 검토 순서 4단계.',html:`<div class="paper"><div class="kicker">Today Flow</div><div class="h2">검토 순서</div><div style="margin-top:18px"><div class="step"><div class="num orange">1</div><div><strong>0~5분 · 암묵지 형식화 정의</strong><span>형식지와 암묵지의 차이를 이해하고, 형식화 정도에 따라 Type A·B·C로 구분합니다.</span></div></div><div class="step"><div class="num orange">2</div><div><strong>5~10분 · 사례 A — 뉴스 선별</strong><span>선별 기준과 문장 규칙을 처리 기준으로 정리합니다. 하나의 업무를 3개 스킬로 나누는 방식을 봅니다.</span></div></div><div class="step"><div class="num blue">3</div><div><strong>10~15분 · 사례 B — 원규 검토</strong><span>머릿속 검토 관점을 5개 항목으로 꺼냅니다. 관점의 리스트화가 스킬의 뼈대가 됩니다.</span></div></div><div class="step"><div class="num green">4</div><div><strong>15~20분 · 사례 C — 회의록과 HWPX 제약</strong><span>회의록 작성 기준과 파일 포맷 제약을 함께 봅니다. 기준 정리와 구현 가능성은 별도로 점검해야 합니다.</span></div></div></div><div class="callout dark" style="margin-top:14px">사례를 외우는 것이 아니라, <b>판단 기준을 글로 옮기는 방식</b>을 익힙니다.</div></div>`},
{note:'3. 개념 정의 — 형식지와 암묵지.',html:`<div class="paper"><div class="kicker">개념 정의</div><div class="h2">형식지와 암묵지</div><div class="grid2" style="margin-top:18px"><div class="card bluebg"><div class="label blue">형식지</div><div class="ctitle">이미 문서로 정리된 기준</div><div class="cbody">매뉴얼·규정·절차서·작성 양식처럼 누가 봐도 확인할 수 있는 지식입니다. AI에게 바로 처리 기준으로 줄 수 있습니다.</div></div><div class="card orangebg"><div class="label orange">암묵지</div><div class="ctitle">경험으로 쌓인 판단 기준</div><div class="cbody">담당자만 알고 있는 업무 감각입니다. <b>"보면 안다"</b> 안에 실제 기준이 숨어 있습니다. AI가 반복 실행하려면 이 기준을 문서로 꺼내야 합니다.</div></div></div><div class="callout dark" style="margin-top:14px">AI는 말하지 않은 기준을 모릅니다. <b>암묵지를 문서화해야 반복 실행이 가능합니다.</b></div></div>`},
{note:'4. 암묵지란 무엇인가 — 일상 예시.',html:`<div class="paper"><div class="kicker">암묵지란 무엇인가</div><div class="h2">암묵지 = <span class="hl">내가 당연하게 쓰던</span> 업무 기준</div><div class="sub" style="margin-top:12px">너무 당연하게 판단하던 기준이라 문서로 남기지 않았던 것들입니다.</div><div class="grid2" style="margin-top:18px;gap:10px"><div class="card graybg"><div class="cbody"><b>"이 뉴스는 중요하다"</b><br><span style="font-size:13px;color:#9ca3af">— 언론홍보 담당자의 직감</span></div></div><div class="card graybg"><div class="cbody"><b>"이 문장은 보고서에 넣기 애매하다"</b><br><span style="font-size:13px;color:#9ca3af">— 검수자의 감각</span></div></div><div class="card graybg"><div class="cbody"><b>"이 내용은 결정사항이 아니라 논의내용이다"</b><br><span style="font-size:13px;color:#9ca3af">— 회의록 작성자의 구분</span></div></div><div class="card graybg"><div class="cbody"><b>"이 자소서는 뭔가 약하다"</b><br><span style="font-size:13px;color:#9ca3af">— HR의 5초 판단</span></div></div></div><div class="callout dark" style="margin-top:14px">사람은 바로 알지만 — <b>AI는 기준을 알려줘야 압니다.</b></div></div>`},
{note:'5. 왜 기준 문서가 필요한가 — 3단 도식.',html:`<div class="paper"><div class="kicker">왜 기준 문서가 필요한가</div><div class="h2">사람의 암묵지 → 기준문서 → AI 실행</div><div style="margin-top:20px;display:grid;grid-template-columns:1fr 36px 1fr 36px 1fr;align-items:center;gap:8px"><div style="padding:18px 14px;border:1.5px solid var(--line);border-radius:14px;text-align:center;background:#fff"><div style="font-size:24px;margin-bottom:6px">👤</div><div style="font-weight:900;font-size:15px;color:#111827;margin-bottom:4px">사람의 암묵지</div><div style="font-size:12.5px;color:#6b7280">말하지 않아도<br>당연히 아는 기준</div></div><div style="text-align:center;font-size:12px;color:#9ca3af;font-weight:700"><div style="font-size:20px;color:#cbd5e1">→</div></div><div style="padding:18px 14px;border:2px solid var(--blue3);border-radius:14px;text-align:center;background:var(--blue2)"><div style="font-size:24px;margin-bottom:6px">📄</div><div style="font-weight:900;font-size:15px;color:var(--blue);margin-bottom:4px">기준문서.md</div><div style="font-size:12.5px;color:#6b7280">AI가 읽을 수 있는<br>업무 판단 기준</div></div><div style="text-align:center;font-size:12px;color:#9ca3af;font-weight:700"><div style="font-size:20px;color:#cbd5e1">→</div></div><div style="padding:18px 14px;border:2px solid var(--green3);border-radius:14px;text-align:center;background:var(--green2)"><div style="font-size:24px;margin-bottom:6px">🤖</div><div style="font-weight:900;font-size:15px;color:var(--green);margin-bottom:4px">에이전트 실행</div><div style="font-size:12.5px;color:#6b7280">같은 기준으로<br>반복 실행</div></div></div><div class="callout dark" style="margin-top:18px">기준 문서가 없으면 — AI가 매번 알아서 판단합니다. 그래서 결과가 흔들리고, <b>"AI가 이상하다"</b>고 느껴집니다.</div></div>`},
{note:'6. 형식화 3유형 — Type A·B·C 카드.',html:`<div class="paper"><div class="kicker">암묵지 형식화 유형</div><div class="h2">형식화 정도에 따른 <span class="hl">3가지 유형</span></div><div class="grid3" style="margin-top:18px"><div class="card redbg"><div class="label red">Type A</div><div class="ctitle">미형식화</div><div class="cbody">기준이 머릿속에만 있습니다. 포함·제외·예시가 문서로 남아 있지 않습니다 — <b>"보면 안다"에서 멈춘 상태</b>입니다.</div></div><div class="card orangebg"><div class="label orange">Type B</div><div class="ctitle">부분 형식화</div><div class="cbody">포함·제외 기준은 있지만 예시가 부족합니다. 일반 사례는 처리되지만 — <b>애매한 사례에서 결과가 흔들립니다.</b></div></div><div class="card greenbg"><div class="label green">⭐ Type C</div><div class="ctitle">완전 형식화</div><div class="cbody">포함·제외·우수예시·보완예시가 함께 정리된 상태입니다. AI가 <b>같은 기준으로 반복 실행</b>할 수 있습니다.</div></div></div><div class="callout dark" style="margin-top:14px">이번 사례는 <b>Type A·B 상태에서 출발해 Type C로 이동하는 과정</b>을 봅니다.</div></div>`},
{note:'7. 3유형 비교 표.',html:`<div class="paper"><div class="kicker">유형 비교</div><div class="h2">A · B · C 비교</div><table class="table" style="margin-top:14px"><tr><th>구분</th><th><span style="color:var(--red)">Type A</span><br>미형식화</th><th><span style="color:var(--orange)">Type B</span><br>부분 형식화</th><th><span style="color:var(--green)">⭐ Type C</span><br>완전 형식화</th></tr><tr><td>포함 기준</td><td>머릿속에만 있음</td><td>문서화됨</td><td>문서화됨</td></tr><tr><td>제외 기준</td><td>불명확함</td><td>문서화됨</td><td>문서화됨</td></tr><tr><td>우수 예시</td><td>없음</td><td>일부 있음</td><td>3개 이상</td></tr><tr><td>보완 예시</td><td>없음</td><td>없음</td><td>3개 + 개선안</td></tr><tr><td>AI 실행</td><td>매번 다시 설명</td><td>경계 사례에서 흔들림</td><td>일관 실행</td></tr><tr><td>다음 단계</td><td>기준 추출</td><td>오류 분석·예시 보강</td><td>실행·검증 기준 설정</td></tr></table><div class="callout dark" style="margin-top:14px"><b>Type B는 실패가 아닙니다.</b> 오류 사례를 모으면 Type C로 갈 수 있습니다.</div></div>`},
{note:'8. 유형별 멘토 처방 — 첫 질문이 다릅니다.',html:`<div class="paper"><div class="kicker">유형별 멘토 처방</div><div class="h2">유형마다 <span class="hl">첫 질문</span>이 다릅니다</div><div class="grid3" style="margin-top:18px"><div class="card redbg"><div class="label red">Type A — "보면 안다"</div><div class="cbody">기준을 바로 묻지 않습니다. 먼저 <b>우수 결과 3개·보완 결과 3개</b>를 봅니다. 둘의 차이를 한 문장으로 쓰면 — 그게 기준이 됩니다.</div></div><div class="card orangebg"><div class="label orange">Type B — 경계에서 흔들림</div><div class="cbody">오류 사례를 실패로 보지 않습니다. 100건 중 8건이 틀렸다면 — 그 8건은 <b>보완 예시</b>가 됩니다. 같은 패턴인지 보고 기준을 한 줄씩 추가합니다.</div></div><div class="card greenbg"><div class="label green">⭐ Type C — 실행 가능</div><div class="cbody">기준을 더 늘리지 않습니다. 정확도·시간 단축·수정 횟수 중 — <b>대표 지표 하나</b>를 정합니다. 이제는 실행하고 검증할 단계입니다.</div></div></div></div>`},
{note:'9. 사례 A · 뉴스 선별 — Before/After.',html:`<div class="paper"><div class="caseTag orange">사례 A · 언론홍보 담당자</div><div class="h2">뉴스 선별 기준과 문장 규칙을<br><span class="hl">처리 기준으로 바꾼 사례</span></div><div class="sub" style="margin-top:10px">매일 오전 뉴스 50건 검토 → 주요 10건 선별 → 한 문장 요약문 배포</div><div class="grid2" style="margin-top:18px"><div class="card redbg"><div class="label red">Before</div><div class="ctitle">한 사람에게만 쌓인 기준</div><div class="cbody">선별 기준과 문장 스타일이 담당자 1인에게 집중되어 있었습니다. 담당자가 없으면 — <b>왜 이 뉴스를 골랐는지 설명하기 어려웠습니다.</b></div></div><div class="card greenbg"><div class="label green">After</div><div class="ctitle">기준을 문서로 꺼낸 상태</div><div class="cbody"><b>포함</b> 우리 기관 직접 언급 / R&D 예산 / 출연연 제도<br><b>제외</b> 동일 사안 3차 이상 후속 / 정당 이슈 결부<br><b>문장 규칙</b> 1기사 1문장 / 매체명 위치 다양화 / 종결어미 반복 줄이기</div></div></div><div class="callout dark" style="margin-top:14px">반복 판단 기준을 문서화하면 — 그 문서가 <b>스킬 설계의 입력</b>이 됩니다.</div></div>`},
{note:'10. 사례 A · 스킬 구조 — 행동 → 매핑.',html:`<div class="paper"><div class="caseTag orange">사례 A · 스킬 구조</div><div class="h2">사람의 행동을 동사로 풀면<br><span class="hl">스킬 구조</span>가 보입니다</div><div style="margin-top:14px"><div style="font-size:12px;font-weight:900;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">① 행동 워크플로우</div><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;font-size:12.5px"><div style="padding:9px 7px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>모은다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">뉴스 50건</div></div><div style="padding:9px 7px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>선별한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">기준 적용</div></div><div style="padding:9px 7px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>요약한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">한 문장으로</div></div><div style="padding:9px 7px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>참조한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">베스트와 비교</div></div><div style="padding:9px 7px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>넣는다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">메일 템플릿</div></div><div style="padding:9px 7px;background:#f8fafc;border:1.5px solid var(--line);border-radius:8px;text-align:center"><b>배포한다</b><div style="font-size:10.5px;color:#9ca3af;margin-top:3px">메일 발송</div></div></div></div><div style="text-align:center;font-size:18px;color:#cbd5e1;font-weight:700;margin:10px 0">↓ 같은 기준끼리 묶기</div><div><div style="font-size:12px;font-weight:900;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">② 스킬 매핑</div><table class="table"><tr><th>스킬</th><th>역할</th></tr><tr><td><span class="mono">/한문장-작성</span></td><td>선별 + 요약</td></tr><tr><td><span class="mono">/best-sentences</span></td><td>과거 우수 문장 참조</td></tr><tr><td><span class="mono">/template-mail</span></td><td>메일 템플릿 반영</td></tr></table></div><div class="callout dark" style="margin-top:12px">동사로 풀고 → 같은 기준끼리 묶고 → <b>묶음에 이름을 붙이면 스킬</b>이 됩니다.</div></div>`},
{note:'11. 사례 B · 원규 검토 — 5가지 검토 관점.',html:`<div class="paper"><div class="caseTag blue">사례 B · 규정관리 담당자</div><div class="h2">원규 검토는 <span class="hl">관점을 리스트로</span><br>꺼내는 것부터 시작합니다</div><div class="sub" style="margin-top:10px">원규 개정안 검토 → 관점별 의견서 초안 생성</div><div style="margin-top:12px;padding:11px 14px;background:#f8fafc;border-left:3px solid var(--blue);border-radius:6px;font-size:12.5px;color:#4b5563;line-height:1.55"><b style="color:#111827">원규(院規)란?</b> 공공기관·연구원의 내부 규정. 조직 운영·인사·재무·연구관리 등 기관 업무 전반을 다루는 자체 규정 문서.</div><div style="margin-top:14px;padding:16px 20px;background:var(--blue2);border:1.5px solid var(--blue3);border-radius:12px"><div class="label blue" style="margin-bottom:10px">5가지 검토 관점</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13.5px"><div style="padding:10px 13px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">1. 법적 정합성</b> — 상위 법령·지침과 충돌하지 않는가</div><div style="padding:10px 13px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">2. 재무적 타당성</b> — 예산·비용 구조에 무리가 없는가</div><div style="padding:10px 13px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">3. 운영 실행가능성</b> — 현장에서 실제 적용 가능한가</div><div style="padding:10px 13px;background:#fff;border-radius:8px;border:1px solid var(--blue3)"><b style="color:var(--blue)">4. 위험 관리</b> — 예외 상황·허점은 없는가</div><div style="padding:10px 13px;background:#fff;border-radius:8px;border:1px solid var(--blue3);grid-column:1/-1"><b style="color:var(--blue)">5. 전략 정합성</b> — 기관의 중장기 방향과 맞는가</div></div></div><div class="callout dark" style="margin-top:12px">머릿속 관점이 항목으로 나오는 순간 — <b>스킬의 뼈대가 만들어집니다.</b></div></div>`},
{note:'12. 사례 B · 스킬 명세 — 5요소.',html:`<div class="paper"><div class="caseTag blue">사례 B · 스킬 명세</div><div class="h2"><span class="mono" style="font-size:22px;padding:3px 10px">/원규-검토</span> 설계 5요소</div><table class="table" style="margin-top:14px"><tr><th>항목</th><th>내용</th><th>설계 포인트</th></tr><tr><td>스킬 이름</td><td><span class="mono">/원규-검토</span></td><td>이름이 곧 기능 정의</td></tr><tr><td>입력</td><td>개정안, 기존 규정, 검토 배경</td><td>파일만으로는 부족</td></tr><tr><td>처리 기준</td><td>5가지 검토 관점, 누락 체크</td><td>기준 없으면 일반론으로 흐름</td></tr><tr><td>출력</td><td>관점별 의견 초안, 보완 항목, 질문</td><td>최종본이 아닌 검토용 초안</td></tr><tr><td>사람 검토</td><td>제출 전 담당자 확인·서명</td><td>책임 문서는 사람 판단 필수</td></tr></table><div class="callout dark" style="margin-top:14px"><b>AI는 최종 판단자가 아닙니다.</b> 초안을 만들고, 누락을 짚고, 검토 질문을 제안하는 역할입니다.</div></div>`},
{note:'13. 사례 C · 회의록 — 기준 정리 + HWPX 제약.',html:`<div class="paper"><div class="caseTag green">사례 C · 디지털인재교육팀</div><div class="h2">기준 정리와 <span class="hl">구현 가능성</span>은 별개입니다</div><div class="sub" style="margin-top:10px">주간 회의 내용 정리 → 결정사항·액션아이템·논의내용으로 구조화 → 회의록 초안 생성</div><div class="grid2" style="margin-top:18px"><div class="card greenbg"><div class="label green">정리된 암묵지</div><div class="ctitle">회의록 작성 기준</div><div class="cbody">참석자·안건·논의·결정·액션 5단 구조<br>결정사항·논의내용 구분 기준<br>"~하기로 했다", "~까지 검토" 패턴<br>액션아이템 담당자·마감일 표시</div></div><div class="card redbg"><div class="label red">남은 제약</div><div class="ctitle">HWPX 포맷 처리</div><div class="cbody">공공기관 표준 문서 포맷이 HWPX. AI가 내용을 정리하는 것과 — <b>HWPX 서식을 유지하는 것은 다른 문제</b>입니다. MD/DOCS 변환 시 표·여백·서식이 깨질 수 있습니다.</div></div></div><div class="callout dark" style="margin-top:14px">기준 문서화가 끝나도 — <b>실제 파일 포맷에서 작동하는지는 따로 확인</b>해야 합니다.</div></div>`},
{note:'14. 관점 전환 — 기준은 실행하면서 채운다.',html:`<div class="paper"><div class="kicker">관점 전환</div><div class="h2">기준은 <span class="hl">실행하면서 채우는 것</span>입니다</div><div class="sub" style="margin-top:12px">처음부터 완벽한 기준 문서를 만들 필요는 없습니다. 작게 실행하고, 결과를 비교하고, 빠진 기준을 한 줄씩 추가합니다.</div><div style="margin-top:18px"><div class="step"><div class="num green">1</div><div><strong>1차 실행</strong><span>최소 입력으로 결과물을 만듭니다. 부족한 결과가 나와야 빠진 기준이 보입니다.</span></div></div><div class="step"><div class="num green">2</div><div><strong>비교</strong><span>잘 나온 결과와 아쉬운 결과를 나란히 봅니다. 둘의 차이를 한 문장으로 씁니다.</span></div></div><div class="step"><div class="num green">3</div><div><strong>재실행</strong><span>새 기준을 반영해 다시 실행합니다. 같은 지점에서 또 흔들리면 — 그 위치에 기준을 한 줄 더 추가합니다.</span></div></div></div><div class="callout dark" style="margin-top:12px">형식화는 한 번에 끝나는 문서 작업이 아니라 — <b>실행하며 기준을 보강하는 과정</b>입니다.</div></div>`},
{note:'15. 사례 종합 — 사례별 형식화 지점.',html:`<div class="paper"><div class="kicker">사례 종합</div><div class="h2">사례별 형식화 지점</div><table class="table" style="margin-top:14px"><tr><th>사례</th><th>유형 전환</th><th>꺼낸 암묵지</th><th>스킬화 방식</th><th>다음 제출물</th></tr><tr><td><b>A</b> <span style="color:var(--orange)">뉴스 선별</span></td><td>B → C</td><td>선별 기준, 문장 스타일</td><td>3개 스킬 분리</td><td>도메인 규칙표, 샘플 문장</td></tr><tr><td><b>B</b> <span style="color:var(--blue)">원규 검토</span></td><td>A → C</td><td>5가지 검토 관점</td><td>관점별 초안 생성</td><td>5관점 체크리스트</td></tr><tr><td><b>C</b> <span style="color:var(--green)">회의록</span></td><td>C + 제약</td><td>결정·액션 분류 기준</td><td>초안 생성, 누락 체크</td><td>HWPX 추출 테스트</td></tr></table><div class="callout dark" style="margin-top:14px">스킬 설계는 기술 선택보다 — <b>판단 기준을 얼마나 명확히 꺼냈는지</b>에서 시작합니다.</div></div>`},
{note:'16. 형식화의 본질 — 자료첨부 vs 풀어쓰기.',html:`<div class="paper" style="text-align:center"><div class="kicker" style="text-align:center">암묵지 형식화의 본질</div><div class="bigquote" style="margin-top:10px">자료를 많이 준다고<br>AI가 기준까지 <span class="hl">아는 것은 아닙니다</span></div><div style="margin-top:18px;font-size:15.5px;color:#4b5563;font-weight:600;line-height:1.75;max-width:780px;margin-left:auto;margin-right:auto">이력서 PDF를 통째로 넣어도 AI는 채용 기준을 모릅니다.<br>규정집·회의록 폴더를 넣어도 AI는 어디를 중점적으로 봐야 할지 모릅니다.</div><div class="grid2" style="margin-top:22px"><div class="card redbg"><div class="label red">잘못된 접근 — 자료 첨부</div><div class="ctitle">"참고 파일 드릴게요"</div><div class="cbody">자료는 있지만 판단 기준은 없습니다. AI는 읽을 수는 있지만 — <b>무엇을 중요하게 봐야 하는지 모릅니다.</b></div></div><div class="card greenbg"><div class="label green">좋은 접근 — 판단 규칙 풀어쓰기</div><div class="cbody">· 이 조건이면 포함한다<br>· 이 조건이면 제외한다<br>· 이런 결과가 좋은 예시다<br>· 이런 결과는 이렇게 고친다</div></div></div><div class="callout dark" style="margin-top:14px">암묵지 형식화는 — 문서를 많이 주는 일이 아니라, <b>내 판단 규칙을 AI가 따라 할 수 있는 문장으로 바꾸는 일</b>입니다.</div></div>`},
{note:'17. 형식화 4요소.',html:`<div class="paper"><div class="kicker">형식화 4요소</div><div class="h2">Type C를 만드는 <span class="hl">4가지 요소</span></div><div class="grid2" style="margin-top:18px;gap:10px"><div class="card bluebg"><div class="label blue">① 포함 기준</div><div class="ctitle">처리 대상이 되는 YES 조건</div><div class="cbody">무엇이 들어오면 포함할지 — 명확한 신호로 씁니다.</div></div><div class="card orangebg"><div class="label orange">② 제외 기준</div><div class="ctitle">처리하지 않을 NO 조건</div><div class="cbody">포함 기준과 헷갈리지 않게 — 구분되는 특징으로 씁니다.</div></div><div class="card greenbg"><div class="label green">③ 우수 예시 3개</div><div class="ctitle">기준을 잘 따른 결과물</div><div class="cbody">AI가 따라 할 수 있는 — 모범 사례로 사용합니다.</div></div><div class="card purplebg"><div class="label purple">④ 보완 예시 3개 + 개선안</div><div class="ctitle">아쉬운 결과 + 수정 방향</div><div class="cbody">왜 부족한지, 어떻게 고칠지까지 — 함께 씁니다.</div></div></div><div class="callout dark" style="margin-top:14px">4요소가 갖춰지면 — AI가 <b>같은 기준으로 반복 실행</b>할 수 있습니다.</div></div>`},
{note:'18. 실습 — 4단계 워크시트.',html:`<div class="paper"><div class="kicker">실습</div><div class="h2">내 업무의 암묵지를 <span class="hl">4단계</span>로 정리합니다</div><div class="sub" style="margin-top:10px">오전 문제정의를 바탕으로 — 처리 기준을 글로 옮겨봅니다.</div><div class="grid2" style="margin-top:18px;gap:10px"><div class="card bluebg"><div class="label blue">Step 1 — 포함 기준</div><div class="cbody">처리 대상의 YES 조건을 씁니다. 무엇이 들어오면 포함할지 — 신호 1~2개로 정의합니다.</div></div><div class="card orangebg"><div class="label orange">Step 2 — 제외 기준</div><div class="cbody">처리하지 않을 조건을 씁니다. 포함 기준과 구분되는 특징을 적습니다.</div></div><div class="card greenbg"><div class="label green">Step 3 — 우수 예시 3개</div><div class="cbody">기준을 잘 따른 결과물 3개를 모읍니다. 실제 산출물을 쓰는 것이 가장 좋습니다.</div></div><div class="card purplebg"><div class="label purple">Step 4 — 보완 예시 3개</div><div class="cbody">과거 오류·경계 사례를 모읍니다. 실패 원인과 수정 방향을 한 줄씩 붙입니다.</div></div></div><div class="callout dark" style="margin-top:14px">4항목이 정리되면 — <b>스킬로 전환할 준비가 된 것</b>입니다.</div></div>`},
{note:"19. MENTOR'S CASE ① — 자소서 5초 직감, A vs B.",html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ① · "보면 안다"의 정체</div><div class="h2">자소서 평가는 <span class="hl">대표적인 암묵지 업무</span>입니다</div><div class="sub" style="margin-top:10px">읽자마자 "이건 좀 약하다"는 느낌이 듭니다. 그런데 그 이유를 설명하려고 하면 — "좀 추상적이라서요"에서 멈추는 경우가 많습니다. <b>이 상태가 Type A입니다.</b></div><div style="margin-top:14px;font-size:12px;font-weight:900;color:#9ca3af;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px">두 자소서를 5초씩 봅니다</div><div class="grid2" style="gap:10px"><div class="card redbg" style="padding:14px 16px"><div class="label red">자소서 A · 약함</div><div class="cbody" style="font-style:italic;line-height:1.7">"저는 학창시절부터 다양한 프로젝트에 참여하며 <b>열정적으로 노력</b>해왔습니다. 팀원들과 협력해 좋은 성과를 만들었고, <b>최선을 다하는 자세</b>로 임했습니다. 귀사에서도 <b>최고의 결과</b>를 내겠습니다."</div></div><div class="card greenbg" style="padding:14px 16px;border-width:2px"><div class="label green">자소서 B · 강함</div><div class="cbody" style="font-style:italic;line-height:1.7">"커머스 앱 사용성 개선 프로젝트에서 <b>UX 리서처로</b> 사용자 인터뷰 <b>20건</b> 진행. 핵심 이탈 지점 정의 후 화면 흐름 재설계 — 전환율 <b>12% → 18%</b>로 개선."</div></div></div><div class="callout dark" style="margin-top:12px">B에는 <b>역할·행동·수치·결과</b>가 있고, A에는 열정·최선·최고만 있습니다.</div></div>`},
{note:'20. 실제 자소서 한 편 — 형광펜 + 걸리는 지점.',html:`<div class="paper"><div class="caseTag red">실제 자소서 한 편 — 어디가 약한지 보이세요?</div><div class="h2">"좀 약한데?"라는 감각을 <span class="hl">기준으로</span> 풀어봅니다</div><div style="margin-top:12px;padding:16px 20px;background:#fef9f4;border:1.5px solid var(--orange3);border-radius:12px;font-size:13px;line-height:1.9;color:#374151">저는 어렸을 때부터 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">다양한 분야에 관심이 많았던</span> 학생으로, 학창 시절 동안 여러 동아리 활동과 프로젝트에 참여하며 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">열정적으로 노력</span>해왔습니다. 특히 팀 프로젝트에서는 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">팀원들과 원활한 소통</span>을 통해 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">좋은 성과</span>를 만들어내는 데 기여했고, <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">언제나 최선을 다하는 자세</span>로 임했습니다. 대학 시절에는 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">다양한 대외 활동</span>을 병행하며 폭넓은 시야를 길렀고, 이러한 경험들이 저를 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">더욱 성장</span>하게 만들었다고 생각합니다. 귀사에 입사한다면 그동안 쌓아온 경험과 역량을 바탕으로 <span style="background:#fee2e2;padding:1px 4px;border-radius:3px">최고의 결과</span>를 내는 인재가 되겠습니다.</div><div style="margin-top:12px;padding:14px 18px;background:#f8fafc;border-left:3px solid var(--red);border-radius:8px;font-size:13px;color:#374151;line-height:1.7"><b style="color:var(--red)">읽으면서 걸리는 지점</b><br>· "다양한", "여러", "폭넓은" — 넓은 표현이 많음<br>· "열정", "최선", "최고" — 근거 없는 표현이 반복됨<br>· 본인이 실제로 한 행동이 보이지 않음 / 수치·결과 없음<br>· 어느 회사에나 쓸 수 있는 문장처럼 보임</div><div class="callout dark" style="margin-top:12px"><b>"좀 약하다"는 감각을 평가 기준으로 쪼개야</b> 합니다.</div></div>`},
{note:"21. MENTOR'S CASE ② — 6개 평가 기준.",html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ② · 5초 직감을 6개 기준으로</div><div class="h2">5초 직감을 <span class="hl">6개의 평가 기준</span>으로 나눕니다</div><table class="table" style="margin-top:14px"><tr><th>평가 기준</th><th>강한 자소서</th><th>약한 자소서</th></tr><tr><td><b>직무 적합성</b></td><td>JD 핵심 역량과 연결됨</td><td>직무와 무관한 경험 나열</td></tr><tr><td><b>경험 구체성</b></td><td>기간·역할·방법이 구체적</td><td>"다양한 프로젝트"처럼 뭉뚱그림</td></tr><tr><td><b>수치 임팩트</b></td><td>Before·After 수치가 있음</td><td>수치 없음, 결과 모호</td></tr><tr><td><b>역할 명확성</b></td><td>내가 한 일이 분명함</td><td>"팀원들과 함께"만 있음</td></tr><tr><td><b>기업 맥락</b></td><td>제품·고객·비즈니스와 연결</td><td>어느 회사에나 가능한 말</td></tr><tr><td><b>문장 톤</b></td><td>간결하고 근거 중심</td><td>"열정", "최선" 같은 표현 반복</td></tr></table><div class="callout dark" style="margin-top:14px">머릿속 평가 기준을 글로 꺼내면 — <b>AI도, 다른 사람도 같은 기준으로 볼 수 있습니다.</b></div></div>`},
{note:"22. MENTOR'S CASE ③ — /자소서-평가 출력 + 효과.",html:`<div class="paper"><div class="caseTag orange">MENTOR'S CASE ③ · 실제 평가 결과</div><div class="h2"><span class="mono" style="font-size:22px;padding:3px 10px">/자소서-평가</span> 로 돌리면<br>감점 이유가 <span class="hl">글로 나옵니다</span></div><div style="margin-top:12px;padding:14px 18px;background:#0f172a;border-radius:10px;color:#e5e7eb;font-family:ui-monospace,Menlo;font-size:12.5px;line-height:1.75"><span style="color:#fbbf24">📋 자소서 A · 종합 47/100</span><br><br><span style="color:#86efac">· 직무 적합성 3/5</span> — 프로젝트 언급은 있으나 직무 연결 약함<br><span style="color:#fca5a5">· 경험 구체성 1/5</span> — "다양한 프로젝트" 표현만, 구체 사례 없음<br><span style="color:#fca5a5">· 수치 임팩트 1/5</span> — 정량 결과 없음<br><span style="color:#fca5a5">· 역할 명확성 2/5</span> — 본인 역할이 보이지 않음<br><span style="color:#86efac">· 기업 맥락 2/5</span> — 어느 회사에나 가능한 일반론<br><span style="color:#fca5a5">· 문장 톤 1/5</span> — "열정", "최선", "최고" 반복<br><br><span style="color:#fbbf24">💡 보완 제안</span> "다양한 프로젝트" 대신 — 1개를 골라 역할·기간·행동·결과 수치를 한 문장에 넣기</div><table class="table" style="margin-top:12px"><tr><th>구분</th><th>Before</th><th>After</th></tr><tr><td>1건 평가 시간</td><td>15분</td><td>3분</td></tr><tr><td>피드백 형태</td><td>감으로</td><td>기준별 감점 근거 출력</td></tr><tr><td>설명 톤</td><td>"좀 약해요"</td><td>"역할과 수치가 부족해요"</td></tr></table><div class="callout dark" style="margin-top:12px">"보면 안다"는 감각도 — 기준으로 쪼개면 <b>반복 실행할 수 있습니다.</b></div></div>`},
{note:'23. 오늘 들고 가실 한 가지 — 행동 유도.',html:`<div class="paper" style="text-align:center"><div class="kicker" style="text-align:center">오늘 들고 가실 한 가지</div><div class="bigquote" style="margin-top:10px">이번 주에는<br>머릿속 판단 <span class="hl">하나만</span><br>글로 옮겨보세요</div><div style="margin-top:18px;font-size:15.5px;color:#4b5563;font-weight:600;line-height:1.7;max-width:760px;margin-left:auto;margin-right:auto">거창한 자동화가 아니어도 됩니다. 매주 반복하는 판단 하나를 고르고 — 그 기준을 글로 옮기면 됩니다.</div><div style="display:grid;grid-template-columns:1fr 30px 1fr 30px 1fr;align-items:center;gap:8px;margin-top:24px;max-width:780px;margin-left:auto;margin-right:auto"><div style="padding:18px 14px;background:var(--orange2);border:2px solid var(--orange3);border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">1</div><div style="font-weight:900;font-size:16px;color:#111827">고른다</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px">매주 반복 판단 1개</div></div><div style="text-align:center;font-size:24px;color:#cbd5e1;font-weight:900">→</div><div style="padding:18px 14px;background:var(--orange2);border:2px solid var(--orange3);border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">2</div><div style="font-weight:900;font-size:16px;color:#111827">풀어쓴다</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px">포함·제외·예시</div></div><div style="text-align:center;font-size:24px;color:#cbd5e1;font-weight:900">→</div><div style="padding:18px 14px;background:var(--orange2);border:2px solid var(--orange3);border-radius:14px"><div style="color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.06em;margin-bottom:6px">3</div><div style="font-weight:900;font-size:16px;color:#111827">돌려본다</div><div style="font-size:12.5px;color:#6b7280;margin-top:3px">결과 비교 → 기준 보강</div></div></div><div class="callout dark" style="margin-top:22px"><b>완벽한 1차 기준은 없습니다.</b> 반복하면서 형식화가 완성됩니다.</div></div>`},
{note:'24. 마무리 — 사례 정리 + 핵심 문장.',html:`<div class="paper"><div class="kicker">마무리</div><div class="h2">암묵지 형식화는<br><span class="hl">기준을 꺼내는 일</span>입니다</div><div style="margin-top:18px;display:grid;gap:10px"><div style="padding:13px 16px;background:var(--orange2);border-left:3px solid var(--orange);border-radius:8px;font-size:14px;color:#374151;line-height:1.7"><b style="color:var(--orange)">뉴스 선별</b> — 중요한 뉴스와 제외할 뉴스를 가르는 기준</div><div style="padding:13px 16px;background:var(--blue2);border-left:3px solid var(--blue);border-radius:8px;font-size:14px;color:#374151;line-height:1.7"><b style="color:var(--blue)">원규 검토</b> — 개정안을 볼 때의 5가지 관점</div><div style="padding:13px 16px;background:var(--green2);border-left:3px solid var(--green);border-radius:8px;font-size:14px;color:#374151;line-height:1.7"><b style="color:var(--green)">회의록 작성</b> — 결정사항과 액션아이템을 구분하는 기준</div><div style="padding:13px 16px;background:var(--purple2);border-left:3px solid var(--purple);border-radius:8px;font-size:14px;color:#374151;line-height:1.7"><b style="color:var(--purple)">자소서 평가</b> — "좀 약하다"는 감각을 6개의 평가 기준으로 분해</div></div><div class="callout dark" style="margin-top:18px;padding:16px 20px;font-size:15px;line-height:1.7">AI가 일을 못하는 것이 아니라 — <b>아직 내 기준을 충분히 알려주지 않았을 수 있습니다.</b><br><br>이번 주에는 매주 반복하는 판단 하나를 골라 <b>포함·제외·우수·보완 예시</b>로 정리해보세요. 그게 첫 번째 스킬의 시작점입니다.</div></div>`}
];

const stage=document.getElementById('stage'),dots=document.getElementById('dots');let cur=0,notes=false;
function init(){document.getElementById('tot').textContent=SLIDES.length;SLIDES.forEach((s,i)=>{let el=document.createElement('section');el.className='slide';el.innerHTML='<div class="inner">'+s.html+'</div>';stage.appendChild(el);let d=document.createElement('button');d.className='dot';d.onclick=()=>show(i);dots.appendChild(d)});show(0)}
function show(i){if(i<0||i>=SLIDES.length)return;const old=stage.children[cur];if(old){old.classList.remove('active');old.classList.add('exit');setTimeout(()=>old.classList.remove('exit'),320)}cur=i;const el=stage.children[cur];el.classList.add('active');document.getElementById('cur').textContent=cur+1;document.getElementById('bar').style.width=((cur+1)/SLIDES.length*100)+'%';document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===SLIDES.length-1;document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('on',idx===cur));document.getElementById('noteText').textContent=SLIDES[cur].note;}
document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.getElementById('noteBtn').onclick=()=>{notes=!notes;document.getElementById('notes').classList.toggle('open',notes);document.getElementById('noteBtn').classList.toggle('active',notes)};
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' '].includes(e.key)){e.preventDefault();show(cur+1)} if(['ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();show(cur-1)} if(e.key==='n'||e.key==='N'){document.getElementById('noteBtn').click()} if(e.key==='Escape'&&notes){document.getElementById('noteBtn').click()}});
init();
</script>
</body>
</html>
